# ============================================================================
# FS 平台 · 访问来源管控（IP 白名单 + IP 黑名单 + 客户端 UA 黑名单）
# 2026-10-15 建立 / 2026-10-16 修订（v4）
# ============================================================================
# 目的：只允许「本公司机器」与「本公司脚本工具」访问本平台，阻断外部人
#       拿到账号密码后直接登录；同时把「已确证的爬虫/扫描器」直接挡掉。
#
# 位置：本文件处于 http 上下文（随 /etc/nginx/nginx.conf 的
#       `include /etc/nginx/conf.d/*.conf` 加载）。文件名 fs- 前缀保证它早于
#       iggm-web.conf 按字母序解析。判定结果由
#       /etc/nginx/fs-ip-allowlist.locations.conf 在 server 块内引用。
#
# 三层判定（优先级：黑名单 > UA 黑名单 > 白名单放行）：
#   ① geo $fs_ip_allowed  白名单：命中=放行且不记账
#   ② geo $fs_ip_deny     IP 黑名单：命中=拦（418），与总开关无关
#   ③ map $http_user_agent $fs_ua_deny  UA 黑名单：命中=拦（418）
#   ④ $fs_ip_offlist      白名单外来源=放行（观察模式）但记账
#
# ⚠️ 重要：2026-10-16 发现本机存在一个「反向代理中继」——
#    172.18.108.183（其公网出口为 47.85.170.62）会把外部流量代理进本机，
#    且**不透传真实来源**（只原样转发客户端自带的 X-Forwarded-For，
#    该头可被伪造，绝不能用于放行判定）。
#    ⇒ 所有经该中继进来的请求，$remote_addr 恒为 172.18.108.183，
#      IP 白/黑名单对其**完全无效**；只有第 ③ 层（UA）与行为告警能覆盖它。
#    故本文件把 172.18.108.183 显式排除出白名单（改判为「白名单外」），
#    使其流量进入记账日志，便于统计与告警。
#
# 维护：新增放行来源 -> 在对应区加一行 `<IP 或 CIDR>  1;`
#       新增封禁来源 -> 在 $fs_ip_deny 加一行 `<IP 或 CIDR>  1;`
#       以上均需：nginx -t && systemctl reload nginx
#
# 回退：把 $fs_ip_deny / $fs_ua_deny 对应行删掉即可；整体回退见 .bak 副本。
# ----------------------------------------------------------------------------

geo $fs_ip_allowed {
    default 0;

    # ---- A. 本公司机器出口（人工访问）----------------------------------------
    # 依据：/opt/auth-portal/data/audit.log（登录成功记录）
    45.58.38.172/32     1;   # 主力出口（Atlantic.Net AS6364）· 人 + 脚本共用
    90.96.180.210/32    1;   # 自动化采集出口（吴律工具，经 Cloudflare AS13335）
    45.95.212.151/32    1;   # DY 代理出口
    223.244.89.51/32    1;   # 家宽出口（合肥电信）
    114.88.116.122/32   1;   # 家宽出口（上海电信）

    # ---- B. 脚本工具出口（IP 会在同一 IDC 段内漂移；放行整段以覆盖漂移）----
    # 依据：/var/log/nginx/access.log 中 UA 为空（程序访问）的来源。
    # 若脚本漂到下列段之外被挡：看钉钉告警 / 拒绝页显示的 IP，按其所在 /24 追加一行。
    43.228.212.0/24     1;   # Atlantic.Net AS6364（脚本实测 .186 / .158）
    173.249.200.0/23    1;   # tzulo AS11878 注册段（脚本实测 .200.124）
    173.249.209.0/24    1;   # tzulo AS11878 注册段（脚本实测 .209.90）
    152.175.0.0/16      1;   # ISIF OU AS209554（脚本跨 .33 / .66 / .97 漂移）
    45.95.212.0/24      1;   # ★2026-10-16 新增：与 152.175.0.0/16 同属
                             #   AS209554 ISIF OU，即同一脚本服务商的另一出口段。
                             #   实证：仅本 /24 内 .122/.211/.132/.97 共 8000+ 次
                             #   以账号 wulv 访问 /mlb/api/*、/api/fc27/cloud/*
                             #   全部 200 —— 确认为本公司脚本，非扫描器。
                             #   （与 A 区 45.95.212.151 同段，说明该段是代理池；
                             #     如需收紧可改为逐个 /32，但脚本会随漂移被挡。）

    # ---- C. 基础设施：本机 / 内网 / 服务器自身公网 ---------------------------
    127.0.0.0/8        1;
    172.16.0.0/12      1;
    10.0.0.0/8         1;
    192.168.0.0/16     1;
    47.85.224.112/32   1;

    # ---- C2. 中继例外：显式改判为「白名单外」（/32 比上面 /12 更精确，优先生效）
    # 原因见文件头「⚠️ 重要」：它是不可信入口，必须记账 + 受 UA 层管控。
    172.18.108.183/32   0;

    # ---- D. 钉钉官方 Bot（消息卡片链接预览抓取）------------------------------
    59.82.0.0/16       1;
}

# ACME 验证路径对所有来源开放：
# 本机证书是 Let's Encrypt 短周期（shortlived，约 6 天），fc27-ip-certificate.timer
# 每 12 小时 webroot 续期，验证来源 IP 不固定。若被挡，证书数天内过期 → 全站 HTTPS 中断。
map $request_uri $fs_is_acme {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

# ============================================================================
# 记账判定（与拦截解耦）：非白名单 且 非 ACME -> 1
# ============================================================================
# ★2026-10-16 21:36 应用户要求「去掉白名单」：白名单层已停用。
#   $fs_ip_offlist 恒 0 ⇒ 任何来源都不再被判为「白名单外」，也不再因此写 ip-denied.log。
#   恢复白名单记账：把下面改回  "0:0" 1;   然后 nginx -t && systemctl reload nginx
map "$fs_ip_allowed:$fs_is_acme" $fs_ip_offlist {
    default 0;
}

# ============================================================================
# 拦截判定：
#    观察模式（全量放行）："0:0" 0;   <- 当前
#    启用拦截：            "0:0" 1;
# ============================================================================
# ★2026-10-16 21:36 白名单层停用 ⇒ 拦截开关恒 0（不再按来源 IP 限制访问）。
#   防误操作提示：以后即使想重启拦截，也请先把 $fs_ip_offlist 改回「白名单外=1」。
map "$fs_ip_allowed:$fs_is_acme" $fs_ip_block {
    default 0;
}

# ============================================================================
# 2026-10-16 17:20 · IP 黑名单（BLACKLIST）· 优先级高于总开关
# ----------------------------------------------------------------------------
# 作用：命中即拦（无论总开关是「观察模式」还是「启用拦截」）。
# 选入标准：已用日志确证为爬虫/扫描器/渗透工具（来源 IP 非本公司、路径为
#           渗透特征路径、或 UA 直接写着工具名），且**排除**所有已确认友军。
# 维护：新增 -> 加一行 `<IP>/32  1;`；解除 -> 删掉对应行；均需 reload。
# ============================================================================
geo $fs_ip_deny {
    default 0;

    # ---- ① 已取证的外部入侵来源 ---------------------------------------------
