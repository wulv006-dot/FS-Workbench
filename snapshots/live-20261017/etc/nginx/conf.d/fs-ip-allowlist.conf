    80.94.95.211/32     1;   # 保加利亚 SS-Net · 9226 次，9030 个 404

    # ---- ③ 渗透工具来源（UA 也拦，这里再做 IP 兜底）---------------------------
    34.77.147.70/32     1;   # BT 比利时 Google Cloud · Go Web Pentest Tool
