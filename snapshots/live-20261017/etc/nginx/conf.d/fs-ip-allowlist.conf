# ============================================================================
# 2026-10-16 18:00 · 客户端 UA 黑名单（$fs_ua_deny）
# ----------------------------------------------------------------------------
# 为什么需要它：内网中继 172.18.108.183（公网 47.85.170.62）把外部流量代理进
#   本机时，$remote_addr 恒为代理地址，IP 白/黑名单**看不见真实来源**。
#   此时唯一仍然有效的、与来源无关的判据就是「客户端特征（UA）」。
#
# 选入标准：UA 直接暴露为渗透工具 / 批量扫描器（误伤面为 0 —— 正常用户与
#   本公司脚本不会使用这些字符串）。命中即拦（418），与总开关无关。
# 注意：**不含 curl / wget / python-requests** —— 本公司脚本可能使用它们。
# ============================================================================
map $http_user_agent $fs_ua_deny {
    default 0;
    "~*Go Web Pentest Tool"     1;   # 越南 VNG 等来源的渗透框架
    "~*l9tcpid"                 1;   # LeakIX 扫描组件
    "~*l9explore"               1;   # LeakIX 扫描组件
    "~*libredtail"              1;   # 僵尸网络扫描框架（数十个 IP 共用）
    "~*WebSiphon"               1;   # 批量爬取框架
    "~*c2scan"                  1;   # C2 探测
    "~*zgrab"                   1;   # 全网测绘（含 ShadowServer 的 MGLNDD）
    "~*masscan"                 1;
    "~*nuclei"                  1;   # 漏洞扫描器
    "~*sqlmap"                  1;
    "~*Nikto"                   1;
    "~*WPScan"                  1;
    "~*Acunetix"                1;
    "~*Netsparker"              1;
    "~*CensysInspect"           1;
    "~*Stretchoid"              1;
    "~*InternetMeasurement"     1;   # internet-measurement.com 测绘
    "~*Palo Alto Networks"      1;   # Cortex Xpanse 测绘
    "~*Expanse"                 1;
    "~*Shadowserver"            1;
    "~*ApcosysBot"              1;   # SEO 爬虫
    "~*Infrawatch"              1;
    "~*research-scan"           1;
}

# 记账合并判定：命中任一层（白名单外 / UA 黑名单 / IP 黑名单）即写 ip-denied.log
# 供统计与告警使用。写成三个变量的组合，避免「已在白名单但被黑名单命中」时漏记。
map "$fs_ip_offlist:$fs_ua_deny:$fs_ip_deny" $fs_ip_logged {
    default 1;
    "0:0:0" 0;
}
