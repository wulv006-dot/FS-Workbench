# >>> aion2-gold-xlsx (auto) >>>
    # AION2 金币价 Excel 下载：钉钉自定义机器人不支持发附件，只能发链接。
    # 钉钉里点链接时没有登录态，走 /dashboard/ 会被 auth_request 弹到登录页（HTTP 302），
    # 所以在根路径开一个带随机 token 的免登录精确匹配入口，只指向固定的 latest.xlsx。
    # token 是 16 字节随机十六进制，防被遍历猜到；改 token 只需改这一处 + aion2_watch.py 的 URL。
    location = /a2g/611ba7ac2a4cd01f079d76d1b244203a/latest.xlsx {
        if ($request_method != GET) { return 405; }
        alias /var/www/dashboard/aion2-gold/latest.xlsx;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition "attachment; filename=\"AION2-gold.xlsx\"" always;
        add_header Cache-Control "no-store" always;
        # 文件不存在时给可读提示，而不是 nginx 默认 404 页
        error_page 404 = @a2g_missing;
    }
    location @a2g_missing {
        default_type text/plain;
        return 404 "AION2 金币价 Excel 还没生成，请等下一轮采集（约 15 分钟内）。\n";
    }
