    location /s/wulv/fc27-ops/ {
        alias /var/www/sites/wulv/fc27-ops/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;

        # 1) 先让门禁服务判定
        auth_request /__fc27_verify;
        auth_request_set $fc27_user $upstream_http_x_fc27_user;
        auth_request_set $fc27_role $upstream_http_x_fc27_role;
        add_header X-Fc27-User $fc27_user always;
        add_header X-Fc27-Role $fc27_role always;

        # 2) 未登录 -> 302 到登录页（带上回跳地址）
        error_page 401 = @fc27_login;
    }

    location @fc27_login {
        return 302 /__auth/access/?next=$request_uri;
    }

    location = /__fc27_verify {
        internal;
        proxy_pass http://127.0.0.1:8895/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # 注册 / 登录 / 登出 / 管理页 —— 交给门禁服务自己渲染
    # 统一收在 /fc27/ 命名空间下，避免占用主站的 /login、/admin 等通用路径
    location = /fc27        { return 302 /fc27/login; }
    location /fc27/ {
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8896/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
