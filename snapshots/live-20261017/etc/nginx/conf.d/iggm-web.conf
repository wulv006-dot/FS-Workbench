map "$scheme:$uri" $fc27_https_redirect {
    default 0;
    ~^http:/dashboard(?:/|$) 1;
    ~^http:/api/fc27/cloud/ 1;
}

server {
    if ($fc27_https_redirect) {
        return 308 https://$host$request_uri;
    }
    listen 80 default_server;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/47.85.224.112/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.85.224.112/privkey.pem;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 2m;
    # >>> fs-ip-allowlist-20261015 >>>
    include /etc/nginx/fs-ip-allowlist.locations.conf;
    # <<< fs-ip-allowlist-20261015 <<<
    # >>> fs-hub-nav (auto) >>>
    # 全站统一导航条：在 </body> 前注入脚本。唯一真源 /var/www/hub/hubnav.js
    # 只作用于 text/html（/dashboard/api/ 的 csv/json 不受影响）
    sub_filter_once on;
    sub_filter '</body>' '<script src="/__hub/hubnav.js?v=20260930nav2"></script></body>';

    # 导航条脚本本体（无鉴权：只是前端脚本，不含任何凭据）
    location /__hub/ {
        alias /var/www/hub/;
        # 2026-09-29 性能优化：原为 "no-cache, must-revalidate"，即每次打开任一页面
        # 都要重新发请求校验一遍。该脚本被 sub_filter 注入到所有站点页面，
        # 跨境单次往返约 0.6s，而它极少变动。
        # 改为 10 分钟内直接命中浏览器本地缓存（省掉往返），同时保证脚本更新后
        # 最多 10 分钟自动生效。紧急改版可临时下调 max-age 或改文件名加版本号。
        add_header Cache-Control "public, max-age=600";
        types { application/javascript js; }
        charset utf-8;
        charset_types application/javascript;
        default_type application/javascript;
    }
    # <<< fs-hub-nav (auto) <<<


    # >>> auth-portal >>>
    # 统一登录门户：HTML 登录页 + 签名 Cookie 会话，替代 Basic Auth 原生弹窗。
    # 2026-09-30 正式切换完成：全站 10 处业务入口已由 auth_basic 改为 auth_request，
    # 浏览器原生密码框不再出现；未登录访问任何入口一律 302 回本登录页。
    location = /__auth { return 301 /__auth/access/; }
    location /__auth/ {
        if ($scheme = http) { return 308 https://47.85.224.112$request_uri; }
        # server 级 sub_filter 会往每个 </body> 注入全站导航条；
        # 登录页是独立门面，这里用同值替换覆盖掉注入，保持页面干净。
        sub_filter "</body>" "</body>";
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8895/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # auth_request 子请求端点（internal，外部不可直接访问）
    location = /__auth_verify {
        internal;
        proxy_pass http://127.0.0.1:8895/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # 部署通道专用校验端点：除登录外还要求 deploy 组成员（mmoexp 不在其中）
    location = /__auth_verify_deploy {
        internal;
        proxy_pass http://127.0.0.1:8895/verify?group=deploy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # 未登录 / 会话过期 -> 回登录页并记住原地址
    location @auth_login {
        return 302 /__auth/access/?next=$request_uri;
    }

    # 已登录但无该模块权限 -> 回登录页并说明原因
    location @auth_noperm {
        return 302 /__auth/access/?err=noperm&next=$request_uri;
    }
    # <<< auth-portal <<<
