    # 只读接口，X-Api-Key 鉴权，不带 Basic Auth
    location /dashboard/api/ {
        alias /var/www/dashboard/;

        # mime.types 默认不含 csv，这里显式声明本接口用到的类型
        types {
            application/json  json;
            text/csv          csv;
            text/html         html;
        }
        default_type application/json;

        # 只读：除 GET / HEAD 外一律拒绝
        if ($request_method !~ "^(GET|HEAD)$") {
            return 405 '{"error":"read-only endpoint: GET/HEAD only"}';
        }
        if ($http_x_api_key != "428ac430e0b6bcd7c6c4eccc1e624d37e0994db287e33a56") {
            return 401 '{"error":"missing or invalid X-Api-Key"}';
        }

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
