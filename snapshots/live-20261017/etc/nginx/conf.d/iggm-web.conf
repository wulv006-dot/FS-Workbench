# G2G 金币改价系统 · nginx 片段（供审核，勿直接覆盖线上）
#
# 目标文件：/etc/nginx/conf.d/iggm-web.conf （**共享配置**，吴律主导）
# 插入位置：紧跟在 `# <<< d4follow (auto) <<<` 那一行之后
#          （即 `location /d4/` 块结束、`# >>> nba2k27-reprice >>>` 之前）
#
# 与 /d4/ 的唯一差别：后端端口 8903（/d4/ 是 8900）、超时 900s。
# 鉴权沿用统一登录门户：auth_request /__auth_verify（任意已登录用户可进）。
# 全站导航条（/__hub/hubnav.js 的 sub_filter 注入）是 server 级的，本块无需额外处理。

    # >>> g2gfollow (auto) >>>
    # G2G 金币改价系统在线看板（AION2 Kinah · 后端 127.0.0.1:8903）。
    # 2026-10-10 新建，独立于 d4follow：独立目录 /opt/g2gfollow、独立 service、
    # 独立 SQLite，运行时不读不写 d4follow 任何文件。
    location = /g2g { return 301 /g2g/; }
    location /g2g/ {
        auth_request /__auth_verify;
        error_page 401 = @auth_login;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8903/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 采集 DD373 成本较慢（每区回溯订单簿，1~3 分钟），但采集走后台线程、
        # 前端是轮询，单请求本身是短的；这里给 900s 只为兜住极端慢请求。
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
