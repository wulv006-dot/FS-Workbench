# >>> deploy-hub (auto) >>>
    # 自助部署通道：同事上传工具包 -> /s/<用户名>/<工具名>/
    # 写通道要「部署权限」（独立密码文件，只放该放的人）

    # 下载上传工具（不含任何凭据，放开认证方便同事取用）
    location = /deploy/api/client.py {
        proxy_pass http://127.0.0.1:8898/api/client.py;
        proxy_set_header Host $host;
    }

    location = /deploy { return 301 /deploy/; }
    location /deploy/ {
        auth_request /__auth_verify_deploy;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @auth_login;
        error_page 403 = @auth_noperm;

        # 工具包可能几十 MB，必须单独放宽（server 级默认只有 2m）
        client_max_body_size 120m;

        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8898/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关键：把已登录用户名注入后端，决定「这次发布算谁的」（auth_request 提供，原为 $remote_user）
        proxy_set_header X-Remote-User $auth_user;

        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # 已发布的工具站点（读权限，用共用的看板账号，所有人可见）
    location = /s { return 301 /s/; }
    location /s/ {
        alias /var/www/sites/;
        index index.html;
        autoindex off;
        auth_request /__auth_verify;
        error_page 401 = @auth_login;
        # 工具是随时改的，别让浏览器缓存住旧版本
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
    # <<< deploy-hub (auto) <<<

    # >>> d4follow (auto) >>>
    # D4 IGGM 跟价系统在线看板（后端 127.0.0.1:8900）。
    # 2026-09-23：测试前加鉴权；2026-09-30 由 Basic Auth 改为统一登录门户的 auth_request 会话。
    location = /d4 { return 301 /d4/; }
    location /d4/ {
        auth_request /__auth_verify;
        error_page 401 = @auth_login;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8900/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 实时日志走 SSE：必须关掉缓冲，否则日志会被攒着一次性吐出
        proxy_buffering off;
        proxy_cache off;
        # 2026-09-29 性能优化：此处原有的 "gzip off" 已移除。
        # 它本意是保护 SSE 实时日志（/d4/api/logs/<tid>）不被 gzip 缓冲，
        # 但写在 location 级别，导致首页 HTML 与全部 JSON 接口一起不能压缩——
        # 而首屏载荷高达 449KB，跨境传输要 4~5 秒。
        # 现在改由 http 块统一开 gzip，且 gzip_types 不含 text/event-stream，
        # SSE 日志本就不会被压缩，无需在整块上关闭。
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
