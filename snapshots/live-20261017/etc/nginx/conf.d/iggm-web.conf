    # >>> nba2k27-reprice >>>
    # NBA 2K27 VC 自动改价控制台（部门同事 DY 交付的部署包，2026-09-30 落地到本机）
    # 前端静态目录 /var/www/nba2k27/；接口反代 127.0.0.1:8765（服务 nba-reprice.service）
    # 整块走统一登录门户 auth_request；后端只监听 127.0.0.1，8765 不暴露公网
    location = /nba2k27 { return 301 /nba2k27/; }
    location /nba2k27/api/ {
        auth_request /__auth_verify;
        error_page 401 = @auth_login;
        # 注意：proxy_pass 必须带 /api/ 前缀。写 8765/ 会把 /nba2k27/api/health
        # 译成后端 /health（404），因为 nginx 只替换匹配到的前缀部分。
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 读采购价需登录后台并识别验证码、竞品抓取走 curl，慢时可达 1~3 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
    location /nba2k27/ {
        auth_request /__auth_verify;
        error_page 401 = @auth_login;
        alias /var/www/nba2k27/;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
    # <<< nba2k27-reprice <<<


    # 2026-09-23：首页统一入口改为运营中枢看板；原 MMOEXP 价格主站反代保留为兜底
    location = / { return 301 /dashboard/; }

    # >>> fc27-gallery-cloud >>>
    location = /tools/fc27-gallery { return 301 /tools/fc27-gallery/; }
    location /tools/fc27-gallery/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_request /__auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @auth_login;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8902/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Authenticated-User $auth_user;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    # <<< fc27-gallery-cloud <<<

    location = /tools/fc27-players { return 301 /tools/fc27-players/; }
    location /tools/fc27-players/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_request /__fc27_verify;
        auth_request_set $fc27_player_user $upstream_http_x_fc27_user;
        auth_request_set $fc27_player_role $upstream_http_x_fc27_role;
        error_page 401 = @fc27_login;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8901/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Fc27-User $fc27_player_user;
        proxy_set_header X-Fc27-Role $fc27_player_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 120s;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # >>> mlb-online (auto) >>>
    # MLB 新卡上架在线工作台：前端页面 + 任务队列（后端 127.0.0.1:8897）
    # 采集由本机执行器完成（服务器出口 IP 过不了 showdd 的 Cloudflare 挑战）
    location = /mlb { return 301 /mlb/; }
    location /mlb/ {
        auth_request /__auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @auth_login;

        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8897/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关键：把已登录用户名注入后端，决定「这次提交算谁的」（auth_request 提供，原为 $remote_user）
        proxy_set_header X-Remote-User $auth_user;

        client_max_body_size 64m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
    # <<< mlb-online (auto) <<<

    include /etc/nginx/madden-location.conf;
    include /etc/nginx/fc27-sbc-location.conf;
}
