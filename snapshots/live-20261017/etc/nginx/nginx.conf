
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # 2026-09-29 性能优化：此前 gzip 全程关闭（本行原为注释，且 /d4/ location 内另有一行
    # 显式 "gzip off"）。跨境链路实测吞吐仅约 80KB/s，而 /d4/ 首屏未压缩载荷约 449KB
    # （首页 HTML 100KB + /api/state 247KB + /api/local/jobs 79KB + hubnav.js 18.5KB），
    # 单次首屏传输就需要 4~5 秒。开启 gzip 后 JSON/HTML 可压缩到约 1/8。
    # 注意：gzip_types 不包含 text/event-stream，故 /d4/api/logs/<tid> 的 SSE
    # 实时日志不会被压缩或缓冲，行为保持不变。
    gzip                on;
    gzip_min_length     1024;
    gzip_comp_level     5;
    gzip_proxied        any;
    gzip_vary           on;
    gzip_disable        "msie6";
    gzip_types          text/plain text/css text/xml text/javascript
                        application/javascript application/x-javascript
                        application/json application/xml
                        application/rss+xml image/svg+xml;

    # 2026-09-29 性能优化：启用 TLS 会话复用。
    # 此前未配置，nginx 默认 ssl_session_cache off —— 每次新连接都要走完整
    # 2-RTT 握手。跨境单次 RTT 约 250ms，同事重新打开页面时白白多花一个往返。
    # 开启共享会话缓存 + session ticket 后，重复访问可走 1-RTT（甚至 0-RTT）复用握手。
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  on;

    include /etc/nginx/conf.d/*.conf;
}
