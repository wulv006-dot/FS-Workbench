# >>> fs-ip-allowlist-20261015 >>>
# ============================================================================
# FS 平台 · 访问来源管控（server 级判定）· v4（2026-10-16 18:00）
# ============================================================================
# 由 iggm-web.conf 的 server 块 include；判定变量定义于
# /etc/nginx/conf.d/fs-ip-allowlist.conf（http 上下文）：
#   $fs_ip_offlist  白名单外（记账用）
#   $fs_ip_block    白名单拦截总开关（当前=观察模式，恒 0）
#   $fs_ip_deny     IP 黑名单
#   $fs_ua_deny     客户端 UA 黑名单
#   $fs_ip_logged   记账合并判定（off-list 或 UA 命中 → 写 ip-denied.log）
#
# 判定顺序（自上而下，先命中先返回）：
#   ① $fs_ip_deny    → 418 → @fs_ip_denied
#   ② $fs_ua_deny    → 419 → @fs_ua_denied
#   ③ $fs_ip_block   → 418（观察模式恒 0，不触发）
#
# 设计要点
#  1) 非白名单 / UA 命中请求单独记一份日志 → 由
#     /opt/auth-portal/fs_ip_alert.py（异常行为告警）与
#     fs_ip_observe_report.py（每小时统计）消费。
#     这里显式重复主 access.log：nginx 的 access_log 一旦在 server 级出现
#     就不再继承 http 级定义，不重复会导致主访问日志丢记录。
#  2) 拦截用「专用状态码 + 私有 location」而不是 error_page 403：
#     本 server 内多个 location 会因权限不足返回 403（统一登录门户的
#     auth_request），若改 error_page 403 会把「无权限」误显示成「来源受限」。
#     418/419 不被任何业务使用，可安全独占。
#  3) 拒绝页回显 $remote_addr，便于本人/同事被误拦时直接报 IP 加白名单。
#  4) ★2026-10-16 新增 UA 层：内网中继 172.18.108.183（公网 47.85.170.62）
#     会把外部流量代理进本机且不透传真实来源 → IP 层对其无效，只有 UA 层能覆盖。
# ----------------------------------------------------------------------------

access_log /var/log/nginx/access.log main;
access_log /var/log/nginx/ip-denied.log main if=$fs_ip_logged;

# ---- ① IP 黑名单：命中即拒（优先级最高，与总开关无关）-------------------
# 请求同时会被 ip-denied.log 记账（非白名单 → $fs_ip_logged=1）。
if ($fs_ip_deny) {
    return 418;
}

# ---- ② 客户端 UA 黑名单：命中即拒（覆盖经中继进来的扫描器）---------------
if ($fs_ua_deny) {
    return 419;
}

# ---- ③ 白名单拦截：观察模式下 $fs_ip_block 恒为 0，不触发；保留以便恢复拦截 --
if ($fs_ip_block) {
    return 418;
}

error_page 418 = @fs_ip_denied;
error_page 419 = @fs_ua_denied;

location @fs_ip_denied {
    default_type text/html;
    return 403 "<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>访问受限</title></head><body style='margin:0;padding:48px 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f7f9;color:#24292f'><div style='max-width:620px;margin:0 auto;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:36px 32px;box-shadow:0 1px 3px rgba(27,31,36,.06)'><div style='font-size:12.5px;letter-spacing:.08em;color:#8c959f;text-transform:uppercase'>FS Platform</div><h1 style='margin:6px 0 10px;font-size:21px;line-height:1.4'>403 · 访问来源受限</h1><p style='margin:0 0 22px;color:#57606a;line-height:1.7'>本平台已启用访问来源管控，你当前的公网地址已被列入禁止名单，本次访问已被记录。</p><div style='background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px'><span style='color:#57606a'>你的公网 IP：</span><b style='color:#cf222e'>$remote_addr</b></div><p style='margin:22px 0 0;color:#57606a;line-height:1.7;font-size:14px'>如果你认为这是误拦（正常办公网络），请把上面这个 IP 发给管理员处理。</p><p style='margin:10px 0 0;color:#8c959f;font-size:12.5px'>时间：$time_iso8601</p></div></body></html>";
}

location @fs_ua_denied {
    default_type text/html;
    return 403 "<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>访问受限</title></head><body style='margin:0;padding:48px 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f7f9;color:#24292f'><div style='max-width:620px;margin:0 auto;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:36px 32px;box-shadow:0 1px 3px rgba(27,31,36,.06)'><div style='font-size:12.5px;letter-spacing:.08em;color:#8c959f;text-transform:uppercase'>FS Platform</div><h1 style='margin:6px 0 10px;font-size:21px;line-height:1.4'>403 · 客户端特征受限</h1><p style='margin:0 0 22px;color:#57606a;line-height:1.7'>本平台禁止使用扫描/渗透类客户端访问。本次访问已被记录。</p><div style='background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px'><span style='color:#57606a'>来源：</span><b style='color:#cf222e'>$remote_addr</b><br><span style='color:#57606a'>特征：</span>$http_user_agent</div><p style='margin:22px 0 0;color:#57606a;line-height:1.7;font-size:14px'>如果你是本公司同事、只是用了被误判的工具，请把上面的特征信息发给管理员。</p><p style='margin:10px 0 0;color:#8c959f;font-size:12.5px'>时间：$time_iso8601</p></div></body></html>";
}
# <<< fs-ip-allowlist-20261015 <<<
