# All currently authenticated accounts may read, including visitors. Anonymous denied.
# No admin group requirement for this read-only module. No write actions are exposed.
location = /dashboard/marketing {
    return 302 /dashboard/marketing/;
}
location ^~ /dashboard/marketing/ {
    alias /var/www/mmoexp-marketing/current/;
    index index.html;
    autoindex off;
    auth_request /__auth_verify;
    add_header Cache-Control "no-store" always;
    limit_except GET { deny all; }
}
location ^~ /dashboard/api/marketing/ {
    return 404;
}
