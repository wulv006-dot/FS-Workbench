# =============================================================================
# Madden NFL 27 Coins 工作台 —— 由 /etc/nginx/conf.d/iggm-web.conf 里的
# 一行 include 引入（放在 server{} 块内）。要下线：注掉那一行即可。
#
# 形状照抄同站已跑通的 FC27：
#   页面  /dashboard/madden27-coins.html（静态，复用现有 /dashboard/ location）
#   接口  /api/madden/cloud/*  → 127.0.0.1:8792
#
# ★ auth_request 必须保留：全站都在统一登录后面，
#   少了它就会开出一个唯一的免登录写价入口。
#   实测 /__auth_verify：已登录 200 / 未登录 401，正是 auth_request 要的语义。
#
# ★ proxy_pass 结尾**不带 /** —— Madden 的 server.py 里
#   API = "/api/madden/cloud"，靠完整路径做路由；
#   带 / 的话 nginx 会把前缀剥掉，路由就对不上了（FC27 那边是带 / 的，
#   因为它的 app 路由在 /health 上——两个项目写法不同，别照抄）。
# =============================================================================
location /api/madden/cloud/ {
    auth_request /__auth/verify;
    error_page 401 = @madden_need_login;

    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 一轮采集要开 Chromium，几十秒到几分钟；别让 nginx 先超时
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_buffering       off;
    proxy_request_buffering off;
}

location @madden_need_login {
    return 302 /__auth/login?next=$request_uri;
}
