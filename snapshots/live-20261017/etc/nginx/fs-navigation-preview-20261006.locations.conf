# Fixed four-file preview. No directory-wide alias, credentials or business proxy.
location = /__nav_preview_native_session {
    internal;
    proxy_pass http://127.0.0.1:8895/status;
    proxy_method HEAD;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 302 =401 @nav_preview_native_denied;
}
location @nav_preview_native_denied { return 401; }
location = /dashboard/__preview/navigation-20261006/analytics/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 302 /dashboard/__preview/navigation-20261006/analytics/index.html$is_args$args;
}
location = /dashboard/__preview/navigation-20261006/analytics/index.html {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_preview_native_session;
    error_page 401 = @auth_login;
    alias /var/www/fs-nav-preview/20261006/analytics/index.html;
    disable_symlinks on;
    expires -1;
    sub_filter "</body>" "</body>";
}
location = /dashboard/__preview/navigation-20261006/analytics/shell.js {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_preview_native_session;
    error_page 401 = @auth_login;
