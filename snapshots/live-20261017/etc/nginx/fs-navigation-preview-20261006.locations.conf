}
location = /dashboard/__preview/navigation-20261006/analytics/frame-theme.css {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_preview_native_session;
    error_page 401 = @auth_login;
    alias /var/www/fs-nav-preview/20261006/analytics/frame-theme.css;
    disable_symlinks on;
    expires -1;
    sub_filter "</body>" "</body>";
}
location ^~ /dashboard/__preview/navigation-20261006/ { return 404; }
