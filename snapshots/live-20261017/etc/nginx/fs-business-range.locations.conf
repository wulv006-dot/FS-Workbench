location = /dashboard/fs-home/range.json {
    if ($request_method != GET) { return 405; }
    auth_request /__auth_verify;
    auth_request_set $fs_range_user $upstream_http_x_auth_user;
    proxy_pass http://127.0.0.1:8931/range;
    proxy_set_header X-Auth-User $fs_range_user;
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

location = /api/fs/v1/profiles {
    if ($scheme != "https") { return 426; }
    if ($request_method != GET) { return 405; }
    auth_request off;
    access_log off;
    proxy_pass http://127.0.0.1:8933;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Remote-User "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}

location = /api/fs/v1/statistics {
