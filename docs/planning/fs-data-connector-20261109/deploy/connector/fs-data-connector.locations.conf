# FS read-only connector. Preserve the complete URI and never log OAuth query strings.
location ^~ /connector/ {
    auth_request off;
    proxy_pass http://127.0.0.1:8937;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    client_max_body_size 64k;
    access_log off;
}
location = /.well-known/oauth-authorization-server/connector {
    auth_request off;
    proxy_pass http://127.0.0.1:8937;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    client_max_body_size 64k;
    access_log off;
}
location = /.well-known/oauth-protected-resource/connector/mcp {
    auth_request off;
    proxy_pass http://127.0.0.1:8937;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    client_max_body_size 64k;
    access_log off;
}
