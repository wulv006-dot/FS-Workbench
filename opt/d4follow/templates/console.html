t:checked::before{transform:translateX(16px)}.rp-side{padding:24px;border:1px solid var(--rp-line);border-radius:12px;background:var(--rp-surface)}.rp-side h2{margin-bottom:16px}.rp-side dl{margin:0;display:grid;gap:16px}.rp-side dt{font-size:12px;line-height:16px;color:var(--rp-muted);margin-bottom:4px}.rp-side dd{margin:0;overflow-wrap:anywhere}.rp-side p{font-size:12px;line-height:16px;color:var(--rp-muted);margin-top:24px}.rp-savebar{position:sticky;bottom:16px;z-index:40;margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border:1px solid var(--rp-line);border-radius:12px;background:var(--rp-surface);box-shadow:0 8px 32px #14283c14}.rp-savebar strong{display:block}.rp-savebar small{display:block;color:var(--rp-muted);margin-top:4px;font-size:12px;line-height:16px}.rp-preview{margin-top:24px}.rp-preview .rp-box-head{align-items:flex-start}.rp-preview .rp-box-head p{margin-top:4px;color:var(--rp-muted)}.rp-preview-footer{padding:16px 24px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--rp-line)}.rp-before{color:var(--rp-muted);text-decoration:line-through}.rp-after{color:var(--rp-brand);font-weight:600}.rp-history-detail{padding:8px 0;display:grid;gap:8px}.rp-history-line{display:flex;gap:8px;flex-wrap:wrap}.rp-dialog{max-width:480px;width:calc(100% - 32px);border:1px solid var(--rp-line);border-radius:16px;padding:24px;background:var(--rp-surface);color:var(--rp-text)}.rp-dialog::backdrop{background:#10202480}.rp-dialog p{margin:16px 0 24px;color:var(--rp-muted)}.rp-dialog .rp-actions{justify-content:flex-end}.rp-skeleton{height:16px;background:var(--rp-line);border-radius:4px;opacity:.55;animation:rp-pulse 1.8s cubic-bezier(.22,1,.36,1) infinite}.rp-skeleton.large{height:32px;width:45%;margin:16px 0}.rp-skeleton.short{width:65%}.rp-loading-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.rp-loading-card{padding:24px;background:var(--rp-surface);border:1px soli @media(min-width:1600px){.rp-gamegrid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1199px){.rp-gamegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-formlayout{grid-template-columns:minmax(0,1fr)}.rp-side dl{grid-template-columns:repeat(3,minmax(0,1fr))}.rp-side p{margin-top:16px}}@media(max-width:767px){.rp-shell{padding:24px 16px 80px}.rp-topline{align-items:flex-start;flex-direction:column;gap:16px;margin-bottom:24px}.rp-nav{width:100%}.rp-nav a{flex:1;justify-content:center}.rp-nav svg{display:none}.rp-pagehead{flex-direction:column;gap:16px}.rp-pagehead .rp-actions{width:100%}.rp-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px}.rp-stat{padding:16px}.rp-stat .statvalue{font-size:24px;line-height:32px}.rp-stat .statvalue.text{font-size:16px;line-height:24px}.rp-gamegrid{grid-template-columns:minmax(0,1fr)}.rp-game{padding:24px}.rp-sectionhead{flex-wrap:wrap}.rp-search{max-width:100%}.rp-sectionhead .rp-search{max-width:100%}.rp-fields{grid-template-columns:minmax(0,1fr)}.rp-fieldgroup{padding:24px 16px}.rp-side{padding:24px 16px}.rp-side dl{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-savebar{padding:16px;flex-wrap:wrap;bottom:8px}.rp-savebar .rp-actions{width:100%}.rp-savebar .rp-actions .rp-button{flex:1}.rp-box-head{padding:16px;flex-wrap:wrap}.rp-preview-footer{padding:16px}.rp-loading-grid{grid-template-columns:minmax(0,1fr)}.rp-loading-card:nth-child(n+3){display:none}.heading-4{font-size:24px;line-height:32px}.rp-table{min-width:640px}.rp-table.settings-diff{min-width:420px}.rp-game-top{flex-wrap:wrap}.rp-game-top .rp-pill{margin-left:auto}.rp-meta{gap:8px}.rp-tabs{gap:8px}.rp-tabs a,.rp-tabs button{padding:8px 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

<body>
<div class="rp-shell" id="pricingConsole">
 <div class="rp-topline">
  <a class="rp-brandline" id="brandLink" href="#"><span class="rp-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18V8m6 10V4m6 14v-7m4 9H2M3 7l6-4 6 7 6-5"/></svg></span><span>游戏改价中心<small>RPG PRICING</small></span></a>
  <nav class="rp-nav" aria-label="改价中心导航"><a data-nav="home" href="#">游戏总览</a><a data-nav="history" href="#">改价记录</a><a data-nav="maintenance" href="#">系统维护</a></nav>
 </div>
 <main id="mainContent" aria-busy="true"><div class="rp-pagehead"><div><h1 class="heading-4">正在读取改价中心</h1><p>获取各游戏的当前状态。</p></div></div><div class="rp-loading-grid" aria-label="正在加载"><div class="rp-loading-card"><div class="rp-skeleton short"></div><div class="rp-skeleton large"></div><div class="rp-spacer"></div><div class="rp-skeleton"></div></div><div class="rp-loading-card"><div class="rp-skeleton short"></div><div class="rp-skeleton large"></div><div class="rp-spacer"></div><div class="rp-skeleton"></div></div><div class="rp-loading-card"><div class="rp-skeleton short"></div><div class="rp-skeleton large"></div><div class="rp-spacer"></div><div class="rp-skeleton"></div></div></div></main>
 <p class="rp-footnote" id="pageFootnote">参数按游戏独立管理，保存后由下一轮任务读取。</p>
</div>
<div class="sr-only" id="liveStatus" role="status" aria-live="polite"></div>
<dialog class="rp-dialog" id="leaveDialog" aria-labelledby="leaveTitle"><h2 class="heading-6" id="leaveTitle">还有未保存的修改</h2><p>离开后，这次尚未保存的参数会丢失。</p><div class="rp-actions"><button class="rp-button" id="keepEditing">继续编辑</button><button class="rp-button danger" id="discardLeave">放弃修改并离开</button></div></dialog>
<script>
(() => {
 'use strict';
 const BASE = {{ base_path|tojson }};
 const PAGE = {{ page|default('home')|tojson }};
 const GAME = {{ game_id|default('')|tojson }};
 const root = document.getElementById('mainContent');
 const $ = (s, p=document) => p.querySelector(s);
 const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon = name => '<svg aria-hidden="true" viewBox="0 0 24 24">'+({refresh:'<path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/>',arrow:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',empty:'<path d="M4 5h16v14H4zM8 9h8M8 13h5"/>',back:'<path d="m14 5-7 7 7 7"/>'}[name]||'')+'</svg>';
 const href = p => BASE.replace(/\/?$/, '/') + p.replace(/^\//,'');
 const routeGame = (id,part='') => href('games/'+encodeURIComponent(id)+'/'+part);
 const known = v => v !== null && v !== undefined && v !== '';
 const val = (v, empty='待核实') => known(v) ? String(v) : empty;
 const number = v => known(v) && Number.isFinite(Number(v)) ? Number(v).toLocaleString('zh-CN',{maximumFractionDigits:12}) : '待核实';
 const time = v => !known(v) ? '暂无记录' : String(v).replace('T',' ').replace(/\.\d+(?:Z)?$/,'').replace(/\+08:00$/,'');
 const briefTime = v => !known(v) ? '暂无记录' : time(v).replace(/^\d{4}-/,'');
 const tone = s => /^(ok|active|enabled|running|success|confirmed|done|online)$/.test(String(s)) ? 'ok' : /^(error|failed|offline|danger)$/.test(String(s)) ? 'error' : /^(warn|warning|attention|unknown|pending|queued|dispatched)$/.test(String(s)) ? 'warn' : '';
 const pill = (status,label) => '<span class="rp-pill '+tone(status)+'">'+esc(label||({active:'运行中',enabled:'已启用',paused:'已暂停',disabled:'已停用',unknown:'待核实',failed:'失败',done:'已完成',confirmed:'已确认',pending:'待执行',dispatched:'执行中'}[status]||'待核实'))+'</span>';
 let currentData=null, schema=null, dirty={}, previewed=false, saving=false, pendingLeave=null, lastQuery='', historyTab='prices', reloadToken=0, historyItems=[], restoreAction=null;
 const announce = msg => {$('#liveStatus').textContent=msg;};
 function unwrap(j){return j && (j.data || j.schema) || j;}
 async function api(path,options={}){
  const response=await fetch(href(path),Object.assign({credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'}},options));
  let j;try{j=await response.json();}catch(e){const err=new Error(response.status===401?'登录已过期，请重新登录后重试。':'返回内容无法读取，请稍后重试。');err.status=response.status;throw err;}
  if(!response.ok||j.ok===false){const e=new Error(j.error||j.message||'读取失败，请稍后重试。');e.status=response.status;e.data=j;throw e;}return j;
 }
 function button(label,action,primary=false,extra=''){return '<button class="rp-button '+(primary?'primary':'')+'" data-action="'+action+'" '+extra+'>'+label+'</button>';}
 function refreshButton(){return button(icon('refresh')+'刷新','refresh');}
 function empty(title,detail){return '<div class="rp-empty">'+icon('empty')+'<strong>'+esc(title)+'</strong>'+esc(detail||'')+'</div>';}
 function notice(title,detail,level=''){return '<div class="rp-notice '+esc(level)+'">'+icon(level==='ok'?'check':'info')+'<div><strong>'+esc(title)+'</strong>'+(detail?'<p>'+esc(detail)+'</p>':'')+'</div></div>';}
 function pageError(error){root.innerHTML='<div class="rp-pagehead"><div><h1 class="heading-4">暂时无法读取</h1><p>已有的跟价任务继续按当前配置运行。</p></div></div>'+notice('页面加载失败',error.message,'error')+button('重新加载','refresh',true);root.setAttribute('aria-busy','false');announce(error.message);}
 function pageHeader(title,description,actions=''){return '<div class="rp-pagehead"><div><h1 class="heading-4">'+esc(title)+'</h1>'+(description?'<p>'+esc(description)+'</p>':'')+'</div><div class="rp-actions">'+actions+'</div></div>';}
 function breadcrumb(name){return '<div class="rp-breadcrumb"><a href="'+href('')+'">游戏总览</a>'+icon('arrow')+'<span>'+esc(name)+'</span></div>';}
 function gameTabs(name,id,active){return '<div class="rp-tabs" aria-label="'+esc(name)+'页面"><a href="'+routeGame(id)+'" '+(active==='monitor'?'aria-current="page"':'')+'>行情监控</a><a href="'+routeGame(id,'settings')+'" '+(active==='settings'?'aria-current="page"':'')+'>参数配置</a></div>';}
 function jobRows(jobs,limit){const rows=(jobs||[]).slice(0,limit||jobs.length);if(!rows.length)return empty('暂无改价记录','记录会在任务产生后显示。');return '<div class="rp-tablewrap"><table class="rp-table"><thead><tr><th>时间</th><th>游戏 / 任务</th><th>状态</th><th class="numeric">成功</th><th class="numeric">失败</th><th class="numeric">待确认</th></tr></thead><tbody>'+rows.map(j=>'<tr><td class="nowrap">'+esc(briefTime(j.created_at||j.time||j.ts))+'</td><td><strong>'+esc(j.game||j.game_name||'改价任务')+'</strong><div class="muted caption-4">'+esc(j.id||j.job_id||'')+'</div></td><td>'+pill(j.status,j.status_label)+'</td><td class="numeric">'+number(j.success)+'</td><td class="numeric">'+number(j.failed)+'</td><td class="numeric">'+number(j.unknown)+'</td></tr>').join('')+'</tbody></table></div>';}
 function gameCard(g){const abbreviation=({wow:'WoW',aion2:'A2',aa:'AA',d4:'D4',poe2:'PoE',arc:'ARC',msc:'MS',dnd:'D&D',wardogs:'WD'}[g.id]||String(g.name||'RPG').slice(0,3));return '<article class="rp-game" data-game-search="'+esc((g.name+' '+(g.subtitle||'')).toLowerCase())+'"><div class="rp-game-top"><span class="rp-game-symbol" aria-hidden="true">'+esc(abbreviation)+'</span><div class="rp-game-name"><h3 class="title-3">'+esc(g.name)+'</h3><p>'+esc(g.subtitle||g.source_label||'')+'</p></div>'+pill(g.status,g.status_label)+'</div><p class="rp-game-rule">'+esc(g.rule_summary||'进入游戏查看当前行情与参数。')+'</p><dl><div><dt>运行周期</dt><dd>'+esc(val(g.schedule_label))+'</dd></div><div><dt>最近运行</dt><dd class="number">'+esc(briefTime(g.last_run))+'</dd></div><div><dt>监控范围</dt><dd>'+[known(g.items_count)&&Number(g.items_count)>0?number(g.items_count)+' 件商品':'',known(g.regions_count)&&Number(g.regions_count)>0?number(g.regions_count)+' 个区服':''].filter(Boolean).join(' · ')+'</dd></div><div><dt>需关注</dt><dd>'+ (known(g.attention_count)?(Number(g.attention_count)>0?'<span style="color:var(--rp-warn)">'+number(g.attention_count)+' 项</span>':'暂无'):'待核实')+'</dd></div></dl><div class="rp-game-footer"><a class="rp-button" href="'+routeGame(g.id)+'">行情监控'+icon('arrow')+'</a><a class="rp-button" href="'+routeGame(g.id,'settings')+'">'+icon('settings')+'参数配置</a></div></article>';}
 function renderHome(d){currentData=d;const s=d.summary||{}, games=d.games||[];root.innerHTML=pageHeader('游戏总览','查看各游戏的跟价状态，进入对应游戏调整参数。',refreshButton())+'<div class="rp-meta"><span>'+icon('clock')+'</span><span>数据更新 '+esc(time(d.updated_at))+'</span></div><section class="rp-summary" aria-label="运行摘要"><div class="rp-stat"><div class="muted">已接入游戏</div><div class="statvalue number">'+number(s.games)+'</div><div class="statdetail">参数与监控独立管理</div></div><div class="rp-stat"><div class="muted">已启用</div><div class="statvalue number">'+number(s.enabled)+'</div><div class="statdetail">依据各游戏当前配置</div></div><div class="rp-stat"><div class="muted">需关注</div><div class="statvalue number">'+number(s.attention)+'</div><div class="statdetail">采集状态需关注</div></div><div class="rp-stat"><div class="muted">执行状态</div><div class="statvalue text">'+esc(val(s.executor_label))+'</div><div class="statdetail">运行状态不代表写价结果</div></div></section>'+(d.notices||[]).map(n=>notice(n.title,n.detail,n.level==='warning'?'warn':n.level)).join('')+'<div class="rp-sectionhead"><h2 class="heading-6">游戏工作区<span class="small-label">'+games.length+' 个游戏</span></h2><label class="rp-search">'+icon('search')+'<span class="sr-only">搜索游戏</span><input id="gameSearch" type="search" placeholder="搜索游戏" value="'+esc(lastQuery)+'"></label></div><section class="rp-gamegrid" id="gameGrid">'+(games.length?games.map(gameCard).join(''):empty('暂无游戏','尚未读取到已接入游戏。'))+'</section><div id="gameSearchEmpty" hidden>'+empty('没有匹配的游戏','试试游戏名称或英文名称。')+'</div><div class="rp-sectionhead"><h2 class="heading-6">最近改价</h2><a class="rp-button quiet" href="'+href('changes')+'">查看全部'+icon('arrow')+'</a></div><section class="rp-box">'+jobRows(d.recent_jobs,5)+'</section>';filterGames(lastQuery);}
 function filterGames(query){lastQuery=query;let n=0;document.querySelectorAll('[data-game-search]').forEach(card=>{const match=card.dataset.gameSearch.includes(query.trim().toLowerCase());card.hidden=!match;if(match)n++;});const box=$('#gameSearchEmpty');if(box)box.hidden=n!==0||!(currentData&&currentData.games&&currentData.games.length);}
 function cellValue(v,c){if(v===null||v===undefined||v==='')return '<span class="muted">—</span>';const actionNames={follow_up:'建议上调',follow_down:'建议下调',hold:'保持现价',skip:'本轮跳过',freeze:'保持现价',pending:'待执行',confirmed:'已确认',unknown:'待核实'};if(c.type==='status'){if(typeof v==='object')return pill(v.status,v.label);return esc(actionNames[v]||v);}if(c.type==='number')return number(v);if(c.type==='percent'){const n=Number(v);return Number.isFinite(n)?esc((n*(c.scale||100)).toFixed(c.decimals==null?1:c.decimals)+'%'):'—';}if(c.type==='money'){const n=Number(v);return Number.isFinite(n)?esc((c.currency||'$')+n.toLocaleString('en-US',{minimumFractionDigits:c.decimals==null?2:c.decimals,maximumFractionDigits:c.decimals==null?6:c.decimals})):'—';}if(c.type==='time')return esc(briefTime(v));if(typeof v==='object')return esc(v.label||v.value||'待核实');return esc(actionNames[v]||v);}
 function monitorTable(d){const cols=d.columns||[],rows=d.rows||[];if(!rows.length)return empty('暂无可展示行情','等待该游戏产生新的有效记录。');if(!cols.length)return empty('行情列尚未就绪','当前没有可用的展示字段。');return '<div class="rp-tablewrap"><table class="rp-table" id="monitorTable"><thead><tr>'+cols.map(c=>'<th class="'+(/number|money|percent/.test(c.type||'')?'numeric':'')+'">'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr data-row-search="'+esc(cols.map(c=>typeof row[c.key]==='object'?'':val(row[c.key],'')).join(' ').toLowerCase())+'">'+cols.map(c=>'<td class="'+(/number|money|percent/.test(c.type||'')?'numeric':c.type==='note'?'note':'')+'">'+cellValue(row[c.key],c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
 function renderMonitor(d){currentData=d;document.title=d.name+' · 游戏改价中心';root.innerHTML=breadcrumb(d.name)+pageHeader(d.name,'查看当前行情、来源与改价结果。','<a class="rp-button primary" href="'+routeGame(d.id||GAME,'settings')+'">'+icon('settings')+'参数配置</a>'+refreshButton())+gameTabs(d.name,d.id||GAME,'monitor')+'<div class="rp-meta"><span>最近数据 '+esc(time(d.updated_at))+'</span>'+(d.unit?'<span>报价单位 '+esc(d.unit)+'</span>':'')+(d.schedule_label?'<span>周期 '+esc(d.schedule_label)+'</span>':'')+'</div>'+(d.notes||[]).map(n=>typeof n==='string'?notice(n,''):notice(n.title,n.detail,n.level)).join('')+'<div class="rp-sectionhead"><h2 class="heading-6">行情明细<span class="small-label">'+number((d.rows||[]).length)+' 条</span></h2><label class="rp-search">'+icon('search')+'<span class="sr-only">搜索区服或商品</span><input id="monitorSearch" type="search" placeholder="搜索区服或商品"></label></div><section class="rp-box">'+monitorTable(d)+'</section><div id="monitorSearchEmpty" hidden>'+empty('没有匹配的行情','尝试其他区服或商品名称。')+'</div>';}
 function scaleOf(f){return Number(f.scale)||1;}
 function displayValue(f,v){if(v===null||v===undefined)return '未设置';if(f.type==='bool'||f.type==='boolean'||typeof v==='boolean')return v?'开启':'关闭';const opts=f.options||f.choices;if(opts){const o=opts.find(x=>typeof x==='object'?String(x.value)===String(v):String(x)===String(v));if(o&&typeof o==='object')return o.label||o.value;}if(typeof v==='number'){const n=Math.round(v*scaleOf(f)*1e8)/1e8;return String(n)+(f.unit?' '+f.unit:'');}return String(v)+(f.unit?' '+f.unit:'');}
 function fieldHtml(f){const id='field-'+f.key.replace(/[^a-zA-Z0-9_-]/g,'_'), helpId=id+'-help',unit=f.unit||'',scale=scaleOf(f);let control='';if(f.type==='bool'||f.type==='boolean'){control='<label class="rp-toggle" for="'+esc(id)+'"><input id="'+esc(id)+'" type="checkbox" data-key="'+esc(f.key)+'" '+(f.value?'checked':'')+' aria-describedby="'+esc(helpId)+'"><span>'+(f.value?'已开启':'已关闭')+'</span></label>';}else if((f.options||f.choices)&&Array.isArray(f.options||f.choices)){control='<div class="rp-fieldcontrol"><select id="'+esc(id)+'" data-key="'+esc(f.key)+'" aria-describedby="'+esc(helpId)+'">'+(f.options||f.choices).map(o=>{const v=typeof o==='object'?o.value:o,l=typeof o==='object'?(o.label||o.value):o;return '<option value="'+esc(v)+'" '+(String(f.value)===String(v)?'selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select></div>';}else{const numeric=['float','int','number','integer'].includes(f.type);const value=numeric&&known(f.value)?Math.round(Number(f.value)*scale*1e8)/1e8:(f.value==null?'':f.value);control='<div class="rp-fieldcontrol"><input id="'+esc(id)+'" data-key="'+esc(f.key)+'" type="'+(numeric?'number':'text')+'" '+(numeric?'inputmode="decimal"':'')+' value="'+esc(value)+'" '+(known(f.min)?'min="'+Number(f.min)*scale+'"':'')+' '+(known(f.max)?'max="'+Number(f.max)*scale+'"':'')+' '+(numeric?'step="'+(known(f.step)?Number(f.step):((f.type==='int'||f.type==='integer')?1:'any'))+'"':'')+' aria-describedby="'+esc(helpId)+'">'+(unit?'<span class="rp-unit">'+esc(unit)+'</span>':'')+'</div>';}return '<div class="rp-field" data-field="'+esc(f.key)+'"><label for="'+esc(id)+'">'+esc(f.label)+'</label>'+control+'<small id="'+esc(helpId)+'">'+esc(f.help||'')+'</small><small class="rp-field-error" role="status"></small></div>';}
 function readonlyHtml(s){let entries=s.readonly||[];if(!Array.isArray(entries))entries=Object.entries(entries).map(([label,value])=>({label,value}));return '<aside class="rp-side"><h2 class="title-3">当前运行方式</h2><dl>'+entries.map(e=>typeof e==='string'?'<div><dd>'+esc(e)+'</dd></div>':'<div><dt>'+esc(e.label||e.key||'')+'</dt><dd>'+esc(val(e.value))+'</dd></div>').join('')+'<div><dt>配置版本</dt><dd class="number">'+esc(String(s.version||'待核实').slice(0,12))+'</dd></div>'+(s.updated_at?'<div><dt>最近保存</dt><dd>'+esc(briefTime(s.updated_at))+'</dd></div>':'')+(s.actor?'<div><dt>保存人</dt><dd>'+esc(s.actor)+'</dd></div>':'')+'</dl><p>保存仅更新本游戏参数。已经开始的任务按原参数完成，下一新轮次读取新配置。</p></aside>';}
 function renderSettings(s){schema=s;dirty={};previewed=false;document.title=s.name+'参数 · 游戏改价中心';const groups=new Map();(s.fields||[]).forEach(f=>{const g=f.group||'游戏参数';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(f);});root.innerHTML=breadcrumb(s.name)+pageHeader(s.name+' · 参数配置','修改利润率、采样数量等参数，保存前核对本次变更。','<a class="rp-button" href="'+routeGame(s.id||GAME)+'">返回行情'+icon('arrow')+'</a>')+gameTabs(s.name,s.id||GAME,'settings')+'<div id="settingsNotice" role="status"></div><form id="settingsForm" novalidate><div class="rp-formlayout"><div class="rp-form-groups">'+(groups.size?[...groups.entries()].map(([g,fs])=>'<section class="rp-fieldgroup"><h2 class="heading-6">'+esc(g)+'</h2><div class="rp-fields">'+fs.map(fieldHtml).join('')+'</div></section>').join(''):empty('暂无可编辑参数','该游戏目前只提供行情监控。'))+'</div>'+readonlyHtml(s)+'</div><section class="rp-box rp-preview" id="changePreview" hidden></section><div class="rp-savebar" id="saveBar"><div><strong id="dirtyLabel">配置已同步</strong><small id="dirtyHelp">尚未修改任何参数</small></div><div class="rp-actions">'+button('放弃修改','discard',false,'disabled')+button('查看修改','preview',true,'disabled')+'</div></div></form>';}
 function readInput(f,input){if(f.type==='bool'||f.type==='boolean')return input.checked;const opts=f.options||f.choices;if(opts){const o=opts.find(x=>String(typeof x==='object'?x.value:x)===input.value);return o==null?input.value:(typeof o==='object'?o.value:o);}if(['float','int','number','integer'].includes(f.type)){if(input.value.trim()==='')return NaN;return Number(input.value)/scaleOf(f);}return input.value;}
 function fieldError(f,value){if(['float','int','number','integer'].includes(f.type)){if(!Number.isFinite(value))return '请输入有效数字';if((f.type==='int'||f.type==='integer')&&!Number.isInteger(value))return '请输入整数';if(known(f.min)&&value<Number(f.min))return '不能小于 '+displayValue(f,Number(f.min));if(known(f.max)&&value>Number(f.max))return '不能大于 '+displayValue(f,Number(f.max));}return '';}
 function onField(input){if(!schema||saving)return;const f=schema.fields.find(f=>f.key===input.dataset.key);if(!f)return;const value=readInput(f,input),error=fieldError(f,value),box=input.closest('[data-field]');if(Object.is(value,f.value)||typeof value==='number'&&typeof f.value==='number'&&Math.abs(value-f.value)<1e-10)delete dirty[f.key];else dirty[f.key]=value;box.classList.toggle('dirty',Object.prototype.hasOwnProperty.call(dirty,f.key));box.classList.toggle('invalid',!!error);$('.rp-field-error',box).textContent=error;input.setAttribute('aria-invalid',error?'true':'false');if(input.type==='checkbox')input.nextElementSibling.textContent=value?'已开启':'已关闭';previewed=false;$('#changePreview').hidden=true;updateSavebar();}
 function updateSavebar(){const count=Object.keys(dirty).length;$('#dirtyLabel').textContent=count?'已修改 '+count+' 项':'配置已同步';$('#dirtyHelp').textContent=count?'修改尚未保存，确认后下一新轮次生效':'尚未修改任何参数';$('[data-action="discard"]').disabled=!count||saving;$('[data-action="preview"]').disabled=!count||saving;}
 function showSettingsNotice(title,detail,level=''){const target=$('#settingsNotice');if(target)target.innerHTML=notice(title,detail,level);announce(title+(detail?'，'+detail:''));}
 function previewChanges(){if(!Object.keys(dirty).length||saving)return;let invalid=false;schema.fields.forEach(f=>{if(Object.prototype.hasOwnProperty.call(dirty,f.key)){const msg=fieldError(f,dirty[f.key]);if(msg)invalid=true;}});if(invalid){showSettingsNotice('请先修正参数','标红的字段尚未通过检查。','error');$('.rp-field.invalid input')?.focus();return;}const fs=schema.fields.filter(f=>Object.prototype.hasOwnProperty.call(dirty,f.key));$('#changePreview').innerHTML='<div class="rp-box-head"><div><h2 class="heading-6">核对本次修改</h2><p>仅 '+esc(schema.name)+' 的 '+fs.length+' 项参数将被更新。</p></div></div><div class="rp-tablewrap"><table class="rp-table settings-diff"><thead><tr><th>参数</th><th>当前值</th><th>修改为</th></tr></thead><tbody>'+fs.map(f=>'<tr><td>'+esc(f.label)+'</td><td class="rp-before">'+esc(displayValue(f,f.value))+'</td><td class="rp-after">'+esc(displayValue(f,dirty[f.key]))+'</td></tr>').join('')+'</tbody></table></div><div class="rp-preview-footer">'+button('继续编辑','edit')+button('确认保存','save',true)+'</div>';$('#changePreview').hidden=false;previewed=true;$('#changePreview').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});announce('本次修改预览已展开，请核对后确认保存。');}
 async function saveConfig(){if(!previewed||saving||!Object.keys(dirty).length)return;saving=true;root.querySelectorAll('input,select,button').forEach(e=>{e.disabled=true;});const posted=Object.assign({},dirty);try{const result=await api('api/games/'+encodeURIComponent(GAME)+'/config',{method:'POST',body:JSON.stringify({version:schema.version,patch:posted})});let next=unwrap(result);if(!next.fields){next=Object.assign({},schema,{version:next.version||result.version,fields:schema.fields.map(f=>Object.prototype.hasOwnProperty.call(posted,f.key)?Object.assign({},f,{value:posted[f.key]}):f)});}if(!next.version)throw new Error('服务端未返回配置版本，请重新核对当前值。');renderSettings(next);showSettingsNotice('配置已保存','新参数从下一次新启动的任务生效。','ok');}catch(e){if(e.status===409){showSettingsNotice('配置已被其他人更新','你的修改已保留。请重新读取最新配置，再核对后保存。','warn');$('#settingsNotice').insertAdjacentHTML('beforeend','<div class="rp-actions" style="margin-bottom:16px">'+button('重新读取最新配置','reload-config')+'</div>');}else{showSettingsNotice('保存未完成',e.message,'error');}}finally{saving=false;root.querySelectorAll('input,select,button').forEach(e=>{e.disabled=false;});updateSavebar();}}
 function historyRows(items){if(!items.length)return empty('暂无配置修改记录','通过配置页保存后，会记录修改人及前后参数。');return '<div class="rp-tablewrap"><table class="rp-table"><thead><tr><th>保存时间</th><th>游戏</th><th>修改内容</th><th>保存人</th><th>操作</th></tr></thead><tbody>'+items.map(x=>{let changes=x.changes||[];if(!Array.isArray(changes))changes=Object.entries(changes).map(([key,c])=>Object.assign({key,label:key},c));return '<tr><td class="nowrap">'+esc(briefTime(x.time||x.ts||x.created_at))+'</td><td>'+esc(x.game_name||x.game||x.game_id||'—')+'</td><td><div class="rp-history-detail">'+changes.map(c=>'<div class="rp-history-line"><span>'+esc(c.label||c.key)+'</span><span class="rp-before">'+esc(displayValue(c,c.before))+'</span><span aria-hidden="true">→</span><span class="rp-after">'+esc(displayValue(c,c.after))+'</span></div>').join('')+'</div></td><td>'+esc(x.actor||'未记录')+'</td><td>'+button('恢复此项变更','restore-preview',false,'data-record="'+esc(x.id)+'"')+'</td></tr>';}).join('')+'</tbody></table></div>';}
 function renderHistory(d,history){currentData=d;historyItems=history.items||unwrap(history).items||[];restoreAction=null;root.innerHTML=pageHeader('改价与配置记录','区分实际改价结果和参数修改，便于追踪每次调整。',refreshButton())+'<div id="historyNotice" role="status"></div><div class="rp-tabs" role="tablist" aria-label="记录类型"><button type="button" role="tab" data-history-tab="prices" aria-selected="'+(historyTab==='prices')+'">改价记录</button><button type="button" role="tab" data-history-tab="config" aria-selected="'+(historyTab==='config')+'">配置修改</button></div><section class="rp-box rp-preview" id="restorePreview" hidden></section><section class="rp-box" id="priceHistory" role="tabpanel" '+(historyTab==='prices'?'':'hidden')+'>'+jobRows(d.recent_jobs)+'</section><section class="rp-box" id="configHistory" role="tabpanel" '+(historyTab==='config'?'':'hidden')+'>'+historyRows(historyItems)+'</section><p class="rp-footnote">仅显示已返回的记录；运行完成、派单与写价确认分别记录。</p>';}
 async function previewRestore(id){if(saving)return;const record=historyItems.find(x=>String(x.id)===String(id));if(!record)return;const target=$('#historyNotice');target.innerHTML=notice('正在核对当前配置','');try{const s=unwrap(await api('api/games/'+encodeURIComponent(record.game_id||record.game)+'/config'));const changes=Array.isArray(record.changes)?record.changes:[];const fields=changes.map(c=>({change:c,field:s.fields.find(f=>f.key===c.key)}));if(!fields.length||fields.some(x=>!x.field))throw new Error('当前参数定义已变化，请进入游戏配置页检查。');restoreAction={id:record.id,version:s.version};$('#restorePreview').innerHTML='<div class="rp-box-head"><div><h2 class="heading-6">核对恢复内容</h2><p>'+esc(s.name)+' · 仅恢复这条记录涉及的参数，下一新轮次生效。</p></div></div><div class="rp-tablewrap"><table class="rp-table settings-diff"><thead><tr><th>参数</th><th>当前值</th><th>恢复为</th></tr></thead><tbody>'+fields.map(({field:f,change:c})=>'<tr><td>'+esc(f.label)+'</td><td>'+esc(displayValue(f,f.value))+'</td><td class="rp-after">'+esc(displayValue(f,c.before))+'</td></tr>').join('')+'</tbody></table></div><div class="rp-preview-footer">'+button('取消','restore-cancel')+button('确认恢复这些参数','restore-confirm',true)+'</div>';$('#restorePreview').hidden=false;target.innerHTML='';$('#restorePreview').scrollIntoView({block:'center',behavior:'smooth'});announce('恢复预览已展开，请核对当前值和恢复值。');}catch(e){target.innerHTML=notice('暂时无法恢复',e.message,'error');restoreAction=null;}}
 async function confirmRestore(){if(!restoreAction||saving)return;saving=true;root.querySelectorAll('button').forEach(x=>x.disabled=true);try{await api('api/config/restore',{method:'POST',body:JSON.stringify(restoreAction)});saving=false;await load();$('#historyNotice').innerHTML=notice('参数已恢复','下一次新启动的任务读取恢复后的配置。','ok');announce('参数已恢复');}catch(e){$('#historyNotice').innerHTML=notice('恢复未完成',e.message,'error');}finally{saving=false;root.querySelectorAll('button').forEach(x=>x.disabled=false);}}
 async function load(){const token=++reloadToken;if(saving)return;if(PAGE==='settings'&&Object.keys(dirty).length){showSettingsNotice('修改尚未保存','当前输入已保留，放弃修改后可重新读取配置。','warn');return;}root.setAttribute('aria-busy','true');try{if(PAGE==='settings'){const j=await api('api/games/'+encodeURIComponent(GAME)+'/config');if(token===reloadToken)renderSettings(unwrap(j));}else if(PAGE==='monitor'){const j=await api('api/games/'+encodeURIComponent(GAME)+'/monitor');if(token===reloadToken)renderMonitor(unwrap(j));}else if(PAGE==='history'){const [j,h]=await Promise.all([api('api/console'),api('api/config/history')]);if(token===reloadToken)renderHistory(unwrap(j),h);}else{const j=await api('api/console');if(token===reloadToken)renderHome(unwrap(j));}if(token===reloadToken){root.setAttribute('aria-busy','false');announce('页面已更新');}}catch(e){if(token===reloadToken)pageError(e);}}
 function askDiscard(action){pendingLeave=action;const dialog=$('#leaveDialog');if(typeof dialog.showModal==='function')dialog.showModal();else{showSettingsNotice('请先放弃未保存的修改','放弃后再进行页面跳转。','warn');pendingLeave=null;}}
 document.addEventListener('input',e=>{if(e.target.matches('[data-key]'))onField(e.target);if(e.target.id==='gameSearch')filterGames(e.target.value);if(e.target.id==='monitorSearch'){const q=e.target.value.trim().toLowerCase();let n=0;root.querySelectorAll('[data-row-search]').forEach(row=>{row.hidden=!row.dataset.rowSearch.includes(q);if(!row.hidden)n++;});$('#monitorSearchEmpty').hidden=n>0||!(currentData.rows||[]).length;}});
 document.addEventListener('change',e=>{if(e.target.matches('select[data-key],input[type=checkbox][data-key]'))onField(e.target);});
 document.addEventListener('click',e=>{const link=e.target.closest('a[href]');if(link&&Object.keys(dirty).length&&!saving&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&link.target!=='_blank'){e.preventDefault();askDiscard(()=>{dirty={};location.href=link.href;});return;}const target=e.target.closest('[data-action]');if(target){e.preventDefault();const action=target.dataset.action;if(action==='refresh')load();if(action==='preview')previewChanges();if(action==='save')saveConfig();if(action==='edit'){$('#changePreview').hidden=true;previewed=false;}if(action==='discard')renderSettings(schema);if(action==='reload-config')askDiscard(()=>{dirty={};load();});}const hist=e.target.closest('[data-history-tab]');if(hist){historyTab=hist.dataset.historyTab;root.querySelectorAll('[data-history-tab]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.historyTab===historyTab)));$('#priceHistory').hidden=historyTab!=='prices';$('#configHistory').hidden=historyTab!=='config';}});
 document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='restore-preview')previewRestore(target.dataset.record);if(action==='restore-confirm')confirmRestore();if(action==='restore-cancel'){restoreAction=null;$('#restorePreview').hidden=true;}});
 document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();previewChanges();}});
 $('#keepEditing').addEventListener('click',()=>{$('#leaveDialog').close();pendingLeave=null;});$('#discardLeave').addEventListener('click',()=>{const fn=pendingLeave;pendingLeave=null;$('#leaveDialog').close();if(fn)fn();});$('#leaveDialog').addEventListener('cancel',()=>{pendingLeave=null;});
 window.addEventListener('beforeunload',e=>{if(Object.keys(dirty).length){e.preventDefault();e.returnValue='';}});
 $('#brandLink').href=href('');document.querySelectorAll('[data-nav]').forEach(a=>{const key=a.dataset.nav;a.href=href(key==='home'?'':key==='history'?'changes':'maintenance/');if(key===(PAGE==='history'?'history':'home'))a.setAttribute('aria-current','page');});
 // The shared navigation retains its old destination; only this page marks the alias active.
 if(location.pathname.startsWith('/repricing/')){
  let opened=false;
  const markNavigation=()=>{const group=document.querySelector('#hubNav .hn-group[data-key="arpg"]'),link=group&&group.querySelector('a[href="/d4/"]');if(!link)return;link.setAttribute('aria-current','page');group.querySelector('.hn-heading')?.setAttribute('aria-current','true');if(!opened){opened=true;if(group.dataset.open!=='true')group.querySelector('.hn-expander')?.click();}};
  new MutationObserver(markNavigation).observe(document.body,{childList:true,subtree:true});markNavigation();
 }
 load();if(PAGE!=='settings')setInterval(()=>{if(!document.hidden&&!restoreAction&&!document.querySelector('input:focus')&&(!lastQuery||PAGE!=='home'))load();},60000);
})();
</script>
</body>
