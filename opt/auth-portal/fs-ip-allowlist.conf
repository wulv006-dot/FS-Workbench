# ============================================================================
# FS 平台 · 访问来源白名单（IP allowlist）· 2026-10-15 建立
# ============================================================================
# 目的：只允许公司自有出口访问本平台，阻断「外部人拿到账号密码后直接登录」。
#       白名单外的来源在 server 级直接返回 403，并单独写入
#       /var/log/nginx/ip-denied.log，由 /opt/auth-portal/fs_ip_alert.py
#       汇总后推送钉钉告警。
#
# 位置：本文件处于 http 上下文（随 /etc/nginx/nginx.conf 的
#       `include /etc/nginx/conf.d/*.conf` 加载）。文件名 fs- 前缀保证它早于
#       iggm-web.conf 按字母序解析。判定结果由
#       /etc/nginx/fs-ip-allowlist.locations.conf 在 server 块内引用。
#
# 维护：要放行新出口，在下方「公司自有出口」区加一行 `IP/32  1;`
#       然后执行：nginx -t && systemctl reload nginx
#
# 回退：删掉本文件，并删掉 iggm-web.conf 里的
#       `# >>> fs-ip-allowlist-20261015 >>>` 标记块，再
#       nginx -t && systemctl reload nginx
# ----------------------------------------------------------------------------

geo $fs_ip_allowed {
    default 0;

    # ---- 公司自有出口 ----
    # 来源：/opt/auth-portal/data/audit.log（登录成功记录）+ /var/log/nginx/access.log
    45.58.38.172/32     1;   # 主力出口（Atlantic.Net AS6364）
    90.96.180.210/32    1;   # 自动化采集出口
    152.175.66.27/32    1;   # DY
    45.95.212.151/32    1;   # DY（代理出口）
    173.249.200.124/32  1;   # 同事出口（tzulo）
    152.175.33.8/32     1;   # 历史出口
    43.228.212.186/32   1;   # 历史出口
    43.228.212.158/32   1;   # 历史出口
    223.244.89.51/32    1;   # 历史出口（合肥电信）
    114.88.116.122/32   1;   # 历史出口（上海电信）

    # ---- 基础设施：本机 / 内网 / 服务器自身公网 ----
    127.0.0.0/8        1;
    172.16.0.0/12      1;
    10.0.0.0/8         1;
    192.168.0.0/16     1;
    47.85.224.112/32   1;

    # ---- 钉钉官方 Bot（消息卡片链接预览抓取）----
    59.82.21.0/24      1;
}

# ACME 验证路径对所有来源开放：
# 本机证书是 Let's Encrypt 短周期（preferred_profile = shortlived，约 6 天），
# 由 fc27-ip-certificate.timer 每 12 小时用 webroot 方式续期，验证来源 IP 不固定。
# 若被白名单挡掉，证书会在数天内过期，导致全站 HTTPS 中断。
map $request_uri $fs_is_acme {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

# 最终判定：仅「非白名单 且 非 ACME」记 1（拦截）
map "$fs_ip_allowed:$fs_is_acme" $fs_ip_block {
    "0:0" 1;
    default 0;
}
