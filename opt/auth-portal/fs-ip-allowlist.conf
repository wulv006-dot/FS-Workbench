# ============================================================================
# FS 平台 · 访问来源白名单（IP allowlist）· 2026-10-15 建立 / 2026-10-16 修订
# ============================================================================
# 目的：只允许「本公司机器」与「本公司脚本工具」访问本平台，阻断
#       「外部人拿到账号密码后直接登录」。
#       白名单外的来源在 server 级直接返回专用码 418（渲染拒绝页），并单独写入
#       /var/log/nginx/ip-denied.log，由 /opt/auth-portal/fs_ip_alert.py
#       汇总后推送钉钉群「服务器及Github报警」。
#
# 位置：本文件处于 http 上下文（随 /etc/nginx/nginx.conf 的
#       `include /etc/nginx/conf.d/*.conf` 加载）。文件名 fs- 前缀保证它早于
#       iggm-web.conf 按字母序解析。判定结果由
#       /etc/nginx/fs-ip-allowlist.locations.conf 在 server 块内引用。
#
# 维护：新增放行来源 -> 在对应区加一行 `<IP 或 CIDR>  1;`
#       然后执行：nginx -t && systemctl reload nginx
#
# 回退：删掉本文件，并删掉 iggm-web.conf 里的
#       `# >>> fs-ip-allowlist-20261015 >>>` 标记块，再
#       nginx -t && systemctl reload nginx
# ----------------------------------------------------------------------------

geo $fs_ip_allowed {
    default 0;

    # ---- A. 本公司机器出口（人工访问）----------------------------------------
    # 依据：/opt/auth-portal/data/audit.log（登录成功记录）
    45.58.38.172/32     1;   # 主力出口（Atlantic.Net AS6364）· 人 + 脚本共用
    90.96.180.210/32    1;   # 自动化采集出口（吴律工具，经 Cloudflare AS13335）
    45.95.212.151/32    1;   # DY 代理出口
    223.244.89.51/32    1;   # 家宽出口（合肥电信）
    114.88.116.122/32   1;   # 家宽出口（上海电信）

    # ---- B. 脚本工具出口（IP 会在同一 IDC 段内漂移；放行整段以覆盖漂移）----
    # 依据：/var/log/nginx/access.log 中 UA 为空（程序访问）的来源。
    # 若脚本漂到下列段之外被挡：看钉钉告警 / 拒绝页显示的 IP，按其所在 /24 追加一行。
    43.228.212.0/24     1;   # Atlantic.Net AS6364（脚本实测 .186 / .158）
    173.249.200.0/23    1;   # tzulo AS11878 注册段（脚本实测 .200.124）
    173.249.209.0/24    1;   # tzulo AS11878 注册段（脚本实测 .209.90）
    152.175.0.0/16      1;   # ISIF OU AS209554（脚本跨 .33 / .66 / .97 漂移；
                             #   该 /16 下全部宣告前缀均属 AS209554）

    # ---- C. 基础设施：本机 / 内网 / 服务器自身公网 ---------------------------
    127.0.0.0/8        1;
    172.16.0.0/12      1;
    10.0.0.0/8         1;
    192.168.0.0/16     1;
    47.85.224.112/32   1;

    # ---- D. 钉钉官方 Bot（消息卡片链接预览抓取）------------------------------
    # 2026-10-16 修正：原为 59.82.21.0/24，只覆盖「发消息」的出口；
    # 而钉钉抓取链接预览实际来自 59.82.83.x（曾导致群里贴链接无预览）。
    59.82.0.0/16       1;
}

# ACME 验证路径对所有来源开放：
# 本机证书是 Let's Encrypt 短周期（preferred_profile = shortlived，约 6 天），
# 由 fc27-ip-certificate.timer 每 12 小时用 webroot 方式续期，验证来源 IP 不固定。
# 若被白名单挡掉，证书会在数天内过期，导致全站 HTTPS 中断。
map $request_uri $fs_is_acme {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

# 最终判定：仅「非白名单 且 非 ACME」记 1（拦截）
# ---------------------------------------------------------------------------
# ⚠️ 总开关（MASTER SWITCH）—— 只改下面 map 里那一个数字即可：
#    "0:0" 1;  ->  启用拦截（只有白名单来源能进）★ 当前
#    "0:0" 0;  ->  全量放行（解除封禁；任何来源都能进）
#
# 当前状态：★ 启用拦截（1）★
#   2026-10-16 16:xx 应要求恢复拦截，白名单按「公司机器 + 脚本工具」两类收紧。
#   历史：2026-10-15 18:35 曾临时全量放行（0），拦截代码始终保留未删。
#
# 恢复全量放行：把下面那行改成 0，再 nginx -t && systemctl reload nginx。
# ---------------------------------------------------------------------------
map "$fs_ip_allowed:$fs_is_acme" $fs_ip_block {
    "0:0" 1;
    default 0;
}
