<!doctype html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>登录 · MMOEXP 运营管理中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Crect x='7' y='8.4' width='18' height='4.3' rx='2.15' fill='%23fff' fill-opacity='.48'/%3E%3Crect x='7' y='14.6' width='18' height='4.3' rx='2.15' fill='%23fff' fill-opacity='.76'/%3E%3Crect x='7' y='20.8' width='11.4' height='4.3' rx='2.15' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============ 设计令牌（与全站亮色主题同源：bg #f5f5f7 / ac #0071e3） ============ */
:root{
  --bg:#f5f5f7;
  --bg2:#eceef3;
  --surface:rgba(255,255,255,.72);
  --surface-solid:#ffffff;
  --surface-sunken:#f7f8fa;
  --line:rgba(0,0,0,.07);
  --line-strong:rgba(0,0,0,.13);
  --tx:#1d1d1f;
  --tx2:#6e6e73;
  --tx3:#a1a1a6;
  --ac:#0071e3;
  --ac2:#0a84ff;
  --ac-ink:#ffffff;
  --violet:#5e5ce6;
  --teal:#0aa2a2;
  --red:#d93025;
  --red-soft:#fdecea;
  --red-line:rgba(217,48,37,.22);
  --amber:#c77700;
  --ok:#1a8f4c;
  --ring:rgba(0,113,227,.16);
  --shadow-card:
     0 1px 1px rgba(16,24,40,.04),
     0 8px 20px -8px rgba(16,24,40,.13),
     0 28px 56px -24px rgba(16,24,40,.20);
  --shadow-btn:0 1px 2px rgba(0,90,180,.20), 0 10px 22px -8px rgba(0,113,227,.50);
  --orb-op:.32;
  --radius:22px;
}
html[data-theme="dark"]{
  --bg:#0a0c11;
  --bg2:#05070b;
  --surface:rgba(26,29,36,.68);
  --surface-solid:#1a1d24;
  --surface-sunken:#14171d;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --tx:#f5f6f8;
  --tx2:#a8adba;
  --tx3:#6d7280;
  --ac:#0a84ff;
  --ac2:#3f9dff;
  --red:#ff6b60;
  --red-soft:rgba(255,107,96,.10);
  --red-line:rgba(255,107,96,.26);
  --ok:#32d074;
  --ring:rgba(10,132,255,.22);
  --shadow-card:
     0 1px 1px rgba(0,0,0,.30),
     0 12px 28px -10px rgba(0,0,0,.55),
     0 40px 72px -32px rgba(0,0,0,.70);
  --orb-op:.30;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
              "Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;
  padding:28px 20px;
  overflow-x:hidden;
}

/* ================= 背景：极光光晕 + 细网格 ================= */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg::after{ /* 顶部到底部的极淡渐变，增加纵深 */
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,transparent 55%,var(--bg2) 100%);
}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(72px);
  opacity:var(--orb-op);
  will-change:transform;
}
.orb.o1{
  width:48vmax;height:48vmax;left:-18vmax;top:-20vmax;
  background:radial-gradient(circle at 38% 38%,rgba(0,113,227,.62) 0%,rgba(0,113,227,.22) 46%,transparent 72%);
  animation:drift1 26s ease-in-out infinite;
}
.orb.o2{
  width:40vmax;height:40vmax;right:-16vmax;top:-10vmax;
  background:radial-gradient(circle at 60% 40%,rgba(94,92,230,.44) 0%,rgba(94,92,230,.16) 48%,transparent 74%);
  animation:drift2 32s ease-in-out infinite;
}
.orb.o3{
  width:42vmax;height:42vmax;right:-4vmax;bottom:-20vmax;
  background:radial-gradient(circle at 50% 50%,rgba(10,162,162,.36) 0%,rgba(10,162,162,.13) 48%,transparent 74%);
  animation:drift3 38s ease-in-out infinite;
}
html[data-theme="dark"] .orb{filter:blur(88px)}
.grid{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 42%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 42%,#000 0%,transparent 78%);
  opacity:.6;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,3vmax) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4vmax,4vmax) scale(1.10)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3vmax,-3vmax) scale(1.06)}}

/* ================= 布局 ================= */
.wrap{position:relative;z-index:1;width:100%;max-width:426px}

/* ================= 卡片 ================= */
.card{
  position:relative;
  background:var(--surface);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  padding:40px 38px 32px;
  overflow:hidden;
  animation:rise .68s cubic-bezier(.22,1,.36,1) both;
}
/* 顶部 1px 品牌渐变描边 */
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1.5px;
  background:linear-gradient(90deg,
    transparent 0%,var(--ac) 22%,var(--violet) 52%,var(--teal) 78%,transparent 100%);
  opacity:.9;
}
@keyframes rise{
  from{opacity:0;transform:translateY(16px) scale(.985)}
  to  {opacity:1;transform:none}
}
.card.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}

/* ================= 品牌区 ================= */
.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.mark{
  width:46px;height:46px;flex:0 0 46px;border-radius:13px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#0a84ff 0%,#0071e3 46%,#5e5ce6 100%);
  box-shadow:0 6px 16px -5px rgba(0,113,227,.55),
             inset 0 1px 0 rgba(255,255,255,.34);
}
.mark svg{width:25px;height:25px;display:block}
.brand h1{
  margin:0;font-size:16.5px;font-weight:650;letter-spacing:-.015em;color:var(--tx);
}
.brand p{
  margin:3px 0 0;font-size:12.5px;color:var(--tx3);letter-spacing:.01em;
}

.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--tx2);
  margin-bottom:24px;letter-spacing:.01em;
}
.badge i{
  width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--ok) 16%,transparent);
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
.badge.warn{color:var(--amber)}
.badge.warn i{background:var(--amber);
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--amber) 16%,transparent)}

/* ================= 表单 ================= */
form{margin:0}
.field{position:relative;margin-bottom:13px}
.field input{
  width:100%;height:58px;
  padding:23px 16px 8px;
  border:1px solid var(--line-strong);
  border-radius:14px;
  background:var(--surface-solid);
  color:var(--tx);
  font-size:16px;font-family:inherit;
  outline:none;
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
  appearance:none;
}
.field input:hover{border-color:var(--tx3)}
.field input:focus{
  border-color:var(--ac);
  box-shadow:0 0 0 4px var(--ring);
}
.field input:-webkit-autofill{
  -webkit-text-fill-color:var(--tx);
  transition:background-color 9999s ease-out;
}
.field label{
  position:absolute;left:17px;top:50%;
  transform:translateY(-50%);
  color:var(--tx3);font-size:16px;
  pointer-events:none;
  transform-origin:left center;
  transition:all .17s cubic-bezier(.4,0,.2,1);
  white-space:nowrap;
}
.field input:focus ~ label,
.field input:not(:placeholder-shown) ~ label{
  top:14px;transform:translateY(0) scale(.72);
  color:var(--ac);font-weight:600;letter-spacing:.02em;
}
.field.has-error input{border-color:var(--red-line);box-shadow:0 0 0 4px var(--red-soft)}

/* 密码可见性开关 */
.field .eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;border-radius:10px;
  background:transparent;color:var(--tx3);cursor:pointer;
  display:grid;place-items:center;
  transition:background-color .16s ease,color .16s ease;
}
.field .eye:hover{background:var(--surface-sunken);color:var(--tx2)}
.field .eye:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.field .eye svg{width:18px;height:18px;display:block}
.field input[type=password]{padding-right:52px}

/* 记住我 */
.row{
  display:flex;align-items:center;justify-content:space-between;
  margin:15px 2px 21px;
}
.chk{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.chk input{
  appearance:none;width:17px;height:17px;flex:0 0 17px;
  border:1.5px solid var(--line-strong);border-radius:5.5px;
  background:var(--surface-solid);cursor:pointer;margin:0;
  position:relative;transition:all .16s ease;
}
.chk input:hover{border-color:var(--ac)}
.chk input:checked{
  background:var(--ac);border-color:var(--ac);
}
.chk input:checked::after{
  content:"";position:absolute;left:5px;top:1.5px;
  width:4.5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(42deg);
}
.chk span{font-size:13.5px;color:var(--tx2)}
.hint{font-size:13px;color:var(--tx3)}

/* 提交按钮 */
.submit{
  position:relative;width:100%;height:50px;border:0;border-radius:14px;
  background:linear-gradient(180deg,var(--ac2) 0%,var(--ac) 100%);
  color:var(--ac-ink);
  font-size:15.5px;font-weight:600;font-family:inherit;letter-spacing:.06em;
  cursor:pointer;overflow:hidden;
  box-shadow:var(--shadow-btn);
  transition:transform .14s cubic-bezier(.4,0,.2,1),box-shadow .2s ease,filter .2s ease;
}
.submit:hover{filter:brightness(1.05);transform:translateY(-1px);
  box-shadow:0 2px 4px rgba(0,90,180,.22),0 14px 28px -8px rgba(0,113,227,.58)}
.submit:active{transform:translateY(0) scale(.988);filter:brightness(.97)}
.submit:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.submit[disabled]{cursor:default;filter:saturate(.6) brightness(1.02);transform:none}
/* 掠光 */
.submit::after{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.30),transparent);
  transform:skewX(-18deg);
  animation:sheen 3.6s ease-in-out infinite;
}
@keyframes sheen{0%,62%{left:-60%}82%,100%{left:130%}}
.submit .sp{
  display:none;width:16px;height:16px;vertical-align:-3px;margin-right:8px;
  border:2px solid rgba(255,255,255,.42);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.submit.loading .sp{display:inline-block}
.submit.loading .tx{opacity:.85}

/* 消息条 */
.msg{
  display:none;align-items:flex-start;gap:9px;
  margin-top:15px;padding:12px 14px;
  border-radius:12px;font-size:13.5px;line-height:1.45;
  animation:msgIn .28s cubic-bezier(.22,1,.36,1) both;
}
.msg svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.msg.err{display:flex;background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.msg.ok{display:flex;background:rgba(26,143,76,.09);color:var(--ok);border:1px solid rgba(26,143,76,.22)}
@keyframes msgIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ================= 页脚 ================= */
.foot{
  margin-top:26px;padding-top:19px;
  border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:12px;color:var(--tx3);
}
.foot a{color:var(--tx2);text-decoration:none;border-bottom:1px solid transparent;
  transition:color .16s ease,border-color .16s ease}
.foot a:hover{color:var(--ac);border-bottom-color:var(--ac)}
.legal{
  margin:20px 0 0;text-align:center;
  font-size:11.5px;color:var(--tx3);letter-spacing:.01em;
}

/* 主题切换 */
.tgl{
  position:fixed;right:20px;top:20px;z-index:5;
  width:40px;height:40px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:var(--tx2);cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(16,24,40,.10);
  transition:transform .16s ease,color .16s ease,border-color .16s ease;
}
.tgl:hover{transform:translateY(-1px);color:var(--ac);border-color:var(--line-strong)}
.tgl svg{width:17px;height:17px;display:block}
.tgl .moon{display:none}
html[data-theme="dark"] .tgl .sun{display:none}
html[data-theme="dark"] .tgl .moon{display:block}

/* ================= 响应式 ================= */
@media (max-width:440px){
  .card{padding:32px 24px 26px;border-radius:20px}
  .tgl{right:14px;top:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  <div class="grid"></div>
</div>

<button class="tgl" id="tgl" type="button" aria-label="切换深浅色" title="切换深浅色">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M4.2 12H1.6M22.4 12H19.8M6.4 6.4 4.6 4.6M19.4 19.4l-1.8-1.8M17.6 6.4l1.8-1.8M4.6 19.4l1.8-1.8"/>
  </svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.7 8.7 0 1 0 10.8 10.8Z"/>
  </svg>
</button>

<main class="wrap">
  <section class="card" id="card">

    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="7" y="8.4" width="18" height="4.3" rx="2.15" fill="#fff" fill-opacity=".48"/>
          <rect x="7" y="14.6" width="18" height="4.3" rx="2.15" fill="#fff" fill-opacity=".76"/>
          <rect x="7" y="20.8" width="11.4" height="4.3" rx="2.15" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>MMOEXP 运营管理中心</h1>
        <p>MMOEXP · 内部运营平台</p>
      </div>
    </div>

    <div class="badge {{STATUS_CLASS}}"><i></i>{{STATUS}}</div>

    <form method="post" action="{{U_LOGIN}}" id="f" novalidate>
      <input type="hidden" name="next" value="{{NEXT}}">

      <div class="field" id="fu">
        <input id="u" name="username" type="text" placeholder=" "
               autocomplete="username" autocapitalize="off" autocorrect="off"
               spellcheck="false" required autofocus>
        <label for="u">账号</label>
      </div>

      <div class="field" id="fp">
        <input id="p" name="password" type="password" placeholder=" "
               autocomplete="current-password" required>
        <label for="p">密码</label>
        <button class="eye" id="eye" type="button" aria-label="显示密码" title="显示密码">
          <svg id="eyei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.2 12S5.7 5.6 12 5.6 21.8 12 21.8 12 18.3 18.4 12 18.4 2.2 12 2.2 12Z"/>
            <circle cx="12" cy="12" r="3.1"/>
          </svg>
        </button>
      </div>

      <div class="row">
        <label class="chk">
          <input type="checkbox" name="remember" value="1" checked>
          <span>保持登录 30 天</span>
        </label>
        <span class="hint">{{HINT}}</span>
      </div>

      <button class="submit" type="submit" id="sub">
        <span class="sp"></span><span class="tx">登 录</span>
      </button>

      <div class="msg {{MSG_KIND}}" id="msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="9.2"/><path d="M12 7.6v5.2"/><path d="M12 16.2h.01"/>
        </svg>
        <span>{{MSG}}</span>
      </div>
    </form>

    <div class="foot">
      <span>{{FOOT_L}}</span>
      <a href="{{U_LOGOUT}}">退出登录</a>
    </div>
  </section>

  <p class="legal">MMOEXP · 内部系统，凭据请勿外传</p>
</main>

<script>
(function(){
  var de=document.documentElement,
      root=de,
      tgl=document.getElementById('tgl'),
      KEY='mmoexp-auth-theme';

  /* ---- 主题：优先 localStorage，其次跟随系统 ---- */
  try{
    var saved=localStorage.getItem(KEY);
    if(saved){de.setAttribute('data-theme',saved);}
    else if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches){
      de.setAttribute('data-theme','dark');
    }
  }catch(e){}

  tgl.addEventListener('click',function(){
    var next=de.getAttribute('data-theme')==='dark'?'light':'dark';
    de.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next);}catch(e){}
  });

  /* ---- 强制 HTTPS：避免在明文下登录导致 Secure Cookie 无法回传 ---- */
  if(location.protocol==='http:'){
    location.replace('https://'+location.host+location.pathname+location.search);
    return;
  }

  /* ---- 密码可见性 ---- */
  var p=document.getElementById('p'), eye=document.getElementById('eye'),
      eyei=document.getElementById('eyei'),
      OPEN='<path d="M2.2 12S5.7 5.6 12 5.6 21.8 12 21.8 12 18.3 18.4 12 18.4 2.2 12 2.2 12Z"/><circle cx="12" cy="12" r="3.1"/>',
      SHUT='<path d="M3 3l18 18"/><path d="M10.6 5.9A9.6 9.6 0 0 1 12 5.6c6.3 0 9.8 6.4 9.8 6.4a17 17 0 0 1-3.3 4.1"/><path d="M6.5 7.9A17.2 17.2 0 0 0 2.2 12s3.5 6.4 9.8 6.4a9.9 9.9 0 0 0 4-.8"/><path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3"/>';
  eye.addEventListener('click',function(){
    var show=p.type==='password';
    p.type=show?'text':'password';
    eyei.innerHTML=show?SHUT:OPEN;
    eye.setAttribute('aria-label',show?'隐藏密码':'显示密码');
    p.focus({preventScroll:true});
  });

  /* ---- 提交：按钮进入 loading，防重复提交 ---- */
  var f=document.getElementById('f'), sub=document.getElementById('sub'),
      msg=document.getElementById('msg'), card=document.getElementById('card'),
      fu=document.getElementById('fu'), fp=document.getElementById('fp');

  if(msg.classList.contains('err')){
    card.classList.add('shake');
    var bad=document.getElementById('u').value?'fp':'fu';
    setTimeout(function(){document.getElementById(bad).querySelector('input').focus({preventScroll:true});},60);
  }

  f.addEventListener('submit',function(e){
    fu.classList.remove('has-error'); fp.classList.remove('has-error');
    var u=document.getElementById('u').value.trim(),
        pw=document.getElementById('p').value;
    if(!u){e.preventDefault();fu.classList.add('has-error');
      card.classList.add('shake');setTimeout(function(){card.classList.remove('shake');},460);
      document.getElementById('u').focus();return;}
    if(!pw){e.preventDefault();fp.classList.add('has-error');
      card.classList.add('shake');setTimeout(function(){card.classList.remove('shake');},460);
      document.getElementById('p').focus();return;}
    sub.classList.add('loading');
    sub.disabled=true;
    sub.querySelector('.tx').textContent='登录中';
    setTimeout(function(){sub.disabled=false;},9000); /* 兜底解锁 */
  });
})();
</script>
