# >>> fs-ip-allowlist-20261015 >>>
# ============================================================================
# FS 平台 · 访问来源白名单（server 级判定）
# ============================================================================
# 由 iggm-web.conf 的 server 块 include；判定变量 $fs_ip_block 定义于
# /etc/nginx/conf.d/fs-ip-allowlist.conf（http 上下文）。
#
# 设计要点
#  1) 非白名单请求单独记一份日志 → 由 /opt/auth-portal/fs_ip_alert.py 推钉钉。
#     这里显式重复主 access.log：nginx 的 access_log 一旦在 server 级出现
#     就不再继承 http 级定义，不重复会导致主访问日志丢记录。
#  2) 拦截用「专用状态码 418 + 私有 location」而不是 error_page 403：
#     本 server 内多个 location 会因权限不足返回 403（统一登录门户的
#     auth_request），若直接改 error_page 403 会把「无权限」误显示成
#     「IP 受限」。418 不被任何业务使用，因此可安全独占。
#  3) 拒绝页回显 $remote_addr，便于本人/同事被误拦时直接报 IP 加白名单。
# ----------------------------------------------------------------------------

access_log /var/log/nginx/access.log main;
access_log /var/log/nginx/ip-denied.log main if=$fs_ip_block;

if ($fs_ip_block) {
    return 418;
}

error_page 418 = @fs_ip_denied;

location @fs_ip_denied {
    default_type text/html;
    return 403 "<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>访问受限</title></head><body style='margin:0;padding:48px 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f7f9;color:#24292f'><div style='max-width:620px;margin:0 auto;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:36px 32px;box-shadow:0 1px 3px rgba(27,31,36,.06)'><div style='font-size:12.5px;letter-spacing:.08em;color:#8c959f;text-transform:uppercase'>FS Platform</div><h1 style='margin:6px 0 10px;font-size:21px;line-height:1.4'>403 · 访问来源受限</h1><p style='margin:0 0 22px;color:#57606a;line-height:1.7'>本平台已启用 IP 白名单，仅允许公司自有出口访问。你当前的公网地址不在允许列表内，本次访问已被记录。</p><div style='background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px'><span style='color:#57606a'>你的公网 IP：</span><b style='color:#cf222e'>$remote_addr</b></div><p style='margin:22px 0 0;color:#57606a;line-height:1.7;font-size:14px'>如果这是你正常的办公网络，请把上面这个 IP 发给管理员加入白名单。</p><p style='margin:10px 0 0;color:#8c959f;font-size:12.5px'>时间：$time_iso8601</p></div></body></html>";
}
# <<< fs-ip-allowlist-20261015 <<<
