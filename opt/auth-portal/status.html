<!doctype html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>登录状态 · MMOEXP 运营管理中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Crect x='7' y='8.4' width='18' height='4.3' rx='2.15' fill='%23fff' fill-opacity='.48'/%3E%3Crect x='7' y='14.6' width='18' height='4.3' rx='2.15' fill='%23fff' fill-opacity='.76'/%3E%3Crect x='7' y='20.8' width='11.4' height='4.3' rx='2.15' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7; --bg2:#eceef3;
  --surface:rgba(255,255,255,.72); --surface-solid:#ffffff; --surface-sunken:#f7f8fa;
  --line:rgba(0,0,0,.07); --line-strong:rgba(0,0,0,.13);
  --tx:#1d1d1f; --tx2:#6e6e73; --tx3:#a1a1a6;
  --ac:#0071e3; --ac2:#0a84ff; --violet:#5e5ce6; --teal:#0aa2a2;
  --ok:#1a8f4c; --ok-soft:rgba(26,143,76,.09); --ok-line:rgba(26,143,76,.22);
  --shadow-card:0 1px 1px rgba(16,24,40,.04),0 8px 20px -8px rgba(16,24,40,.13),0 28px 56px -24px rgba(16,24,40,.20);
  --shadow-btn:0 1px 2px rgba(0,90,180,.20),0 10px 22px -8px rgba(0,113,227,.50);
  --orb-op:.32; --radius:22px;
}
html[data-theme="dark"]{
  --bg:#0a0c11; --bg2:#05070b;
  --surface:rgba(26,29,36,.68); --surface-solid:#1a1d24; --surface-sunken:#14171d;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --tx:#f5f6f8; --tx2:#a8adba; --tx3:#6d7280;
  --ac:#0a84ff; --ac2:#3f9dff;
  --ok:#32d074; --ok-soft:rgba(50,208,116,.10); --ok-line:rgba(50,208,116,.26);
  --shadow-card:0 1px 1px rgba(0,0,0,.30),0 12px 28px -10px rgba(0,0,0,.55),0 40px 72px -32px rgba(0,0,0,.70);
  --orb-op:.30;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;padding:28px 20px;overflow-x:hidden;
}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,transparent 55%,var(--bg2) 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(72px);opacity:var(--orb-op);will-change:transform}
.orb.o1{width:48vmax;height:48vmax;left:-18vmax;top:-20vmax;
  background:radial-gradient(circle at 38% 38%,rgba(0,113,227,.62) 0%,rgba(0,113,227,.22) 46%,transparent 72%);animation:drift1 26s ease-in-out infinite}
.orb.o2{width:40vmax;height:40vmax;right:-16vmax;top:-10vmax;
  background:radial-gradient(circle at 60% 40%,rgba(94,92,230,.44) 0%,rgba(94,92,230,.16) 48%,transparent 74%);animation:drift2 32s ease-in-out infinite}
.orb.o3{width:42vmax;height:42vmax;right:-4vmax;bottom:-20vmax;
  background:radial-gradient(circle at 50% 50%,rgba(10,162,162,.36) 0%,rgba(10,162,162,.13) 48%,transparent 74%);animation:drift3 38s ease-in-out infinite}
html[data-theme="dark"] .orb{filter:blur(88px)}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,3vmax) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4vmax,4vmax) scale(1.10)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3vmax,-3vmax) scale(1.06)}}

.wrap{position:relative;z-index:1;width:100%;max-width:470px}
.card{
  position:relative;background:var(--surface);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-card);
  padding:38px 36px 30px;overflow:hidden;
  animation:rise .68s cubic-bezier(.22,1,.36,1) both;
}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;
  background:linear-gradient(90deg,transparent 0%,var(--ac) 22%,var(--violet) 52%,var(--teal) 78%,transparent 100%);opacity:.9}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}
.mark{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#0a84ff 0%,#0071e3 46%,#5e5ce6 100%);
  box-shadow:0 6px 16px -5px rgba(0,113,227,.55),inset 0 1px 0 rgba(255,255,255,.34)}
.mark svg{width:25px;height:25px;display:block}
.brand h1{margin:0;font-size:16.5px;font-weight:650;letter-spacing:-.015em}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--tx3)}

.ok-line{display:flex;align-items:center;gap:10px;margin-bottom:22px;
  padding:13px 15px;border-radius:13px;background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok);
  font-size:14px;font-weight:550;animation:msgIn .3s cubic-bezier(.22,1,.36,1) both}
.ok-line svg{width:18px;height:18px;flex:0 0 18px}
@keyframes msgIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-solid)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--tx3);flex:0 0 auto}
.row .v{color:var(--tx);font-weight:550;text-align:right;word-break:break-all;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tag{display:inline-block;padding:2.5px 9px;border-radius:7px;font-size:12.5px;font-weight:600;
  background:var(--surface-sunken);border:1px solid var(--line);margin-left:6px}
.tag.g1{color:var(--ac);border-color:rgba(0,113,227,.28);background:rgba(0,113,227,.07)}
.tag.g2{color:var(--violet);border-color:rgba(94,92,230,.28);background:rgba(94,92,230,.07)}

.note{margin:18px 2px 0;font-size:12.5px;color:var(--tx3);line-height:1.6}
.note code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  background:var(--surface-sunken);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--tx2)}

.acts{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;height:46px;border-radius:13px;font-size:14.5px;font-weight:600;font-family:inherit;
  cursor:pointer;display:grid;place-items:center;text-decoration:none;letter-spacing:.01em;
  transition:transform .14s cubic-bezier(.4,0,.2,1),filter .2s ease,box-shadow .2s ease,border-color .16s ease;
  border:1px solid transparent}
.btn.primary{background:linear-gradient(180deg,var(--ac2) 0%,var(--ac) 100%);color:#fff;box-shadow:var(--shadow-btn)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.ghost{background:var(--surface-solid);color:var(--tx2);border-color:var(--line-strong)}
.btn.ghost:hover{color:var(--tx);border-color:var(--tx3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}

.foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tx3)}
.legal{margin:20px 0 0;text-align:center;font-size:11.5px;color:var(--tx3)}

.tgl{position:fixed;right:20px;top:20px;z-index:5;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:var(--tx2);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(16,24,40,.10);transition:transform .16s ease,color .16s ease}
.tgl:hover{transform:translateY(-1px);color:var(--ac)}
.tgl svg{width:17px;height:17px;display:block}
.tgl .moon{display:none}
html[data-theme="dark"] .tgl .sun{display:none}
html[data-theme="dark"] .tgl .moon{display:block}

@media (max-width:440px){
  .card{padding:32px 24px 26px;border-radius:20px}
  .tgl{right:14px;top:14px}
  .acts{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
</div>

<button class="tgl" id="tgl" type="button" aria-label="切换深浅色" title="切换深浅色">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M4.2 12H1.6M22.4 12H19.8M6.4 6.4 4.6 4.6M19.4 19.4l-1.8-1.8M17.6 6.4l1.8-1.8M4.6 19.4l1.8-1.8"/>
  </svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.7 8.7 0 1 0 10.8 10.8Z"/>
  </svg>
</button>

<main class="wrap">
  <section class="card">

    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="7" y="8.4" width="18" height="4.3" rx="2.15" fill="#fff" fill-opacity=".48"/>
          <rect x="7" y="14.6" width="18" height="4.3" rx="2.15" fill="#fff" fill-opacity=".76"/>
          <rect x="7" y="20.8" width="11.4" height="4.3" rx="2.15" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>MMOEXP 运营管理中心</h1>
        <p>MMOEXP · 内部运营平台</p>
      </div>
    </div>

    <div class="ok-line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.2"/><path d="m8.2 12.3 2.6 2.6 5-5.3"/>
      </svg>
      身份已确认，凭据有效
    </div>

    <div class="rows">
      <div class="row"><span class="k">账号</span><span class="v">{{USER}}</span></div>
      <div class="row"><span class="k">权限组</span><span class="v">{{GROUP_TAGS}}</span></div>
      <div class="row"><span class="k">会话到期</span><span class="v">{{EXP}}</span></div>
      <div class="row"><span class="k">剩余有效</span><span class="v">{{LEFT}}</span></div>
      <div class="row"><span class="k">登录来源 IP</span><span class="v">{{IP}}</span></div>
    </div>

    <p class="note">
      本次为<b>预览模式</b>：登录门户已就绪，但各业务页面（看板 / 改价 / 部署等）仍在使用旧的浏览器弹窗鉴权，
      所以点下面的入口还会弹出一次系统密码框 —— 这属于预期现象，切换正式启用后不会再出现。
    </p>

    <div class="acts">
      <a class="btn primary" href="{{U_HOME}}">进入运营看板</a>
      <a class="btn ghost" href="{{U_LOGOUT}}">退出登录</a>
    </div>

    <div class="foot">
      <span>auth-portal {{VER}}</span>
      <span>{{NOW}}</span>
    </div>
  </section>

  <p class="legal">MMOEXP · 内部系统，凭据请勿外传</p>
</main>

<script>
(function(){
  var de=document.documentElement, KEY='mmoexp-auth-theme';
  try{
    var saved=localStorage.getItem(KEY);
    if(saved){de.setAttribute('data-theme',saved);}
    else if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches){
      de.setAttribute('data-theme','dark');
    }
  }catch(e){}
  document.getElementById('tgl').addEventListener('click',function(){
    var next=de.getAttribute('data-theme')==='dark'?'light':'dark';
    de.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next);}catch(e){}
  });
})();
</script>
</body>
</html>
