# =============================================================================
# Discord 机器人控制台 · nginx location 片段
# 建立：2026-10-14。由标记块方式 include 进 /etc/nginx/conf.d/iggm-web.conf。
#
# 依赖（不得新增/修改）：
#   * 统一登录门户 auth_request 子请求 /__auth_verify -> 127.0.0.1:8895/verify
#   * 登录跳转命名 location @auth_login                -> 已存在于主配置
#   * 后端 127.0.0.1:8936                              -> bot-console.service
#
# 权限边界：本片段只做 L1（是否登录）。写操作（改配置 / 启停服务）由后端依据
#           X-Auth-Role 二次判定为 admin。
#           身份头由本片段用 proxy_set_header 覆盖写入 —— 客户端自带同名头无效。
# =============================================================================

location = /bots {
    return 301 /bots/;
}

location /bots/ {
    # 控制台只用到这三种方法
    if ($request_method !~ "^(GET|HEAD|POST)$") {
        return 405;
    }

    auth_request /__auth_verify;
    auth_request_set $bots_user $upstream_http_x_auth_user;
    auth_request_set $bots_role $upstream_http_x_auth_role;
    error_page 401 = @auth_login;

    # 关掉上游压缩，否则 server 级 sub_filter 注入全站导航条会失效
    proxy_set_header Accept-Encoding "";

    proxy_pass http://127.0.0.1:8936/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 身份唯一来源：用已验证的头覆盖客户端传来的同名字头
    proxy_set_header X-Auth-User $bots_user;
    proxy_set_header X-Auth-Role $bots_role;

    proxy_read_timeout 120s;
    client_max_body_size 1m;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    expires -1;
}
