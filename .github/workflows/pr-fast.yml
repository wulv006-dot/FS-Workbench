name: PR fast
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-fast:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.9.18'
          architecture: x64
          check-latest: false
      - name: Prepare affected browser check
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^releases/fs-dashboard/(game-boards-all-20261012|on-demand-20261012)/'; then
            npm install --prefix "$RUNNER_TEMP/fs-browser" --no-audit --no-fund playwright@1.62.1
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/fs-browser/browsers" "$RUNNER_TEMP/fs-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Prepare fixed Hermes runtime dependencies
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -q '^releases/fs-dashboard/hermes-fc-pilot-20261013/'; then
            python releases/fs-dashboard/hermes-fc-pilot-20261013/runtime_ci.py --prepare
          fi
      - name: Diff and isolated affected checks
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$PR_BASE" "$PR_HEAD" > "$RUNNER_TEMP/pr-paths"
          QA_PYTHON="${{ steps.python.outputs.python-path }}"
          QA_LIBRARY="$(dirname "$QA_PYTHON")/../lib"
          QA_NODE_DIR="$(dirname "$(command -v node)")"
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec env -i PATH="/usr/bin:/bin:$7" LD_LIBRARY_PATH="$1" PYTHONDONTWRITEBYTECODE=1 PYTHONIOENCODING=utf-8 NODE_PATH="$8" PLAYWRIGHT_BROWSERS_PATH="$9" "$2" -I -B "$3/tools/pr_fast.py" "$4" "$5" "$6"
          ' bash "$QA_LIBRARY" "$QA_PYTHON" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pr-paths" "$PR_BASE" "$PR_HEAD" "$QA_NODE_DIR" "$RUNNER_TEMP/fs-browser/node_modules" "$RUNNER_TEMP/fs-browser/browsers"

