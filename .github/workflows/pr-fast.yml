name: PR fast
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-fast:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.9.18'
          architecture: x64
          check-latest: false
      - name: Prepare existing Players image dependency
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^(fc27_players_cloud/(player_web/|tests_cloud/)|releases/fc-players/direct-json-20261029/)'; then
            python -m pip install --disable-pip-version-check --no-deps Pillow==9.0.1
          fi
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^releases/(fc-players/direct-json-20261029/|fs-dashboard/hermes-conversation-20261018/)'; then
            python -m pip install --disable-pip-version-check --no-deps openpyxl==3.1.5 et_xmlfile==2.0.0
          fi
      - name: Prepare FC community runtime dependency
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^opt/(mmoexp-fc-community/|mmoexp-fc-quotes/|fc27-news-fetch/|bot-console/(server.py|test_fc_console.py|static/fc27.html)$)'; then
            python -m pip install --disable-pip-version-check -r opt/mmoexp-fc-community/requirements.txt
          fi
      - name: Prepare RPG console runtime dependency
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^(opt/d4follow/|releases/rpg-console/console-v2-20261112/|tools/release_d4follow.py$)'; then
            python -m pip install --disable-pip-version-check -r releases/rpg-console/console-v2-20261112/tests/requirements.txt
          fi
      - name: Prepare affected browser check
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -E '^releases/fs-dashboard/(campaign-analytics-20261023|dashboard-refresh-20261025|actual-profit-20261024|shipping-profit-20261024|rs-adapter-20261024|business-procurement-20261022|channel-effects-20261021|game-boards-all-20261012|on-demand-20261012|hermes-report-theme-20261017|hermes-data-workspace-20261018|hermes-generic-data-20261018|hermes-customer-tracking-20261018|hermes-report-repair-20261019)/|^releases/registration/iam-modules-20261031/|^opt/fs-access-policy/web/|^tests/test_fs_iam_registration.cjs$' > /dev/null; then
            npm install --prefix "$RUNNER_TEMP/fs-browser" --no-audit --no-fund playwright@1.62.1
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/fs-browser/browsers" "$RUNNER_TEMP/fs-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^releases/fs-dashboard/(hermes-generic-data-20261018|hermes-customer-tracking-20261018|hermes-report-repair-20261019)/'; then
            python -m pip install --disable-pip-version-check playwright==1.60.0
            PLAYWRIGHT_SKIP_BROWSER_GC=1 PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/fs-browser/browsers" python -m playwright install chromium
          fi
      - name: Prepare existing channel parser dependency
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^releases/fs-dashboard/(channel-effects-20261021|dashboard-refresh-20261025|actual-profit-20261024|campaign-analytics-20261023)/'; then
            python -m pip install --disable-pip-version-check --no-deps lxml==6.1.3
          fi
      - name: Prepare fixed Hermes runtime dependencies
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -q '^releases/fs-dashboard/hermes-fc-pilot-20261013/'; then
            python releases/fs-dashboard/hermes-fc-pilot-20261013/runtime_ci.py --prepare
          fi
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^releases/fs-dashboard/hermes-conversation-20261018/'; then
            python -m pip install --disable-pip-version-check --no-deps -r releases/fs-dashboard/hermes-conversation-20261018/requirements-files.txt
          fi
      - name: Detect connector checks
        id: connector
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Eq '^(fs_mcp_connector/|docs/planning/fs-data-connector-20261109/deploy/)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.connector.outputs.changed == 'true'
        id: connector-python
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Prepare connector SDK
        if: steps.connector.outputs.changed == 'true'
        run: '"${{ steps.connector-python.outputs.python-path }}" -m pip install --disable-pip-version-check -r fs_mcp_connector/requirements.txt'
      - name: Diff and isolated affected checks
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$PR_BASE" "$PR_HEAD" > "$RUNNER_TEMP/pr-paths"
          QA_PYTHON="${{ steps.python.outputs.python-path }}"
          QA_LIBRARY="$(dirname "$QA_PYTHON")/../lib"
          QA_NODE_DIR="$(dirname "$(command -v node)")"
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec env -i PATH="/usr/bin:/bin:$7" LD_LIBRARY_PATH="$1" PYTHONDONTWRITEBYTECODE=1 PYTHONIOENCODING=utf-8 NODE_PATH="$8" PLAYWRIGHT_BROWSERS_PATH="$9" FS_CONNECTOR_PYTHON="${10}" "$2" -I -B "$3/tools/pr_fast.py" "$4" "$5" "$6"
          ' bash "$QA_LIBRARY" "$QA_PYTHON" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pr-paths" "$PR_BASE" "$PR_HEAD" "$QA_NODE_DIR" "$RUNNER_TEMP/fs-browser/node_modules" "$RUNNER_TEMP/fs-browser/browsers" "${{ steps.connector-python.outputs.python-path }}"
