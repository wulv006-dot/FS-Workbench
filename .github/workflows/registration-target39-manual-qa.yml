          "name": "One synthetic registration delta integration; loopback namespace; 120 seconds",
          "id": "delta",
          "shell": "bash",
          "env": {
            "QA_PY": "${{ steps.python.outputs.python-path }}",
            "QA_LIB": "${{ steps.sqlite.outputs.lib }}",
            "QA_NGINX": "${{ steps.nginx.outputs.nginx }}",
            "QA_OPENSSL": "${{ steps.nginx.outputs.openssl }}",
            "DRIVER_COMMIT": "${{ github.sha }}"
          },
          "run": "set -euo pipefail\numask 077\n[[ \"$QA_PY\" = /* && -x \"$QA_PY\" ]]\n[[ \"$QA_LIB\" = /tmp/registration-target39-*/sqlite/lib && -d \"$QA_LIB\" ]]\n[[ \"$QA_NGINX\" = /tmp/registration-delta-nginx-*/install/sbin/nginx && -x \"$QA_NGINX\" ]]\n[[ \"$QA_OPENSSL\" = /* && -x \"$QA_OPENSSL\" ]]\n[[ \"$DRIVER_COMMIT\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$GITHUB_RUN_ID\" =~ ^[0-9]+$ && \"$GITHUB_RUN_ATTEMPT\" =~ ^[0-9]+$ ]]\nBASE=\"$(mktemp -d /tmp/registration-delta-run-XXXXXXXX)\"\nRECEIPT=\"$RUNNER_TEMP/registration-delta-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json\"\nprintf 'base=%s\nreceipt=%s\n' \"$BASE\" \"$RECEIPT\" >> \"$GITHUB_OUTPUT\"\n[[ ! -e \"$RECEIPT\" && ! -L \"$RECEIPT\" ]]\nQA_LIBRARY=\"$QA_LIB:$(dirname \"$QA_PY\")/../lib\"\nsudo unshare --net --pid --fork --mount-proc --kill-child=KILL -- bash -c '\n  set -euo pipefail\n  ip link set lo up\n  [[ \"$(ip -o link show | wc -l)\" = 1 ]]\n  ip -o link show dev lo >/dev/null\n  [[ -z \"$(ip route show default)\" && -z \"$(ip -6 route show default)\" ]]\n  exec setpriv --reuid \"$9\" --regid \"${10}\" --clear-groups env -i \\\n    PATH=/usr/bin:/bin LD_LIBRARY_PATH=\"$1\" PYTHONDONTWRITEBYTECODE=1 PYTHONIOENCODING=utf-8 \\\n    TMPDIR=\"$7\" DRIVER_COMMIT=\"$8\" \\\n    timeout --signal=TERM --kill-after=15s 120s \"$2\" -I -B \\\n    \"$3/tests/registration-release-delta-qa-20261007/linux_delta_entry.py\" \\\n    --source-root \"$3/registration-source\" --nginx \"$4\" --openssl \"$5\" --output \"$6\"\n' bash \"$QA_LIBRARY\" \"$QA_PY\" \"$GITHUB_WORKSPACE\" \"$QA_NGINX\" \"$QA_OPENSSL\" \"$RECEIPT\" \"$BASE\" \"$DRIVER_COMMIT\" \"$(id -u)\" \"$(id -g)\"\n"
        },
        {
          "name": "Preserve sanitized synthetic-only receipt",
          "if": "${{ always() && steps.delta.outputs.receipt != '' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "registration-delta-receipt-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ steps.delta.outputs.receipt }}",
            "if-no-files-found": "error",
            "retention-days": 7,
            "compression-level": 0
          }
        },
        {
          "name": "Remove only this run private prefixes",
          "if": "${{ always() }}",
          "shell": "bash",
          "env": {
            "QA_SQLITE_BASE": "${{ steps.sqlite.outputs.base }}",
            "QA_NGINX_BASE": "${{ steps.nginx.outputs.base }}",
            "QA_DELTA_BASE": "${{ steps.delta.outputs.base }}"
          },
          "run": "set -euo pipefail\n/usr/bin/python3 -I -B - <<'CLEANUP'\nimport os, shutil\nfrom pathlib import Path\nfor key, prefix in (('QA_SQLITE_BASE','registration-target39-'),\n                    ('QA_NGINX_BASE','registration-delta-nginx-'),\n                    ('QA_DELTA_BASE','registration-delta-run-')):\n    value=os.environ.get(key)\n    if not value:\n        continue\n    path=Path(value)\n    assert path.is_absolute() and path.parent==Path('/tmp') and path.name.startswith(prefix)\n    assert not path.is_symlink() and path.resolve()==path\n    if path.exists():\n        shutil.rmtree(path)\nCLEANUP\n"
        }
      ]
    }
  }
}
