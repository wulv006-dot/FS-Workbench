{
  "name": "Registration target3.9.18 + SQLite3.53.4 manual QA",
  "run-name": "Registration ${{ inputs.mode }} / target3.9.18+3.53.4",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "description": "registration_delta synthetic routes, or explicit original runtime43 + multiprocess4",
          "type": "choice",
          "required": true,
          "default": "registration_delta",
          "options": [
            "registration_delta",
            "runtime43_multiprocess4"
          ]
        },
        "free_quota_confirmed": {
          "description": "Root verified at least10 free Actions minutes; only this registered single run, stop if zero/unknown",
          "type": "boolean",
          "required": true,
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "registration-target39-manual-qa",
    "cancel-in-progress": false
  },
  "jobs": {
    "target39": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == 'wulv006-dot/FS-Workbench' && github.ref == 'refs/heads/main' && inputs.mode == 'runtime43_multiprocess4' && inputs.free_quota_confirmed }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout fixed merged source; never execute FC candidate",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "wulv006-dot/FS-Workbench",
            "ref": "ca6258ad9cdb80e7c2428731cb796de20303f4c1",
