          "run": "set -euo pipefail\n/usr/bin/python3 -I -B - <<'PY'\nimport os,shutil\nfrom pathlib import Path\npath=Path(os.environ['QA_BASE'])\nassert path.is_absolute() and path.parent==Path('/tmp') and path.name.startswith('registration-target39-')\nassert not path.is_symlink() and path.resolve()==path\nif path.exists():shutil.rmtree(path)\nPY\n"
        }
      ]
    },
    "registration_delta": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == 'wulv006-dot/FS-Workbench' && github.ref == 'refs/heads/main' && inputs.mode == 'registration_delta' && inputs.free_quota_confirmed }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
