<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>销售部系统 · Aion 2</title>
<style>
:root{
  /* 与服务器 /d4/ 看板同款亮色系（Apple 风） */
  --bg:#f5f5f7; --bg2:#ffffff; --card:#ffffff; --card2:#f7f7f9;
  --line:#ececf0; --line2:#d9d9de;
  --tx:#1d1d1f; --tx2:#4d4d52; --tx3:#8e8e93;
  --blue:#0071e3; --green:#0a8f4d; --red:#d70015; --yellow:#b25000;
  --mauve:#7d3cce; --teal:#0a7f8f; --peach:#c2410c; --sky:#0a6ea8;
  --accent:#0071e3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:0 0 60px}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1680px;margin:0 auto;padding:0 20px}

/* ---------- 顶栏 ---------- */
header{background:linear-gradient(180deg,#ffffff,rgba(255,255,255,.88));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hd{display:flex;align-items:center;gap:14px;padding:12px 0}
.hd h1{font-size:17px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(10,143,77,.6)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.hd .sp{flex:1}
.hd .meta{font-size:11px;color:var(--tx3)}
button{font:inherit;cursor:pointer;background:var(--bg2);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;transition:.15s;height:34px}
button:hover{background:#efeff2;border-color:var(--accent)}
button.primary{background:var(--accent);color:#ffffff;border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}

/* ---------- 筛选区 ---------- */
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0;display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px;align-items:start;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.f>label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);margin-bottom:6px;letter-spacing:.4px}
.f>input,.f>select{width:100%;height:36px;background:var(--bg2);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:0 10px;font:inherit}
.f>input:focus,.f>select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,113,227,.14)}
.seg{display:flex;height:36px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx2);cursor:pointer;border-left:1px solid var(--line);transition:.12s;user-select:none}
.seg span:first-child{border-left:none}
.seg span:hover{color:var(--tx);background:#efeff2}
.seg span.on{background:var(--accent);color:#ffffff;font-weight:600}
.hint{font-size:11px;color:var(--tx3);font-weight:400;letter-spacing:0}
.f.span3{grid-column:span 3}
.ms-trigger{height:36px}
@media(max-width:1100px){.filters{grid-template-columns:repeat(3,1fr)}.f.span3{grid-column:span 3}}

/* ---------- 下拉多选（自绘，无 CDN） ---------- */
.ms{position:relative}
.ms-box{position:relative}
.ms-trigger{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line2);
  border-radius:7px;padding:7px 9px;cursor:pointer;user-select:none;min-height:34px}
.ms-trigger:hover{border-color:var(--accent)}
.ms.on .ms-trigger{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,113,227,.16)}
.ms-trigger .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-trigger .tx.ph{color:var(--tx3)}
.ms-trigger .caret{color:var(--tx3);font-size:10px;transition:transform .15s}
.ms.on .ms-trigger .caret{transform:rotate(180deg)}
.ms-panel{position:absolute;top:calc(100% + 6px);left:0;width:max(100%,330px);z-index:60;background:var(--bg2);
  border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 36px rgba(16,24,40,.18);display:none;overflow:hidden}
.ms.on .ms-panel{display:block}
.ms-search{padding:8px;border-bottom:1px solid var(--line)}
.ms-search input{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line2);
  border-radius:6px;padding:6px 9px;font:inherit}
.ms-search input:focus{outline:none;border-color:var(--accent)}
.ms-acts{display:flex;align-items:center;gap:12px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:11px}
.ms-acts a{color:var(--blue);cursor:pointer}
.ms-acts a:hover{text-decoration:underline}
.ms-acts .cnt{margin-left:auto;color:var(--tx3)}
.ms-list{max-height:290px;overflow:auto;padding:4px}
.ms-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.ms-row:hover{background:#f2f2f5}
.ms-row input{accent-color:var(--accent);cursor:pointer;flex:none;width:14px;height:14px;margin:0}
.ms-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-row .sub{color:var(--tx3);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.ms-row .tg{font-size:10px;color:var(--tx2);border:1px solid var(--line2);border-radius:20px;padding:0 6px;flex:none}
.ms-empty{padding:16px;text-align:center;color:var(--tx3);font-size:11px}
.ms-chips{display:none;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#eef4fc;
  border:1px solid #c9def6;border-radius:20px;padding:2px 8px;color:var(--tx);max-width:200px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{cursor:pointer;color:var(--tx3);font-style:normal;flex:none}
.chip i:hover{color:var(--red)}
.chip.more{color:var(--tx3);border-style:dashed;background:var(--card2);border-color:var(--line2)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.kpi.k2::after{background:var(--green)} .kpi.k3::after{background:var(--mauve)}
.kpi.k4::after{background:var(--peach)} .kpi.k5::after{background:var(--teal)}
.kpi.k6::after{background:var(--yellow)} .kpi.k7::after{background:var(--red)}
.kpi .lb{font-size:11px;color:var(--tx3);letter-spacing:.3px}
.kpi .vl{font-size:22px;font-weight:650;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .sb{font-size:11px;color:var(--tx3);margin-top:3px}

/* ---------- 卡片/图表 ---------- */
.grid{display:grid;gap:16px;margin-bottom:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card>h2{font-size:13px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);flex:none}
.card>h2 .sp{flex:1}
.card>h2 small{font-weight:400;color:var(--tx3);font-size:11px}
/* 表格自带筛选框（每张表独立生效，不联动其它表） */
.tfilter{display:flex;align-items:center;gap:7px;margin-left:auto}
.tfilter input{width:172px;height:28px;background:var(--card2);color:var(--tx);border:1px solid var(--line2);
  border-radius:7px;padding:0 9px;font:inherit;font-size:11.5px}
.tfilter input::placeholder{color:var(--tx3)}
.tfilter input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,113,227,.14)}
.tfilter.none input{border-color:#e7a9ae;background:#fdf3f4}
.tfilter .cnt{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .bd{padding:14px 16px}
.card .bd.tight{padding:0}
svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--tx2);padding:0 16px 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--tx2);font-weight:600;font-size:11px;position:sticky;top:0;cursor:pointer;user-select:none;z-index:2}
th:hover{color:var(--tx)}
/* 表头是 sticky 冻结的：滚动时补一层投影，让「已冻结」看得出来 */
.scroll.scrolled th{box-shadow:0 6px 10px -8px rgba(16,24,40,.45)}
.scroll.scrolled thead th:first-child{box-shadow:0 6px 10px -8px rgba(16,24,40,.45),inset 3px 0 0 var(--accent)}
th.l,td.l{text-align:left}
tbody tr:hover{background:#f5f5f7}
tbody tr.clickable{cursor:pointer}
tbody tr.sel{background:#e8f1fc}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--tx3)}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;background:var(--card2);color:var(--tx2);border:1px solid var(--line2)}
.pill.code{color:var(--yellow);border-color:#ecd9b8;background:#fff8e6}
.pill.uid{color:var(--sky);border-color:#c2dcf5;background:#eaf3fc}
.scroll{max-height:min(72vh,760px);overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.orders-scroll{height:clamp(540px,76vh,1000px);max-height:none}
@media(max-height:650px){.orders-scroll{height:76vh}}
@media(max-width:600px){.orders-scroll{height:72vh}}
#tOd th{background:var(--card2);z-index:3}
.scroll table th{top:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2);flex-wrap:wrap;background:var(--card2)}
.toolbar .sp{flex:1}
.err{background:#fdeaea;border:1px solid #f2b8bd;color:var(--red);padding:12px 16px;border-radius:10px;margin:16px 0;font-size:12px;white-space:pre-wrap}
.empty{padding:40px;text-align:center;color:var(--tx3)}
footer{margin-top:26px;color:var(--tx3);font-size:11px;line-height:1.9}
footer b{color:var(--tx2);font-weight:600}
#tip{position:fixed;pointer-events:none;background:#ffffff;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font-size:11px;color:var(--tx);opacity:0;transition:.1s;z-index:99;white-space:pre;box-shadow:0 6px 20px rgba(16,24,40,.16)}

/* ===== 2026-10-17 销售部系统改版：表头下拉 / 当日读数 / 大区分组 / toast ===== */
.thdd{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;white-space:nowrap}
.thdd:hover{color:var(--ac2,rgb(0,113,227))}
.thdd.on{color:rgb(0,113,227);font-weight:600}
.dd{position:fixed;z-index:300;width:236px;max-height:330px;background:var(--card,#fff);border:1px solid var(--line2,#e5e5ea);
  border-radius:10px;box-shadow:0 12px 34px rgba(16,24,40,.18);display:flex;flex-direction:column;overflow:hidden;font-size:12px}
.dd-hd{padding:8px 10px;border-bottom:1px solid var(--line2,#e5e5ea);display:flex;justify-content:space-between;font-weight:600}
.dd-acts{padding:6px 10px;display:flex;gap:10px;border-bottom:1px solid var(--line2,#e5e5ea)}
.dd-acts a{color:rgb(0,113,227);cursor:pointer}
.dd-list{overflow:auto;padding:4px 0}
.dd-row{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer}
.dd-row:hover{background:rgba(0,113,227,.06)}
.dd-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-row i{font-style:normal;color:var(--tx3,#a1a1a6);font-size:11px}
.tkpi{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0 12px}
.tkpi .tk{flex:1;min-width:170px;border:1px solid var(--line2,#e5e5ea);border-radius:10px;padding:9px 12px;background:var(--bg2,#fbfbfd)}
.tkpi .tk span{display:block;font-size:11px;color:var(--tx3,#a1a1a6)}
.tkpi .tk b{display:block;font-size:19px;line-height:1.35;margin-top:2px}
.tkpi .tk i{font-style:normal;font-size:11px;color:var(--tx2,#6e6e73)}
.rgnblk{margin-bottom:14px}
.rgnblk:last-child{margin-bottom:0}
.rgnhd{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;font-size:12px}
.rgnrow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11px}
.rgnrow .nm{width:88px;color:var(--tx2,#6e6e73);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgnrow .vv{width:104px;text-align:right}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:#1d1d1f;color:#fff;padding:9px 16px;
  border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:#0a7f4d}
#toast.warn{background:#b3261e;max-width:520px;text-align:center;line-height:1.5}

/* ===== 2026-10-17 二轮改版：区服卡片切换 / 饼图 / 世界地图 / 折扣码悬浮 ===== */
.rgntabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px;margin-bottom:16px}
.rtab{height:auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;
  padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);transition:.14s}
.rtab:hover{background:#fff;border-color:var(--c,var(--accent));transform:translateY(-1px)}
.rtab .rt-nm{font-size:12px;color:var(--tx2);font-weight:600}
.rtab .rt-v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.rtab .rt-m{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.rtab.on{background:#fff;border-color:var(--c,var(--accent));
  box-shadow:inset 3px 0 0 var(--c,var(--accent)),0 2px 8px rgba(16,24,40,.07)}
.rtab.on .rt-nm{color:var(--c,var(--accent))}
.rgnhd2{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-size:12px}
.srvlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;padding-right:4px}
@media(max-width:1420px){.srvlist{grid-template-columns:1fr 1fr}}
@media(max-width:1180px){.srvlist{grid-template-columns:1fr}}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.donutwrap.hz{display:grid;grid-template-columns:176px minmax(0,1fr);gap:20px;align-items:center;justify-items:center}
.donutwrap.hz .dlegend{width:100%;max-width:360px;justify-self:start}
.donut{width:176px;height:176px;flex:none}
.dlegend{width:100%;display:flex;flex-direction:column;gap:5px}
.dl-row{display:flex;align-items:center;gap:7px;font-size:11.5px}
.dl-row i{width:8px;height:8px;border-radius:2px;flex:none}
.dl-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.dl-row b{font-variant-numeric:tabular-nums;font-weight:600}
.dl-row .mut{width:78px;text-align:right;font-variant-numeric:tabular-nums}
.wmapbox{border-radius:10px;background:linear-gradient(180deg,#fbfcfe,#f3f6fa);padding:6px 4px}
.wmap{display:block;width:100%;height:auto}
.wmap path[data-tip],.wmap circle[data-tip]{cursor:default}
.wmap path[data-tip]:hover{filter:brightness(1.05)}
.wtop{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.wt-row{display:flex;align-items:center;gap:8px;font-size:11.5px}
.wt-rk{width:14px;color:var(--tx3);font-variant-numeric:tabular-nums}
.wt-nm{width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.wt-v{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.wt-p{width:52px;text-align:right;font-variant-numeric:tabular-nums}
.pwho{color:#0b57d0;font-weight:650;border-bottom:1px dashed rgba(11,87,208,.35);cursor:help}
.pwho:hover{color:#0071e3;border-bottom-color:#0071e3}
/* 自然流量：不是推广人，深色不加下划线、不挂悬浮码 */
.pname.pin{color:var(--tx);font-weight:650;border-bottom:0;cursor:default}
tr.pinrow td{background:#fbfcfe}
/* 前五名次徽章 */
.rk{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  font-size:10px;font-weight:700;color:#fff;margin-right:7px;vertical-align:1px;flex:none;
  background:#c7c7cc;box-shadow:0 1px 2px rgba(16,24,40,.18)}
.rk.k1{background:linear-gradient(150deg,#ffd24d,#e39b00);box-shadow:0 2px 6px rgba(227,155,0,.45)}
.rk.k2{background:linear-gradient(150deg,#e2e6ec,#9aa3b0);box-shadow:0 2px 5px rgba(122,132,146,.35)}
.rk.k3{background:linear-gradient(150deg,#eab68a,#b9743a);box-shadow:0 2px 5px rgba(185,116,58,.35)}
.rk.k4,.rk.k5{background:linear-gradient(150deg,#8dbcF0,#3f8ae2)}
@media(max-width:1420px){
  .rgntabs{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.donutwrap.hz .donut{width:190px;height:190px}
.paybar{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2)}
/* 国家 / 支付 两卡等高：卡片撑满网格行，支付卡把剩余高度分给条形行高 */
.grid.g3{align-items:stretch}
.grid.g3>.card{display:flex;flex-direction:column}
.grid.g3>.card>.bd{flex:1;display:flex;flex-direction:column;min-height:0}
.grid.g3>.card>.bd>.paybar{flex:none}
</style>
<!-- 离线单文件版：数据快照已内联，双击即可打开 -->
</head>
<body>
<header><div class="wrap hd">
  <h1><span class="dot"></span>销售部系统<span class="tag">Aion 2 · MMOEXP</span></h1>
  <span class="sp"></span>
  <span id="meta" class="meta"></span>
  <button id="btnClear" title="重置所有筛选条件">清空筛选</button>
  <span id="autoHint" class="meta"></span>
  <button id="btnRefresh" title="从历史库读取，并同步新增及变更订单；仅缺失大区按订单号补查">↻ 立即刷新</button>
  <button id="btnExport" class="primary">导出当前筛选</button>
</div></header>

<div class="wrap">
  <div id="err"></div>

  <div class="filters">
    <div class="f"><label>开始日期</label><input type="date" id="d1"></div>
    <div class="f"><label>结束日期</label><input type="date" id="d2"></div>
    <div class="f"><label>快捷区间</label>
      <div class="seg" id="qk"><span data-d="1">今日</span><span data-d="7" class="on">近7天</span><span data-d="30">近30天</span><span data-d="0">全部</span></div>
    </div>
    <div class="f"><label>订单状态</label>
      <select id="fSt">
        <option value="valid">仅有效单（排除退款）</option>
        <option value="all">全部订单（含退款）</option>
        <option value="refund">只看退款单</option>
      </select></div>
    <div class="f"><label>关键字（单号 / 区服 / 折扣码）</label><input type="text" id="fKw" placeholder="如 D26101514 / Asmodian"></div>
    <div class="f span3"><label>推广人 <span class="hint" id="hProm"></span></label><div id="msProm"></div></div>
    <div class="f span3"><label>折扣码 <span class="hint" id="hCode"></span></label><div id="msCode"></div></div>
  </div>

// 每个归属键名下的折扣码（当前结果集里出现过的）
function codesByKey(rows){
  const m={};
  rows.forEach(r=>{ if(!r.code) return; const k=dimKey(r); (m[k]=m[k]||new Set()).add(r.code); });
  return m;
}
// 显示名：uid 能查到姓名 → 姓名；只有码 → 用码当推广人；都没有 → 自然流量
function nameOfKey(k, codeMap, r){
  if(!k || k==='none') return '自然流量';
  if(k.indexOf('name:')===0) return k.slice(5);   // 没有 uid、只能按姓名归并的人
  const cs0 = codeMap && codeMap[k] ? [...codeMap[k]] : (r && r.code ? [r.code] : []);
  const mu = /^uid:(\d+)$/.exec(k);
  if(mu){
    const v = UID2PROM[+mu[1]];
    if(v) return v.name;
    // 档案里没有这个人：有折扣码就显示折扣码，别拿裸 UID 当人名
    return cs0.length ? cs0.sort()[0] : mu[1];
  }
  const cs = cs0;
  if(cs.length){
    // 码在分销目录里挂了人名（YOLLY → 尹岚）就用人名，否则用码本身
    for(const c of cs.slice().sort()){ const p=codeOfProm(c); if(p && p.name) return p.name; }
    return cs.sort()[0];
  }
  if(r && r.promoter) return String(r.promoter).replace(/^折扣码\s*/,'');
  return k.replace(/^(code|admp):/,'');
}
const dimName = r => nameOfKey(dimKey(r), null, r);

function makeMS(root,opt){
  const st={q:'',open:false,sel:new Set()};
  root.classList.add('ms');
  root.innerHTML=`<div class="ms-box">
      <div class="ms-trigger"><span class="tx"></span><span class="caret">▾</span></div>
      <div class="ms-panel">
        <div class="ms-search"><input type="text" placeholder="输入关键字搜索…"></div>
        <div class="ms-acts"><a data-a="all">全选</a><a data-a="inv">反选</a><a data-a="none">清空</a><span class="cnt"></span></div>
        <div class="ms-list"></div>
      </div>
    </div>
    <div class="ms-chips"></div>`;
  const trig=root.querySelector('.ms-trigger'), inp=root.querySelector('.ms-search input');
  const list=root.querySelector('.ms-list'), cnt=root.querySelector('.ms-acts .cnt');
  const chips=root.querySelector('.ms-chips'), tx=root.querySelector('.ms-trigger .tx');

  const vis=()=>{const q=st.q.trim().toLowerCase(); const its=opt.items();
    return q? its.filter(x=>((x.label||'')+' '+(x.tag||'')+' '+(x.kw||'')).toLowerCase().includes(q)) : its;};

  function drawList(){
    const its=vis(), sc=list.scrollTop;   // 保留滚动位置，避免点一项就跳回顶部
    list.innerHTML = its.length? its.map(x=>`<label class="ms-row" data-v="${esc(x.v)}">
      <input type="checkbox" ${st.sel.has(x.v)?'checked':''}>
      <span class="nm" title="${esc(x.label)}">${esc(x.label)}</span>
      ${x.tag?`<span class="tg">${esc(x.tag)}</span>`:''}
      <span class="sub">${esc(x.sub||'')}</span></label>`).join('')
      : '<div class="ms-empty">没有匹配项</div>';
    list.scrollTop = sc;
  }
  function drawState(){
    const all=opt.items(), n=st.sel.size, picked=all.filter(x=>st.sel.has(x.v));
    tx.textContent = n===0? opt.allLabel() : (n===1? picked[0].label : '已选 '+n+' 项');
    tx.classList.toggle('ph', n===0);
    cnt.textContent = n? '已选 '+n+' / 共 '+all.length : '共 '+all.length+' 项';
    chips.innerHTML = picked.slice(0,8).map(x=>
        `<span class="chip"><span>${esc(x.label)}</span><i data-x="${esc(x.v)}">✕</i></span>`).join('')
      + (picked.length>8? `<span class="chip more">+${picked.length-8}</span>` : '');
    chips.style.display = (n && !st.open)? 'flex':'none';   // 面板打开时用勾选列表，避免面板压住 chips
  }
  const fire=()=>opt.onChange(new Set(st.sel));

  trig.onclick=()=>{
    const willOpen=!st.open; closeMS(root); st.open=willOpen;
    root.classList.toggle('on',st.open);
    if(st.open){ inp.value=''; st.q=''; drawList(); setTimeout(()=>inp.focus(),0); }
    drawState();
  };
  inp.oninput=()=>{ st.q=inp.value; drawList(); };
  inp.onclick=e=>e.stopPropagation();
  // 用 change 事件：label 包着 input 时浏览器会对 input 再派发一次 click，
  // 用 click 会把「勾选」和「取消」各算一次而互相抵消；change 只在实际状态变化时触发一次。
  list.onchange=e=>{
    const cb=e.target; if(!cb||cb.tagName!=='INPUT') return;
    const row=cb.closest('.ms-row'); if(!row) return;
    const v=row.dataset.v;
    if(cb.checked) st.sel.add(v); else st.sel.delete(v);
    drawState(); fire();
  };
  root.querySelector('.ms-acts').onclick=e=>{
    const a=e.target.dataset.a; if(!a) return;
    const vs=vis().map(x=>x.v);
    if(a==='all') vs.forEach(v=>st.sel.add(v));
    else if(a==='none') st.sel.clear();
    else vs.forEach(v=>{ if(st.sel.has(v)) st.sel.delete(v); else st.sel.add(v); });
    drawList(); drawState(); fire();
  };
  chips.onclick=e=>{
    const v=e.target.dataset.x; if(v===undefined) return;
    st.sel.delete(v); drawList(); drawState(); fire();
  };
  // 面板开着时不重绘列表（避免把用户正在点的节点换掉、以及滚动位置跳动），只刷新计数
  const api={st, refresh:()=>{ if(!st.open) drawList(); drawState(); }};
  root.__ms=api;          // 供面板互斥 / Esc 关闭使用
  return api;
}

// 只按 日期 + 状态 过滤：下拉里的「N 单」计数用这个基数
function baseRows(){
  const d1=$('#d1').value, d2=$('#d2').value, st=$('#fSt').value;
  return RAW.orders.filter(r=>{
    if(d1 && r.day<d1) return false;
    if(d2 && r.day>d2) return false;
    if(st==='valid' && r.refund) return false;
    if(st==='refund' && !r.refund) return false;
    return true;
  });
}

function buildFilters(){
  const rows=baseRows(), cm=codesByKey(rows);
  const pn={}, cn={};
  rows.forEach(r=>{ const k=dimKey(r); pn[k]=(pn[k]||0)+1; if(r.code) cn[r.code]=(cn[r.code]||0)+1; });

  const pmeta={}; (RAW.promoters||[]).forEach(p=>pmeta[p.key]=p);
  P_ITEMS = rows.reduce((acc,r)=>{ const k=dimKey(r); if(!acc.seen.has(k)){acc.seen.add(k);acc.list.push(k);} return acc; },{seen:new Set(),list:[]}).list
    .map(k=>({v:k, label:nameOfKey(k,cm), sub:fmtN(pn[k]||0)+' 单',
              tag:[...(cm[k]||[])].sort().join(' '),
              kw:(k==='none'?'自然流量 无归属':'')}))
    .sort((a,b)=>(pn[b.v]||0)-(pn[a.v]||0) || String(a.label).localeCompare(String(b.label),'zh'));
  const noneI=P_ITEMS.findIndex(x=>x.v==='none');
  if(noneI>=0) P_ITEMS.push(P_ITEMS.splice(noneI,1)[0]);   // 「自然流量」永远排最后

  const cmap={}; (RAW.codes||[]).forEach(c=>cmap[c.code]=c);
  const codeKeys=[...new Set([...(RAW.codes||[]).map(c=>c.code), ...Object.keys(cn)])];
  C_ITEMS = codeKeys.map(c=>{ const p=codeOfProm(c); return {v:c, label:c, sub:fmtN(cn[c]||0)+' 单',
            tag:(cmap[c]||{}).admin||'', kw:(p?p.name:'')+' '+((cmap[c]||{}).owner||'')}; })
    .sort((a,b)=>(cn[b.v]||0)-(cn[a.v]||0) || a.label.localeCompare(b.label));

  if(!MS_PROM) MS_PROM = makeMS($('#msProm'), {allLabel:()=>'全部'+DIM_LABEL(),
    items:()=>P_ITEMS, onChange:s=>{ SEL.prom=s; apply(); }});
  if(!MS_CODE) MS_CODE = makeMS($('#msCode'), {allLabel:()=>'全部折扣码',
    items:()=>C_ITEMS, onChange:s=>{ SEL.code=s; apply(); }});
  MS_PROM.refresh(); MS_CODE.refresh();

  const usedP = P_ITEMS.filter(x=>pn[x.v]).length, usedC = C_ITEMS.filter(x=>cn[x.v]).length;
  $('#hProm').textContent = P_ITEMS.length+' 个「'+DIM_LABEL()+'」，其中 '+usedP+' 个本期有单';
  $('#hCode').textContent = C_ITEMS.length+' 个折扣码，其中 '+usedC+' 个本期被使用';
}

function codeOfProm(code){ return PROMOTER_DIR[String(code||'').toUpperCase()] || null; }

// ---------------------------------------------------------------- 筛选
function apply(){
  const d1=$('#d1').value, d2=$('#d2').value, kw=$('#fKw').value.trim().toLowerCase();
  const st=$('#fSt').value, prom=SEL.prom, code=SEL.code;
  let rows = RAW.orders.filter(r=>{
    if(d1 && r.day < d1) return false;
    if(d2 && r.day > d2) return false;
    if(drillProm && dimKey(r)!==drillProm) return false;
    if(prom.size && !prom.has(dimKey(r))) return false;
    if(code.size && !code.has(r.code)) return false;
    if(st==='valid' && r.refund) return false;
    if(st==='refund' && !r.refund) return false;
    if(kw){
      const hay=(r.order_no+' '+(r.area||'')+' '+(r.promoter||'')+' '+dimName(r)+' '+r.code+' '+(r.product||'')+' '+r.status).toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
  FILTERED = rows;
  page = 1;
  $('#ttlRank').textContent = DIM_LABEL();
  buildFilters();
  renderKPI(rows); renderTrend(rows); renderArea(rows); renderGeo(rows);
  renderPromTable(rows); renderCodeTable(rows); renderOrders(rows);
  updateAutoHint();
}

// ---------------------------------------------------------------- KPI
function renderKPI(rows){
  const sale=sum(rows,'sale_cny'), cost=sum(rows,'cost_cny'), usd=sum(rows,'amount_usd');
  const withD=rows.filter(r=>r.sale_cny>0);
  const mg = sale>0 ? (sale-cost)/sale : null;
  const refund = rows.filter(r=>r.refund).length;
  const coded = rows.filter(r=>r.code).length;
  const n=rows.length;
  const promCount = new Set(rows.map(dimKey).filter(k=>k&&k!=='none')).size;
  const K=[
    ['k1','订单数', fmtN(n), (refund?('退款 '+refund+' 单'):'无退款')+' · 有发货明细 '+withD.length+' 单'],
    ['k2','销售额(USD)', fmtM(usd,2), '订单实付合计'],
    ['k3','销售额(￥)', fmtY(sale,0), '发货记录销售价合计'],
    ['k4','采购成本(￥)', fmtY(cost,0), '发货记录采购总价合计'],
    ['k5','毛利(￥)', fmtY(sale-cost,0), '销售价 − 采购总价'],
    ['k6','综合利润率', mg==null?'—':pc(mg), '先汇总再相除（加权利润率）'],
    ['k7','客单价(USD)', n?fmtM(usd/n,2):'—', '平均每单实付'],
    ['k8','用码占比 / '+DIM_LABEL(), n?(coded/n*100).toFixed(0)+'% · '+promCount:'—', '带了折扣码的订单比例'],
  ];
  $('#kpis').innerHTML = K.map(([c,l,v,s])=>`<div class="kpi ${c}"><div class="lb">${l}</div><div class="vl">${v}</div><div class="sb">${s}</div></div>`).join('');
}

function dayAgg(rows){
  const m=new Map();
  rows.forEach(r=>{ if(!r.day) return;
    const a=m.get(r.day)||{day:r.day,n:0,usd:0,sale:0,cost:0};
    a.n++; a.usd+=r.amount_usd; a.sale+=r.sale_cny; a.cost+=r.cost_cny; m.set(r.day,a); });
  return [...m.values()].sort((a,b)=>a.day.localeCompare(b.day))
    .map(x=>{ x.margin = x.sale>0 ? (x.sale-x.cost)/x.sale : null; return x; });
}

// 每日：柱=销售额(USD)，折线=利润率(%)；柱顶直接写「$销售 / 利润率」
function renderTrend(rows){
  const d=dayAgg(rows), el=$('#cTrend');
  const last = d.length? d[d.length-1] : null;
  const box = $('#trendKpi');
  if(box){
    box.innerHTML = last ? `
      <div class="tk"><span>当日（${last.day}）销售额</span><b>${fmtM(last.usd,2)}</b><i>${fmtY(last.sale,0)}</i></div>
      <div class="tk"><span>当日利润率</span><b class="${last.margin>=0.25?'pos':last.margin>=0.1?'':'neg'}">${pc(last.margin)}</b><i>毛利 ${fmtY(last.sale-last.cost,0)}</i></div>
      <div class="tk"><span>当日订单</span><b>${fmtN(last.n)}</b><i>客单价 ${fmtM(last.n?last.usd/last.n:0,2)}</i></div>`
      : '<div class="tk"><span>区间内无数据</span></div>';
  }
  if(!d.length){ el.innerHTML='<div class="empty">区间内无数据</div>'; return; }

  const W=Math.max(el.clientWidth||900,600), H=356, PL=64, PR=60, PT=36, PB=74;
  const iw=W-PL-PR, ih=H-PT-PB;
  const maxU=Math.max(...d.map(x=>x.usd),1);
  const maxM=Math.max(0.3, Math.min(1, Math.ceil(Math.max(...d.map(x=>x.margin||0))*10)/10));
  const step=iw/d.length, bw=Math.min(Math.max(step*0.52,3),52);
  const X=i=>PL+step*i+step/2;
  const YU=v=>PT+ih-(v/maxU)*ih;
  const YM=v=>PT+ih-((Math.max(0,v))/maxM)*ih;
  const pts=d.map((x,i)=>[X(i), YM(x.margin||0)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  // 每个日期都标：宽的时候平放，窄的时候斜着放，绝不跳着省
  const rot = step<52 ? -45 : 0;
  const maxUsd=Math.max(...d.map(x=>x.usd),1);
  const showAllVal = step>=36;      // 位置够就每根柱子都标销售额
  const mStep = step>=64 ? 1 : step>=44 ? 2 : 3;   // 利润率数字：越密标得越稀，避免糊成一片
  const axU = v => v>=1000 ? '$'+String(+(v/1000).toFixed(1))+'k' : '$'+Math.round(v);

  // 利润率数字（白描边，压到柱子上面也看得清）
  const mLbl = pts.map((p,i)=>{
    const m=d[i].margin; if(m==null || i%mStep) return '';
    const byT=YU(d[i].usd);
    let y = p[1]<PT+24 ? p[1]+19 : p[1]-11;        // 点贴到顶上时，数字落到点下面
    if(Math.abs(y-(byT-9))<17) y = byT+26;         // 与柱顶销售额撞上，再往下让
    const txt=(m*100).toFixed(1)+'%', w=txt.length*6.4+7;
    return `<rect x="${(p[0]-w/2).toFixed(1)}" y="${(y-9.6).toFixed(1)}" width="${w.toFixed(1)}" height="13.6" rx="6.8"
        fill="#ffffff" fill-opacity=".94" stroke="#cfe6ea" stroke-width=".8" pointer-events="none"/>
      <text x="${p[0].toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="650"
      fill="#0a7f8f" pointer-events="none">${txt}</text>`;
  }).join('');

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="height:${H}px">
    ${[0,1,2,3,4].map(i=>{const y=PT+ih*i/4;return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ededf0" stroke-width="1"/>
      <text x="${PL-10}" y="${y+4}" fill="#8e8e93" font-size="11" text-anchor="end">${axU(maxU*(1-i/4))}</text>
      <text x="${W-PR+10}" y="${y+4}" fill="#0a7f8f" font-size="11">${((maxM*(1-i/4))*100).toFixed(0)}%</text>`}).join('')}
    ${d.map((x,i)=>{const h=Math.max((x.usd/maxU)*ih, x.usd>0?1.5:0), bx=PL+step*i+(step-bw)/2, by=YU(x.usd);
      const drawV = showAllVal || x.usd>=maxUsd*0.5;
      const lbl = drawV? `<text x="${X(i)}" y="${(by-9).toFixed(1)}" fill="#1d1d1f"
        font-size="12" font-weight="650" text-anchor="middle">${x.usd>=1000?('$'+(x.usd/1000).toFixed(1)+'k'):('$'+x.usd.toFixed(0))}</text>`:'';
      return `<rect x="${bx}" y="${by}" width="${bw}" height="${h}" rx="3" fill="#0071e3"
        onmousemove="tip('${x.day}\\n销售额 $${x.usd.toFixed(2)}（￥${x.sale.toFixed(0)}）\\n成本 ￥${x.cost.toFixed(0)} · 毛利 ￥${(x.sale-x.cost).toFixed(0)}\\n利润率 ${x.margin==null?'—':(x.margin*100).toFixed(1)+'%'} · 订单 ${x.n} 单',event.clientX,event.clientY)"
        onmouseleave="untip()"/>${lbl}`}).join('')}
    <path d="${line}" fill="none" stroke="#0a7f8f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${d.length>45?1.8:3.4}" fill="#fff" stroke="#0a7f8f" stroke-width="2"
        onmousemove="tip('${d[i].day}\\n利润率 ${d[i].margin==null?'—':(d[i].margin*100).toFixed(1)+'%'}',event.clientX,event.clientY)" onmouseleave="untip()"/>`).join('')}
    ${mLbl}
    ${d.map((x,i)=>rot
      ? `<text x="${X(i)}" y="${H-16}" transform="rotate(${rot} ${X(i)} ${H-16})" fill="#6e6e73" font-size="11" text-anchor="end">${x.day.slice(5)}</text>`
      : `<text x="${X(i)}" y="${H-22}" fill="#6e6e73" font-size="11.5" text-anchor="middle">${x.day.slice(5)}</text>`).join('')}
  </svg>
  <div class="legend"><span><i style="background:#0071e3"></i>当日销售额（USD，柱）</span>
    <span><i style="background:#0a7f8f"></i>当日利润率（折线，右轴）</span></div>`;
}

function hbar(el, items, color, unit, rowH){
  if(!items.length){ el.innerHTML='<div class="empty">无数据</div>'; return; }
  rowH = Math.max(24, rowH || 28);
  const W=Math.max(el.clientWidth||520,420), H=items.length*rowH+10, LW=132, VW=W-LW-104;
  const max=Math.max(...items.map(x=>x.v),1);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="height:${H}px">
   ${items.map((x,i)=>{const y=i*rowH+(rowH-14)/2, w=Math.max(x.v/max*VW,2);
     return `<text x="${LW-8}" y="${(y+11).toFixed(1)}" fill="#6e6e73" font-size="11" text-anchor="end">${esc(String(x.k).slice(0,14))}</text>
     <rect x="${LW}" y="${y.toFixed(1)}" width="${VW}" height="14" rx="4" fill="#f2f2f5"/>
     <rect x="${LW}" y="${y.toFixed(1)}" width="${w}" height="14" rx="4" fill="${x.color||color}"
       onmousemove="tip('${esc(x.k)}\\n${x.tip||unit+x.v.toFixed(0)}',event.clientX,event.clientY)" onmouseleave="untip()"/>
     <text x="${LW+Math.max(w,2)+8}" y="${(y+11.5).toFixed(1)}" fill="#1d1d1f" font-size="11">${x.lab||fmtN(x.v)}</text>`}).join('')}
  </svg>`;
}

// 通用环形图（区服分布 / 支付方式共用）
function donut(host, items, centerLabel, hz, big, centerVal){
  if(!host) return;
  const tot = items.reduce((s,x)=>s+Math.max(x.v,0),0);
  if(!items.length || tot<=0){ host.innerHTML='<div class="empty">无数据</div>'; return; }
  const R=62, SW=24, C=2*Math.PI*R;
  let off=0;
  const arcs=items.map(x=>{
    const len=Math.max(x.v,0)/tot*C, d=Math.max(len-0.8,0);
    const a=`<circle r="${R}" cx="88" cy="88" fill="none" stroke="${x.color}" stroke-width="${SW}"
      stroke-dasharray="${d.toFixed(2)} ${(C-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 88 88)" data-tip="${esc(x.label+'\n'+pc(x.v/tot,1)+' · '+(x.lab||fmtY(x.v,0)))}"/>`;
    off+=len; return a;
  }).join('');
  host.innerHTML=`<div class="donutwrap${hz?' hz':''}${big?' big':''}">
    <svg viewBox="0 0 176 176" class="donut">${arcs}
      <text x="88" y="84" text-anchor="middle" font-size="10" fill="#8e8e93">${esc(centerLabel||'合计')}</text>
      <text x="88" y="103" text-anchor="middle" font-size="15" font-weight="650" fill="#1d1d1f">${esc(centerVal||fmtY(tot,0))}</text>
    </svg>
    <div class="dlegend">${items.map(x=>`<div class="dl-row"><i style="background:${x.color}"></i>
      <span class="dl-n">${esc(x.label)}</span><b>${pc(x.v/tot,1)}</b><span class="mut">${esc(x.lab||fmtY(x.v,0))}</span></div>`).join('')}</div>
  </div>`;
}

// 区服分布：大区做成卡片，点谁看谁的小区；右侧环形图
let rgnTab = null;
function renderArea(rows){
  const byR={};
  rows.forEach(r=>{
    const reg=regionOf(r.area), srv=serverOf(r.area);
    const R=byR[reg]=byR[reg]||{sale:0,n:0,srv:{}};
    const S=R.srv[srv]=R.srv[srv]||{sale:0,n:0};
    R.sale+=r.sale_cny; R.n++; S.sale+=r.sale_cny; S.n++;
  });
  const all=[...new Set(rows.map(r=>regionOf(r.area)))].sort((a,b)=>rgnRank(a)-rgnRank(b));
  // 大区已经是卡片切换，原来的「大区筛选」下拉取消（两个入口重复）
  const list = all.filter(r=>byR[r]).map(r=>({k:r, sale:byR[r].sale, n:byR[r].n, srv:byR[r].srv}))
                  .sort((a,b)=>b.sale-a.sale);
  if(!list.length){
    $('#rgnTabs').innerHTML=''; $('#rgnDetail').innerHTML='<div class="empty">无数据</div>';
    return;
  }
  if(!rgnTab || !list.some(x=>x.k===rgnTab)) rgnTab = list[0].k;
  const totSale = list.reduce((s,x)=>s+x.sale,0) || 1;

  $('#rgnTabs').innerHTML = list.map((x,i)=>{
    const col=REGION_COLOR[x.k]||PALETTE[i%PALETTE.length];
    return `<button class="rtab${x.k===rgnTab?' on':''}" data-r="${esc(x.k)}" style="--c:${col}">
      <span class="rt-nm">${esc(x.k)}</span>
      <span class="rt-v">${x.sale>0?fmtY(x.sale,0):fmtN(x.n)+' 单'}</span>
      <span class="rt-m">${x.sale>0?(x.n+' 单 · '+pc(x.sale/totSale,1)):'暂无交付金额'}</span></button>`;
  }).join('');

  const cur=list.find(x=>x.k===rgnTab);
  const srv=Object.entries(cur.srv).map(([k,v])=>({k,v:v.sale,n:v.n})).sort((a,b)=>b.v-a.v);
  const mx=Math.max(...srv.map(x=>x.v),1);
  $('#rgnDetail').innerHTML =
    `<div class="rgnhd2"><b>${esc(cur.k)}</b><span class="mut">${srv.length} 个小区 · ${cur.n} 单</span></div>
     <div class="srvlist">${srv.map(x=>`<div class="rgnrow"><span class="nm" title="${esc(x.k)}">${esc(x.k)}</span>
       <div class="bar" style="flex:1"><i style="width:${Math.max(x.v/mx*100,1)}%"></i></div>
       <span class="vv">${x.v>0?fmtY(x.v,0)+' ':''}<span class="mut">${x.n}单</span></span></div>`).join('')}</div>`;


  $('#rgnTabs').onclick = e=>{
    const b=e.target.closest('[data-r]'); if(!b) return;
    rgnTab = b.dataset.r; renderArea(FILTERED);
  };
}

function rampC(t){
  const st=['#edf4fd','#d3e4fa','#aecdf4','#7fb2ec','#3f8ae2','#0071e3'];
  const i=Math.min(st.length-1, Math.max(0, Math.floor(Math.sqrt(Math.max(t,0))*(st.length-1)+0.0001)));
  return st[i];
}

function renderWorldMap(rows){
  const host=$('#cGeoMap'); if(!host) return;
  const m={};
  rows.forEach(r=>{
    let k=r.cc||''; if(!k) return;
    k = CCNORM[k] || k;
    const a=m[k]=m[k]||{k, name:'', sale:0, n:0};
    if(!a.name && r.country) a.name=String(r.country).replace(/\s*\+.*$/,'').trim();
    a.sale+=r.sale_cny; a.n++;
  });
  const items=Object.values(m).sort((a,b)=>b.sale-a.sale);
  if(!items.length){ host.innerHTML='<div class="empty">无数据</div>'; return; }
  const tot=items.reduce((s,x)=>s+x.sale,0)||1, max=items[0].sale||1;
  const byCode={}; items.forEach(x=>{ byCode[x.k]=x; });
  const nm=x=>CCN[x.k]||x.name||x.k;
  let land='', hi='';
  for(const c in WORLD.paths){
    const d=WORLD.paths[c], x=byCode[c];
    if(x) hi+=`<path d="${d}" fill="${rampC(x.sale/max)}" stroke="#fff" stroke-width=".7"
      data-tip="${esc(nm(x)+'\n销售额 '+fmtY(x.sale,0)+' · '+x.n+' 单\n占比 '+pc(x.sale/tot,1))}"/>`;
    else land+=d;
  }
  const maxN=Math.max(...items.map(x=>x.n),1);
  const bub=items.map(x=>{
    const ct=WORLD.cent[x.k]; if(!ct) return '';
    const r=+(3.2+11*Math.sqrt(x.n/maxN)).toFixed(1), inside=r>=9;
    const t=esc(nm(x)+'\n销售额 '+fmtY(x.sale,0)+' · '+x.n+' 单\n占比 '+pc(x.sale/tot,1));
    return `<g><circle cx="${ct[0]}" cy="${ct[1]}" r="${r}" fill="rgba(0,113,227,.60)" stroke="#fff" stroke-width="1.4" data-tip="${t}"/>
      ${inside
        ? `<text x="${ct[0]}" y="${(+ct[1]+3.2).toFixed(1)}" text-anchor="middle" font-size="8.4" font-weight="600" fill="#fff" pointer-events="none">${x.k}</text>`
        : `<text x="${(+ct[0]+r+3).toFixed(1)}" y="${(+ct[1]+3).toFixed(1)}" font-size="8" fill="#3a3a3f" pointer-events="none">${x.k}</text>`}</g>`;
  }).join('');
  const top=items.slice(0,5);
  host.innerHTML=`<div class="wmapbox"><svg viewBox="0 0 ${WORLD.w} ${WORLD.h}" class="wmap">
      <path d="${land}" fill="#e8eaef" stroke="#f7f8fa" stroke-width=".6"/>${hi}${bub}</svg></div>
    <div class="wtop">${top.map((x,i)=>`<div class="wt-row"><span class="wt-rk">${i+1}</span>
      <span class="wt-nm" title="${esc(nm(x))}">${esc(nm(x))}</span>
      <div class="bar" style="flex:1"><i style="width:${Math.max(x.sale/max*100,1)}%"></i></div>
      <span class="wt-v">${fmtY(x.sale,0)}</span><span class="wt-p mut">${pc(x.sale/tot,1)}</span></div>`).join('')}</div>`;
}

function renderGeo(rows){
  renderWorldMap(rows);
  const a=aggBy(rows,'paytype');
  const items=Object.values(a).filter(x=>x.k).sort((x,y)=>y.sale-x.sale);
  let arr=items.slice(0,6);
  const rest=items.slice(6);
  if(rest.length) arr=arr.concat([{k:'__other', sale:rest.reduce((s,x)=>s+x.sale,0), n:rest.reduce((s,x)=>s+x.n,0)}]);
  const pay = arr.map((x,i)=>({label: x.k==='__other'?'其他':(PAYN[x.k]||x.k),
    v:x.sale, n:x.n, color:PALETTE[i%PALETTE.length]}));
  donut($('#cPayPie'), pay, '支付额', true);
  // 饼图下面保留横向柱状：一眼看排行，卡片也不至于空半截
  const totPay = pay.reduce((t,x)=>t+x.v,0) || 1;
  const bars = pay.map(x=>({k:x.label, v:x.v, color:x.color,
    lab: pc(x.v/totPay,1), tip: fmtY(x.v,0)+' · '+x.n+' 单'}));
  const paintBar = rh => hbar($('#cPayBar'), bars, '#0071e3', '', rh);
  paintBar(28);
  // 与国家地图卡等高：把卡片底部剩余高度摊到每行（行高上限 46，避免过散）
  requestAnimationFrame(()=>{
    const el=$('#cPayBar'); if(!el || !el.parentElement) return;
    const bd=el.parentElement, kids=[...bd.children];
    if(!kids.length) return;
    const padB=parseFloat(getComputedStyle(bd).paddingBottom)||0;
    const left=bd.getBoundingClientRect().bottom - padB - kids[kids.length-1].getBoundingClientRect().bottom;
    if(left>10) paintBar(Math.min(46, 28 + left/bars.length));
  });
}

function aggBy(rows,key){
  const m={};
  rows.forEach(r=>{
    const k = key==='area'? (r.area||'') : (r[key]||'');
    const a=m[k]=m[k]||{k,n:0,sale:0,cost:0,usd:0}; a.n++; a.sale+=r.sale_cny; a.cost+=r.cost_cny; a.usd+=r.amount_usd;
  });
  Object.values(m).forEach(a=>{a.profit=a.sale-a.cost; a.margin=a.sale>0?a.profit/a.sale:null});
  return m;
}

// ---------------------------------------------------------------- 表头列下拉（多选）
function colDrop(btn, opts){
  document.querySelectorAll('.dd').forEach(d=>d.remove());
  const items = opts.items();
  if(!items.length){ toast('这一列没有可筛选项'); return; }
  const sel = opts.sel;
  const dd = document.createElement('div');
  dd.className='dd';
  dd.innerHTML = `<div class="dd-hd">${esc(opts.title)}<span class="mut">${items.length}</span></div>
    <div class="dd-acts"><a data-a="all">全选</a><a data-a="none">清空</a></div>
    <div class="dd-list">${items.map(x=>`<label class="dd-row"><input type="checkbox" value="${esc(x.v)}" ${sel.has(x.v)?'checked':''}><span>${esc(x.label)}</span>${x.sub?`<i>${esc(x.sub)}</i>`:''}</label>`).join('')}</div>`;
  document.body.appendChild(dd);
  const r = btn.getBoundingClientRect();
  dd.style.left = Math.min(r.left, innerWidth-250)+'px';
  dd.style.top = (r.bottom+4)+'px';
  dd.addEventListener('change', e=>{
    const cb=e.target; if(cb.tagName!=='INPUT') return;
    if(cb.checked) sel.add(cb.value); else sel.delete(cb.value);
    opts.onChange();
  });
  dd.querySelector('.dd-acts').onclick = e=>{
    const a=e.target.dataset.a; if(!a) return;
    if(a==='all') items.forEach(x=>sel.add(x.v)); else sel.clear();
    dd.querySelectorAll('input').forEach(i=>i.checked = sel.has(i.value));
    opts.onChange();
  };
  const close = ev=>{ if(!dd.contains(ev.target) && ev.target!==btn){ dd.remove(); document.removeEventListener('click', close); } };
  setTimeout(()=>document.addEventListener('click', close), 0);
}

// 表头：可排序 + 可下拉筛选
function thSort(k,label,cls){return `<th class="${cls||''}" data-k="${k}">${label}${sortProm.k===k?' '+(sortProm.a?'▲':'▼'):''}</th>`}
const ddBtn = (id,label,active)=>`<button class="thdd${active?' on':''}" data-dd="${id}" title="按${label}筛选">${label} ▾</button>`;

function renderPromTable(rows){
  const t=$('#tProm'), cm=codesByKey(rows);
  const agg={};
  rows.forEach(r=>{ const k=dimKey(r);
    const a=agg[k]=agg[k]||{key:k,n:0,sale:0,cost:0,usd:0,refund:0,newc:0,disc:0};
    a.n++; a.sale+=r.sale_cny; a.cost+=r.cost_cny; a.usd+=r.amount_usd; a.refund+=r.refund?1:0; a.newc+=r.is_new?1:0; a.disc+=r.discount_usd;
  });
  Object.values(agg).forEach(a=>{a.profit=a.sale-a.cost; a.margin=a.sale>0?a.profit/a.sale:null; a.aov=a.n?a.usd/a.n:0; a.name=nameOfKey(a.key,cm);});
  // 「自然流量」保留：钉在第一名位次，但不参与排序、也不占名次徽章
  const PINNED='none';
  const all=Object.values(agg).filter(a=>a.n>0);
  // 前五名次按毛利排（与当前排序无关，切排序不会乱；自然流量不参与）
  const rankOf={};
  [...all].filter(x=>x.key!==PINNED).sort((x,y)=>y.profit-x.profit)
    .slice(0,5).forEach((x,i)=>{ rankOf[x.key]=i+1; });

  // 表头下拉：只按「推广人」筛（归属方式这列已经不存在）
  const list = (CF.prom.size? all.filter(x=>CF.prom.has(x.key)) : all).slice();
  const k=sortProm.k, dir=sortProm.a?1:-1;
  const pinned=list.filter(x=>x.key===PINNED);
  const rest=list.filter(x=>x.key!==PINNED);
  rest.sort((x,y)=>{let p=x[k],q=y[k]; if(k==='name')return dir*String(p).localeCompare(String(q),'zh'); return dir*((p??-1e18)-(q??-1e18))});
  list.length=0; list.push(...pinned, ...rest);

function stamp(){
  const m = RAW.meta || {};
  DATA_GEN = m.generated_at || m.fetched_at || '';
  const rg = m.date_range || ['',''];
  const ok = DATA_SRC==='server';
  const mt = $('#meta');
  mt.textContent = '数据 '+rg[0]+' ~ '+rg[1]+' · 更新于 '+DATA_GEN+' · '+(ok?'线上同步':'⚠ 内置快照（非线上数据，可能已过期）');
  mt.style.color = ok ? '' : '#b3261e';
  const fm=$('#footMeta');
  if(fm) fm.textContent = '订单 '+((m.counts||{}).orders||0)+' 条 · 生成于 '+DATA_GEN;

let AUTO_TIMER = null, LOADING = false;

// 取 dashboard.json。不再"失败就返回 null"——必须区分「网络失败 / 会话过期 / 数据坏了」，
// 否则会话过期时会被静默降级成内联的旧快照，用户以为刷新成功其实看到的是几天前的数据。
async function fetchRemote(){
  let r;
  try{ r = await fetch(DATA_URL+'?t='+Date.now(), {cache:'no-store'}); }
  catch(e){ return {ok:false, reason:'网络不通'}; }
  if(r.status===401 || r.status===403) return {ok:false, reason:'登录已过期'};
  if(r.redirected && /__auth|access/.test(r.url||'')) return {ok:false, reason:'登录已过期'};
  if(!r.ok) return {ok:false, reason:'HTTP '+r.status};
  let j;
  try{ j = await r.json(); }
  catch(e){ return {ok:false, reason:'数据不是合法 JSON（可能被登录页顶替）'}; }
  if(!j || !Array.isArray(j.orders)) return {ok:false, reason:'数据格式不对（缺少 orders）'};
  return {ok:true, data:j};
}

async function load(manual){
  if(LOADING) return;
  LOADING = true;
  if(manual){ $('#btnRefresh').textContent = '↻ 刷新中…'; $('#btnRefresh').disabled = true; }
  const keep = {d1:$('#d1').value, d2:$('#d2').value, st:$('#fSt').value,
                prom:new Set(SEL.prom), code:new Set(SEL.code), gen:DATA_GEN};
  const res = await fetchRemote();
  let data = res.ok ? res.data : null, src = res.ok ? 'server' : '';
  if(!data && RAW && Array.isArray(RAW.orders) && RAW.orders.length){
    // 已经有数据在页面上：保留它，别退回到内置旧快照，只明确告诉用户取数失败
    LOADING = false;
    if(manual){ $('#btnRefresh').textContent = '↻ 立即刷新'; $('#btnRefresh').disabled = false; }
    toast('取数失败：'+res.reason+'，当前显示的是上次加载的数据（'+((RAW.meta||{}).generated_at||'—')+'）', 'warn');
    return;
  }
  if(!data){ data = (typeof INLINE_DATA!=='undefined' && INLINE_DATA) ? INLINE_DATA : null; src='inline'; }
  LOADING = false;
  if(manual){ $('#btnRefresh').textContent = '↻ 立即刷新'; $('#btnRefresh').disabled = false; }
  if(!data){ $('#err').innerHTML = '<div class="err">数据载入失败：没有可用的数据文件。</div>'; return; }

  const before = keep.gen;
  RAW = data; DATA_SRC = src;
  $('#err').innerHTML = '';
  stamp();
  const rg = RAW.meta.date_range || ['',''];
  if(keep.d1 && keep.d2){ $('#d1').value = keep.d1; $('#d2').value = keep.d2; }
  else { $('#d2').value = rg[1]; $('#d1').value = shift(7); }   // 默认只看最近 7 天
  if(keep.st) $('#fSt').value = keep.st;
  buildFilters();
  const existP = new Set(P_ITEMS.map(x=>x.v)), existC = new Set(C_ITEMS.map(x=>x.v));
  SEL.prom = new Set([...keep.prom].filter(v=>existP.has(v)));
  SEL.code = new Set([...keep.code].filter(v=>existC.has(v)));
  if(MS_PROM){ MS_PROM.st.sel = new Set(SEL.prom); MS_PROM.refresh(); }
  if(MS_CODE){ MS_CODE.st.sel = new Set(SEL.code); MS_CODE.refresh(); }
  CF.prom = new Set([...CF.prom].filter(v=>existP.has(v)));
  CF.code = new Set([...CF.code].filter(v=>existC.has(v)));
  apply();
  if(manual){
    const changed = before && DATA_GEN && before !== DATA_GEN;
    toast(changed? ('已更新到 '+DATA_GEN) : ('服务器数据暂无变化（'+(DATA_GEN||'—')+'）'), changed?'ok':'');
  }
  if(AUTO_TIMER) clearInterval(AUTO_TIMER);
  AUTO_TIMER = setInterval(()=>{ if(!document.hidden) load(false); }, AUTO_MS);
  updateAutoHint();
}

  const blob=new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='AION2订单明细_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};

// ---------------------------------------------------------------- 立即刷新（真·触发服务器重新采集）
// 旧实现只重新拉一遍静态 data/dashboard.json，而那个文件 30 分钟才更新一次，
// 所以点按钮几乎永远是"暂无变化"；而且结尾调用的 toast() 根本没定义 → 抛 ReferenceError，
// 用户连提示都看不到，表现为"点了没反应"。
// 新实现：POST api/refresh 让服务器真跑一轮采集 → 轮询 api/status 显示进度 → 采完自动重新载入渲染。
// 接口不可用（老部署）时自动降级为只重拉数据。
const API_BASE = 'api/';
let REFRESHING = false;
let TOAST_T = null;

function toast(msg, kind){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.className = 'on' + (kind ? ' ' + kind : '');
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(()=>{ el.className = ''; }, kind === 'warn' ? 6000 : 3000);
}

async function apiCall(path, opt){
  const r = await fetch(API_BASE + path, Object.assign({cache:'no-store'}, opt || {}));
  if(r.status === 401 || r.status === 403){ const e = new Error('auth'); e.auth = true; throw e; }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

function btnIdle(){
  const b = $('#btnRefresh');
  b.textContent = '↻ 立即刷新'; b.disabled = false;
  b.title = '让服务器立刻重新抓取 P2PAH 两个后台（约 4 分钟；每 30 分钟也会自动同步）';
}

async function refreshNow(){
  if(REFRESHING) return;
  REFRESHING = true;
  const btn = $('#btnRefresh');
  btn.disabled = true; btn.textContent = '↻ 连接中…';

  try{
    const j = await apiCall('refresh', {method:'POST'});
    if(j.reason === 'already_running') toast('服务器正在采集，已接入当前进度…');
    else if(j.reason === 'cooldown') toast('刚刚已触发过，等待上一轮完成…');
    else if(j.started === false) toast('未能触发采集：' + (j.reason || '未知原因'), 'warn');
  }catch(e){
    REFRESHING = false; btnIdle();
    if(e.auth){ toast('登录已过期，请刷新页面重新登录后再试', 'warn'); return; }
    toast('刷新接口不可用（' + e.message + '），改为只重新载入现有数据', 'warn');
    await load(true);
    return;
  }

  const t0 = Date.now();
  const tick = ()=>{ btn.textContent = '↻ 采集中 ' + Math.round((Date.now()-t0)/1000) + 's'; };
  tick();
  const timer = setInterval(tick, 1000);
  const deadline = Date.now() + 9*60*1000;
  while(Date.now() < deadline){
    await new Promise(r=>setTimeout(r, 2500));
    let st = null;
    try{ st = await apiCall('status'); }
    catch(e){
      if(e.auth){ clearInterval(timer); REFRESHING = false; btnIdle();
        toast('登录已过期，请刷新页面重新登录后再试', 'warn'); return; }
    }
    if(!st) continue;
    const ph = [st.phase, st.detail].filter(Boolean).join(' · ');
    if(ph) btn.title = ph;
    if(st.running === false) break;
  }
  clearInterval(timer);
  REFRESHING = false; btnIdle();
  await load(true);
}

$('#btnRefresh').onclick = ()=>{ refreshNow(); };

load();

</script>
