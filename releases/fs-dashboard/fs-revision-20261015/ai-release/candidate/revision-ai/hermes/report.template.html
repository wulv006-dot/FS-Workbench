<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>@@TITLE@@</title>
<style>
:root{--ink:#182641;--accent:#235fe7;--light:#eaf0ff;--red:#b34534;--amber:#95671f;--muted:#64748b;--line:#dfe5ef;--paper:#ffffff;--bg:#f4f6fb;--blue:#426f98}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #d69f38;outline-offset:4px}.topbar{background:#182641;color:#f9f8ef;position:sticky;top:0;z-index:10}.bar-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;gap:15px}.brand{font-size:12px;letter-spacing:2px}.topbar nav{display:flex;gap:20px;align-items:center}.topbar a{color:#e6eee8;font-size:12px}.topbar button{border:1px solid #7f9790;border-radius:3px;color:#f9f8ef;background:transparent;padding:3px 13px;font-size:12px}.topbar .download{background:#e7f2ed;color:#182641;border-color:#e7f2ed}
main{max-width:1120px;margin:24px auto 50px;background:var(--paper);box-shadow:0 8px 35px #203a2b0a;padding:44px 54px 32px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:2px;font-weight:700}.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:23px}.issue{text-align:right;font-size:12px;color:var(--muted);min-width:190px}.issue strong{display:block;font-size:16px;color:var(--ink);font-weight:600}.mast h1{font-size:34px;line-height:1.25;font-weight:600;margin:10px 0 12px;letter-spacing:-1px}.meta{font-size:12px;color:var(--muted);margin:0}.headline{display:grid;grid-template-columns:2fr 1fr;gap:36px;padding:28px 0 24px}.headline h2{font-size:26px;line-height:1.5;margin:0 0 10px;font-weight:600}.headline p{margin:0;color:#475569;font-size:14px}.confidence{border-left:3px solid #c6d5ca;padding-left:18px;font-size:13px}.confidence p{margin:8px 0;font-size:13px}.tag{font-size:11px;padding:2px 6px;border-radius:2px;background:var(--light);color:var(--accent);font-weight:600}.tag.amber{background:#f4eedf;color:var(--amber)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;gap:18px}.metric{border-right:1px solid var(--line);padding-right:16px}.metric:last-child{border:none}.metric .label{font-size:12px;color:var(--muted)}.metric .value{display:block;font-size:29px;line-height:1.55;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}.metric small{display:block;font-size:11px;color:var(--muted)}.delta{font-size:12px;font-weight:600}.down{color:#147963}.up{color:var(--red)}.metric .value.missing{font-size:22px;color:var(--muted);letter-spacing:0}.targets{font-size:12px;color:var(--muted);margin:10px 0 0}.now{margin:23px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.now-item{display:flex;gap:12px}.now-num{font-size:25px;color:#8ba195;font-weight:300;line-height:1.25}.now-item h3{font-size:14px;margin:0 0 4px}.now-item p{font-size:12px;color:var(--muted);margin:0}.decision-strip{font-size:13px;background:var(--light);padding:13px 17px;margin-top:22px;display:flex;gap:13px}.decision-strip strong{white-space:nowrap}.section{padding:35px 0 32px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section-head{display:flex;align-items:baseline;gap:15px;margin-bottom:20px}.section-no{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px}.section-head h2{font-size:22px;font-weight:600;margin:0}.section-head .aside{margin-left:auto;font-size:11px;color:var(--muted)}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:34px}.equal{grid-template-columns:1fr 1fr}.chart{margin:0;min-width:0}.chart h3{font-size:15px;margin:0 0 3px}.chart .sub{font-size:11px;color:var(--muted);margin:0 0 12px}.chart svg{display:block;width:100%;height:auto;overflow:visible}svg text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}svg .axis{stroke:#dee6df;stroke-width:1}svg .strong{fill:var(--ink);font-weight:600}figcaption{font-size:12px;line-height:1.7;margin-top:12px;border-left:2px solid #bdd2c6;padding-left:11px}.source{display:block;font-size:10px;color:#748078;margin-top:6px}.source a{color:#748078;text-decoration:underline}.legend{font-size:11px;display:flex;gap:17px;color:var(--muted);margin:8px 0}.key{display:inline-block;width:17px;height:3px;vertical-align:middle;margin-right:5px;background:var(--accent)}.key.prev{background:#9eaba2}.key.blue{background:var(--blue)}.reading{font-size:14px;margin:18px 0 0;padding:13px 0 0;border-top:1px solid var(--line)}.reading strong{color:var(--red)}.chart-tabs{display:flex;gap:5px;margin:10px 0}.chart-tabs button{font-size:11px;color:var(--muted);border:1px solid var(--line);background:transparent;padding:3px 10px;border-radius:2px}.chart-tabs button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.chart-panel[hidden]{display:none}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}th{text-align:right;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:9px 10px;background:#f5f6ee}td{border-bottom:1px solid #e9ede7;text-align:right;padding:10px}td:first-child,th:first-child{text-align:left}tbody tr:last-child td{border:0}caption{text-align:left;font-size:12px;color:var(--muted);margin:5px 0}details{margin-top:12px}summary{cursor:pointer;font-size:11px;color:var(--muted)}.hypothesis{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:18px}.hypothesis h3{font-size:14px;margin:0 0 5px}.hypothesis p{font-size:12px;color:var(--muted);margin:0}.note{background:#f4f1e8;padding:13px 16px;font-size:12px;color:#6b604b;margin-top:17px}.compact{margin-top:22px}.signal{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.signal:last-child{border:0}.signal .when{font-size:11px;color:var(--muted)}.signal h3{font-size:15px;margin:0 0 5px}.signal p{font-size:13px;margin:4px 0;color:#475569}.signal .when strong{display:block;color:var(--ink);font-size:12px}.action{display:grid;grid-template-columns:43px 1fr 205px;gap:15px;padding:21px 0;border-top:1px solid var(--line)}.action:first-child{border:0}.priority{font-size:12px;font-weight:700;color:var(--red);padding-top:2px}.action h3{font-size:16px;margin:0 0 6px}.action p{font-size:13px;color:#475569;margin:4px 0}.action .owner{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:17px}.owner strong{display:block;color:var(--ink);font-size:13px}.action details{margin:5px 0}.action details p{font-size:12px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:22px}.timepoint{border-top:2px solid #cad9ce;padding:13px 15px 0 0;position:relative}.timepoint:before{content:"";position:absolute;top:-5px;left:0;width:8px;height:8px;background:var(--accent);border-radius:50%}.timepoint strong{display:block;font-size:12px}.timepoint span{font-size:11px;color:var(--muted)}.choice td{text-align:left;vertical-align:top}.choice th{text-align:left}.choice td:first-child{width:135px}.choice strong{color:var(--accent)}.gaps{font-size:12px;columns:2;column-gap:35px;margin:18px 0 0;padding-left:20px}.gaps li{break-inside:avoid;padding-bottom:8px;color:var(--muted)}.appendix{padding-top:25px}.appendix>details>summary{font-size:14px;color:var(--ink);font-weight:600;padding:12px 0}.evidence details{border-top:1px solid var(--line);margin:0;padding:7px 0}.evidence summary{font-size:11px;overflow-wrap:anywhere}.evidence pre{font:11px/1.5 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:450px;overflow:auto;background:#f1f3ed;padding:15px}.foot{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:17px;margin-top:20px;display:flex;justify-content:space-between;gap:20px}.empty{font-size:13px;color:var(--muted);padding:20px;background:#f6f4ed}.toast{position:fixed;bottom:25px;right:25px;background:var(--ink);color:white;padding:10px 18px;font-size:12px;border-radius:3px;z-index:20}.toast[hidden]{display:none}
@media(max-width:900px){main{margin:12px;padding:30px}.bar-inner{padding:10px 20px}.topbar nav{gap:12px}.two,.headline{grid-template-columns:1fr}.confidence{margin-top:0}.mast{gap:10px}.mast h1{font-size:28px}.metrics{grid-template-columns:repeat(2,1fr);gap:18px}.metric:nth-child(2){border:0}.now{gap:15px}.action{grid-template-columns:35px 1fr}.action .owner{grid-column:2;border:0;padding:0}.gaps{columns:1}.metric .value{font-size:28px}}@media(max-width:560px){main{padding:25px 18px;margin:0}.brand{display:none}.topbar nav{width:100%;justify-content:space-between;gap:7px}.mast{display:block}.issue{text-align:left;margin-top:15px}.now{grid-template-columns:1fr;gap:13px}.mast h1{font-size:27px}.headline h2{font-size:23px}.section-head .aside{display:none}.signal{grid-template-columns:1fr;gap:5px}.timeline{grid-template-columns:1fr 1fr;row-gap:20px}.decision-strip{display:block}.decision-strip strong{display:block}.hypothesis{grid-template-columns:1fr}.foot{display:block}}
@media print{@page{size:A4;margin:14mm}.topbar,.chart-tabs,.toast{display:none}body{background:white;font-size:11px}main{max-width:none;margin:0;padding:0;box-shadow:none}.mast h1{font-size:26px}.headline h2{font-size:20px}.section{padding:24px 0;break-inside:auto}.chart,.action,.signal,.metrics{break-inside:avoid}.chart-panel{display:block!important}.chart-panel:not(:first-of-type){display:none!important}details:not([open])>*:not(summary){display:none}.foot{font-size:9px}a{color:inherit}.metrics .value{font-size:23px}.section-head h2{font-size:18px}}
.research-body{margin:24px 0;padding:18px;background:#f7f9fd;border:1px solid var(--line);border-radius:8px}.research-body summary{font-size:15px;font-weight:600;color:var(--ink)}.research-body pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 system-ui,"Microsoft YaHei",sans-serif}.research-body img{max-width:100%}</style></head><body>
<div class="topbar"><div class="bar-inner"><div class="brand">MMOEXP / OPERATING BRIEF</div><nav aria-label="报告导航"><a href="#executive">结论概览</a><a href="#analysis">数据解读</a><a href="#actions">行动计划</a><button id="print-report" type="button">打印 / PDF</button><button class="download" id="download-report" type="button">下载 HTML</button></nav></div></div>
<main>@@BODY@@</main><div id="download-status" role="status" class="toast" hidden></div>
<script>
document.getElementById('print-report').addEventListener('click',()=>window.print());
document.getElementById('download-report').addEventListener('click',()=>{
 const clone=document.documentElement.cloneNode(true);clone.querySelector('#download-status').hidden=true;clone.querySelectorAll('.appendix details,.chart details').forEach(d=>d.removeAttribute('open'));
 const file=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=@@FILENAME_JSON@@;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
 const status=document.getElementById('download-status');status.textContent='已生成离线 HTML 文件';status.hidden=false;setTimeout(()=>status.hidden=true,2500);
});
document.querySelectorAll('[data-chart-tab]').forEach(b=>b.addEventListener('click',()=>{const group=b.closest('figure');group.querySelectorAll('[data-chart-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));group.querySelectorAll('.chart-panel').forEach(x=>x.hidden=x.id!==b.dataset.chartTab)}));
document.querySelectorAll('a[href^="#ev_"]').forEach(a=>a.addEventListener('click',()=>{const item=document.getElementById(a.getAttribute('href').slice(1));if(item){document.getElementById('appendix-root').open=true;item.open=true;setTimeout(()=>item.scrollIntoView({block:'start'}),0)}}));
</script></body></html>
