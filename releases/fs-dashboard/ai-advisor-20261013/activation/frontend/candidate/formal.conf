# Fixed four-file formal analytics entry. No directory-wide alias, credentials or business proxy.
location = /__nav_formal_native_session {
    internal;
    proxy_pass http://127.0.0.1:8895/verify?group=dashboard;
    proxy_method GET;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 302 =401 @nav_formal_native_denied;
}
location @nav_formal_native_denied { return 401; }
location = /dashboard/analytics/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    rewrite ^ /dashboard/analytics/index.html last;
}
location = /dashboard/analytics/index.html {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_formal_native_session;
    error_page 401 = @auth_login;
    alias /var/lib/fs-navigation-formal-static/workspace-native-20261006-48ab939e184b/index.html;
    disable_symlinks on;
    expires -1;
    sub_filter "</body>" "</body>";
}
location = /dashboard/analytics/shell.js {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_formal_native_session;
