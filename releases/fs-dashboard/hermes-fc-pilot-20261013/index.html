<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC 经营调查 · Hermes 试点</title>
<style>body{font:16px/1.65 system-ui;margin:0;background:#f3f5f7;color:#172333}main{max-width:1080px;margin:auto;padding:32px}section{background:white;border:1px solid #dce3eb;border-radius:12px;padding:24px;margin:18px 0}h1{font-size:28px}h2{font-size:20px}label{display:inline-flex;flex-direction:column;margin:8px 16px 8px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #bac6d4;border-radius:6px}textarea{width:95%;min-height:100px}button{cursor:pointer;background:#1765c1;color:white}button:disabled{opacity:.5;cursor:default}.muted{color:#5c6c7e}.warning{color:#a0460b}.finding{border-left:4px solid #4288d5;padding-left:16px;margin:22px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{color:#1765c1}#status{font-weight:600}</style></head>
<body><main><a href="/dashboard/">返回 FS</a><h1>FC 经营调查</h1><p class="muted">Hermes 只读试点。按发现继续查证，输出经营建议；真实成品需负责人验收。</p>
<section><label>任务类型<select id="mode"><option value="investigation">完整周原因调查 · max</option><option value="daily">单日复盘 · high</option><option value="kpi">KPI 风险分析 · high</option><option value="pricing">定价情景研究 · max</option></select></label><label>开始日<input id="start" type="date"></label><label>结束日<input id="end" type="date"></label><p>支持的决策与追问</p><textarea id="question">调查所选完整期间 FC 经营变化。先回看上一期判断，按变化拆量价与结构，自主追加队列、历史和参考利润查证；给优先处理的对象、具体动作、条件和复查标准。</textarea><p><button id="submit">开始只读调查</button> <button id="cancel" disabled>取消当前调查</button></p><p id="status" role="status">正在读取权限和已有结果…</p><p id="usage" class="muted"></p></section>
<section id="result" hidden></section><section><h2>本账号调查记录</h2><div id="history"></div></section><section id="evidence" hidden><h2>证据与查询</h2><pre id="evidenceText"></pre></section>
<p class="muted">Admin 经营主源，Order 参考利润与明细补源。缺失与估算会单独标注。建议尚未执行，当前入口和定时任务的默认分析层未切换。</p></main>
<script>
'use strict';
const api='/dashboard/fs-home/advisor.json';
let current=null,timer=null;
const errorText=code=>({pilot_usage_hold:'模型调用暂时暂停：费用记录待核验，修复放行后可提交新调查。原任务保留，不重复运行。',context_window_exceeded:'当前上下文容量检查未通过，已停止后续模型调用；已产生的用量保留。',provider_payload_too_large:'当前请求超过传输容量，已停止后续模型调用；已产生的用量保留。',provider_outcome_unknown:'模型返回结果尚未确定，任务与费用记录已保留，请等待核验。',model_busy:'模型服务当前正在使用，请稍后发起新的调查。'}[code]||code);
let admissionReason=null;
const $=id=>document.getElementById(id);
function node(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.appendChild(e);return e;}
function dates(){const civil=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());const today=new Date(civil+'T00:00:00Z');const end=new Date(today);if($('mode').value==='daily'){end.setUTCDate(end.getUTCDate()-1);$('start').value=end.toISOString().slice(0,10);$('end').value=$('start').value;return;}const offset=(end.getUTCDay()+6)%7;end.setUTCDate(end.getUTCDate()-offset-1);const start=new Date(end);start.setUTCDate(start.getUTCDate()-6);$('start').value=start.toISOString().slice(0,10);$('end').value=end.toISOString().slice(0,10);}
async function request(path,body){const options=body?{method:'POST',headers:{'Content-Type':'application/json','X-FS-Advisor-Action':'submit'},body:JSON.stringify(body)}:{};const r=await fetch(api+path,{...options,credentials:'same-origin',cache:'no-store'});const value=await r.json();if(!r.ok)throw new Error(errorText(value.error||('HTTP '+r.status)));return value;}
async function history(){const value=await request('?mode=hermes');$('submit').disabled=!value.can_generate;admissionReason=value.admission?.reason||null;$('history').replaceChildren();for(const item of value.items){const b=node('button',item.body.start+' 至 '+item.body.end+' · '+item.state,$('history'));b.style.margin='6px';b.onclick=()=>{current=item.id;poll();};}if(admissionReason)$('status').textContent='当前暂停新调查。'+errorText(admissionReason);else if(!current)$('status').textContent=value.can_generate?'可发起只读调查。':'当前账号可以读取自己的结果，发起调查需要原管理权限。';}
function refs(values,parent){for(const ref of values||[]){const b=node('button','证据 '+ref,parent);b.style.margin='4px';b.onclick=async()=>{try{const value=await request('?mode=hermes&id='+encodeURIComponent(current)+'&evidence='+encodeURIComponent(ref));$('evidence').hidden=false;$('evidenceText').textContent=JSON.stringify(value,null,2);}catch(e){$('status').textContent=e.message;}};}}
function render(job){$('result').replaceChildren();const complete=job.state==='COMPLETED'&&job.result?.model_generated===true;$('cancel').disabled=!['PREPARING','DISPATCH_UNKNOWN','RUNNING','CANCEL_REQUESTED'].includes(job.state);$('status').textContent=complete?'模型调查已完成 · 业务质量待负责人验收':['FAILED','NEEDS_RECONCILE'].includes(job.state)?'分析未完成 · '+errorText(job.error||job.state):job.state==='CANCELLED'?'已取消，并确认无在途代理调用':job.state==='CANCEL_REQUESTED'?'已请求取消，正在核对运行时与在途调用停止':'正在调查 · '+job.state;const u=job.model_usage;$('usage').textContent=u&&u.calls!==null?'模型 '+u.calls+' 次 · '+(u.unknown_calls?'已确定部分：':'')+u.total_tokens+' tokens · 推理 '+u.reasoning_tokens+' tokens · '+(u.estimated_microcny===null?'费用未知（供应商实际金额未核）':'费用预估 ¥'+(u.estimated_microcny/1e6).toFixed(4))+(u.unknown_calls?' · '+u.unknown_calls+' 次用量未确定，不按零计费':'')+(u.invalid_response_calls?' · '+u.invalid_response_calls+' 次响应无效、已保留用量':''):'';if(!complete){$('result').hidden=true;return;}$('result').hidden=false;const r=job.result;node('h2','结论',$('result'));node('p',r.summary,$('result'));node('p','实际业务档位 '+r.reasoning_effort+' · 技能 '+r.skills_version+' · 建议未执行',$('result')).className='muted';for(const f of r.findings){const div=node('div','',$('result'));div.className='finding';node('h3',f.claim_type==='hypothesis'?'待证解释':'事实判断',div);node('p',f.statement,div);if(f.alternative)node('p','替代解释：'+f.alternative,div);if(f.missing)node('p','缺口：'+f.missing,div);refs(f.evidence_ids,div);}node('h2','下一步行动',$('result'));for(const a of r.actions){const div=node('div','',$('result'));node('h3',a.target,div);for(const [label,key] of [['动作','action'],['前提','condition'],['投入与风险','cost_risk'],['复查时点','review_at'],['判断标准','success_check']])node('p',label+'：'+a[key],div);refs(a.evidence_ids,div);}node('h2','旧判断复盘',$('result'));for(const old of r.reviews){node('p',old.old_report_id+' · '+old.status+' · '+old.reason,$('result'));refs(old.evidence_ids,$('result'));}if(!r.reviews.length)node('p','本次未形成可验证的旧判断修正，不能据此声称跨期复盘验收通过。',$('result')).className='warning';node('h2','限制与估算',$('result'));for(const l of r.limitations)node('p',l,$('result'));}
async function poll(){if(timer)clearTimeout(timer);try{const job=await request('?mode=hermes&id='+encodeURIComponent(current));render(job);if(['PREPARING','DISPATCH_UNKNOWN','RUNNING','CANCEL_REQUESTED'].includes(job.state))timer=setTimeout(poll,3000);else await history();}catch(e){$('status').textContent='状态读取失败：'+e.message;}}
$('submit').onclick=async()=>{try{$('submit').disabled=true;const job=await request('',{kind:'hermes_report',request_id:'web_'+crypto.randomUUID().replaceAll('-',''),start:$('start').value,end:$('end').value,question:$('question').value,mode:$('mode').value});current=job.id;render(job);poll();}catch(e){$('status').textContent='未能发起：'+e.message;}finally{history().catch(()=>{});}};
$('cancel').onclick=async()=>{if(!current)return;try{await request('',{kind:'hermes_cancel',id:current});poll();}catch(e){$('status').textContent='取消请求未确认：'+e.message;}};
$('mode').onchange=dates;dates();history().catch(e=>{$('status').textContent='无法读取：'+e.message;$('submit').disabled=true;});
</script></body></html>
