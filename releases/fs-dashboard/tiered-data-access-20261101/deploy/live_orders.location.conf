# Candidate only. Integrate through the existing reviewed nginx publisher.
location = /dashboard/users/live-orders.json {
    if ($request_method !~ "^(GET|POST)$") { return 405; }
    auth_request /__auth_verify;
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Role "";
    proxy_set_header Cookie "MMOEXP_AUTH=$cookie_MMOEXP_AUTH; FS_ACCESS_CANDIDATE=$cookie_FS_ACCESS_CANDIDATE; fc27sess=$cookie_fc27sess";
    proxy_pass http://127.0.0.1:8931/users/live-orders$is_args$args;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
