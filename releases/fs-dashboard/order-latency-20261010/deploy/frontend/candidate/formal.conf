# Exact read-only routes. Identity comes only from the existing auth subrequest.
location = /dashboard/marketing/range.json {
    if ($request_method != GET) { return 405; }
    auth_request /__nav_formal_native_session;
    auth_request_set $traffic_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $traffic_user;
    proxy_pass http://127.0.0.1:8935/range$is_args$args;
    proxy_cache off;
    proxy_read_timeout 90s;
}
location = /dashboard/marketing/business-links.json {
