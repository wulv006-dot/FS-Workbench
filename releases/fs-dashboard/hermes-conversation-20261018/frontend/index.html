<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <title>与 Hermes 对话 · FS</title>
  <link rel="stylesheet" href="/dashboard/workspace-assets/workspace-native-20261006-561eda9b98e2/ui/fs-tokens.css">
  <link rel="stylesheet" href="/dashboard/workspace-assets/workspace-native-20261006-561eda9b98e2/ui/fs-ui.css">
  <script src="/dashboard/workspace-assets/workspace-native-20261006-561eda9b98e2/ui/fs-theme.js"></script>
  <link rel="stylesheet" href="conversation.css">
  <script defer src="conversation.js"></script>
</head>
<body class="fs-ui-page">
  <a class="skip" href="#conversation-main">跳到对话</a>
  <div class="conversation-shell">
    <header class="conversation-header">
      <a href="/dashboard/">FS / MMOEXP</a>
      <a href="/dashboard/fs-home/brain/index.html">研究与报告</a>
    </header>
    <div class="conversation-layout">
      <nav class="conversation-sidebar" aria-label="Hermes 会话">
        <div class="sidebar-head"><strong>会话</strong><button id="new-conversation" type="button" class="fs-btn fs-btn--primary" disabled>新对话</button></div>
        <ul id="conversation-list"><li class="muted">正在读取会话…</li></ul>
      </nav>
      <main id="conversation-main" class="conversation-main" tabindex="-1">
        <header class="main-head"><div><p class="eyebrow">HERMES · FS</p><h1 id="conversation-title">与 Hermes 对话</h1></div><span id="connection-indicator" class="connection-state">正在连接</span></header>
        <div id="messages" class="messages" aria-label="对话消息"><p class="empty">可以直接提问，也可以布置调查。长任务的进度和文件会显示在这里。</p></div>
        <div class="conversation-actions"><button id="stop-run" type="button" class="fs-btn" hidden>停止当前任务</button></div>
        <form id="composer" class="composer">
          <label for="message-input">给 Hermes 发消息</label>
          <textarea id="message-input" rows="3" maxlength="4000" placeholder="例如：今天先看什么？" required disabled></textarea>
          <details id="attachments" class="attachments">
            <summary id="attachment-summary">本轮附件 · 0 / 10</summary>
            <label for="file-input">上传 CSV / XLSX</label>
            <input id="file-input" type="file" accept=".csv,.xlsx" multiple disabled aria-describedby="file-help">
            <p id="file-help" class="muted">单文件最多 10 MiB。上传后请勾选本轮要使用的文件；进行中的任务不更换附件。</p>
            <ul id="upload-list" class="file-list" aria-label="上传状态"></ul>
            <ul id="file-choices" class="file-list" aria-label="选择本轮附件"></ul>
          </details>
          <div class="composer-footer"><span>Enter 换行，Ctrl+Enter 发送</span><button id="send-message" type="submit" class="fs-btn fs-btn--primary" disabled>发送</button></div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </main>
    </div>
  </div>
</body>
</html>
