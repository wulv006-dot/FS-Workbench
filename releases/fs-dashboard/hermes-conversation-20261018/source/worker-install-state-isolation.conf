[Service]
# Based on live install-state-isolation.conf SHA256 bf6d707e668bd58e103f892f6f03b9d2025194419e7c52121e2489b5a971a603.
# Private volatile install state; shared Desktop install ownership stays unchanged.
ExecStart=
ExecStart=/usr/bin/docker run --rm --name fs-hermes-fc --network host --read-only --user 9876:9876 --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --tmpfs /tmp:rw,nosuid,nodev,size=268435456 --tmpfs /profile/installs:rw,nosuid,nodev,uid=9876,gid=9876,mode=0700,size=134217728 --env HOME=/profile --env HERMES_HOME=/profile --env PYTHONPATH=/opt/hermes:/opt/pilot --env PYTHONDONTWRITEBYTECODE=1 --env HERMES_REDACT_SECRETS=true --mount type=bind,source=/opt/fs-hermes-fc,target=/opt/pilot,readonly --mount type=bind,source=/run/fs-hermes-fc,target=/run/fs-hermes-fc,readonly --mount type=bind,source=/var/lib/fs-hermes-fc/profile,target=/profile --mount type=bind,source=/var/lib/fs-hermes-fc/profile/memories,target=/profile/memories,readonly --mount type=bind,source=/var/lib/fs-hermes-fc/profile/skills,target=/profile/skills,readonly --mount type=bind,source=/opt/fs-hermes-fc/runtime-config.yaml,target=/profile/config.yaml,readonly sha256:8251bc53f66565fa9aaf2dea3292ec2ae91db7f3eb57c44f5804ebf6b6853544 /opt/pilot/hermes_worker.py

