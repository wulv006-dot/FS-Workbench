<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>用户分析 · FS</title>
  <link rel="stylesheet" href="/dashboard/workspace-assets/workspace-native-20261006-561eda9b98e2/ui/fs-tokens.css">
  <link rel="stylesheet" href="/dashboard/workspace-assets/workspace-native-20261006-561eda9b98e2/ui/fs-ui.css">
  <link rel="stylesheet" href="./users.css">
  <script src="/dashboard/workspace-assets/workspace-native-20261006-561eda9b98e2/ui/fs-theme.js"></script>
  <script defer src="/__hub/hubnav.js"></script>
  <script type="module" src="./users.js"></script>
</head>
<body class="fs-ui-page" data-fs-module="users">
  <a class="skip-link" href="#main">跳到主内容</a>
  <header>
    <div><h1>用户分析</h1><p id="metadata">正在读取数据截止日</p></div>
    <label>显示主题<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </header>
  <main id="main" tabindex="-1">
    <form id="filters" aria-label="用户分析筛选">
      <section class="panel" aria-labelledby="cohort-title">
        <div class="section-heading"><h2 id="cohort-title">新客复购队列</h2><button type="submit" id="run-query">查询</button></div>
        <div class="fields">
          <label>游戏<select name="game"><option value="all">全部游戏</option></select></label>
          <label>首单月份起<input name="cohort_start" type="month" required></label>
          <label>首单月份止<input name="cohort_end" type="month" required></label>
          <label>时间窗（天）<input name="windows" value="30,90,180" pattern="[0-9]{1,3}(,[0-9]{1,3}){0,4}" aria-describedby="window-hint" required></label>
          <label>沉默期 X（天）<input name="return_after" type="number" min="2" max="364" value="60" required></label>
          <label>回流窗 Y（天）<input name="return_within" type="number" min="3" max="365" value="180" required></label>
        </div>
        <p id="window-hint" class="muted">时间窗按天数升序填写，最多 5 个。复购至少间隔 24 小时，复购率只用覆盖完整的满窗客户计算。</p>
        <p id="query-status" role="status" aria-live="polite"></p>
        <div id="cohorts" hidden>
          <div id="cohort-heat" class="table-scroll" tabindex="0" role="region" aria-label="批次复购热力表"></div>
          <h3>首次复购分布</h3>
          <div id="first-repeat" class="table-scroll" tabindex="0" role="region" aria-label="首次复购分布"></div>
          <h3>沉默后回流</h3>
          <div id="silent-return" class="table-scroll" tabindex="0" role="region" aria-label="沉默后回流"></div>
        </div>
      </section>
      <section class="panel" aria-labelledby="stage-title">
        <h2 id="stage-title">客户阶段</h2>
        <div class="fields">
          <label>期间起<input name="start" type="date" required></label>
          <label>期间止（含）<input name="end" type="date" required></label>
          <label>新老客<select name="customer_type"><option value="all">全部</option><option value="new">新客</option><option value="old">老客</option><option value="unknown">待核</option></select></label>
          <label>是否复购<select name="repeat_status"><option value="all">全部</option><option value="repeated">已复购</option><option value="not_repeated">未复购</option></select></label>
          <button type="submit">应用阶段筛选</button>
        </div>
        <div id="stages" hidden>
          <p id="stage-basis" class="muted"></p>
          <ul class="metric-list" id="stage-counts"></ul>
          <h3>本期流入</h3><ul class="metric-list" id="stage-inflow"></ul>
          <h3>本期回流</h3><ul class="metric-list" id="stage-returns"></ul>
          <h3>每日回流趋势</h3><div id="return-trend"></div>
          <details id="cross-flow"><summary>跨游戏流向</summary><div id="cross-table" class="table-scroll"></div></details>
        </div>
      </section>
    </form>
    <section class="panel" aria-labelledby="person-title">
      <h2 id="person-title">查人</h2>
      <form id="email-search" method="post" action="/dashboard/users/search.json" aria-labelledby="person-title" class="fields">
        <label>客户完整邮箱<input type="email" name="email" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="320" required></label>
        <button type="submit" disabled>查购买记录</button>
      </form>
      <p id="email-status" role="status" aria-live="polite"></p>
      <div id="member-panel" hidden>
        <div class="section-heading"><h3 id="member-title" tabindex="-1">名单</h3><button type="button" id="export">导出 CSV</button></div>
        <p id="member-status" role="status" aria-live="polite"></p>
        <div id="members" class="table-scroll" tabindex="0" role="region" aria-label="客户名单"></div>
        <div class="pager"><button type="button" id="previous">上一页</button><button type="button" id="next">下一页</button></div>
      </div>
    </section>
  </main>
  <dialog id="customer-detail" aria-labelledby="detail-title">
    <div class="section-heading"><h2 id="detail-title">客户购买记录</h2><form method="dialog"><button>关闭</button></form></div>
    <p id="detail-email"></p>
    <h3>时间线</h3><div id="detail-timeline" class="table-scroll"></div>
    <h3>有效订单</h3><div id="detail-orders" class="table-scroll"></div>
  </dialog>
</body>
</html>
