
# channel-effects-20261021: independent readonly dashboard; existing traffic layout unchanged
location = /dashboard/channel-effects { return 302 /dashboard/channel-effects/; }
location = /dashboard/channel-effects/ {
    rewrite ^ /dashboard/channel-effects/index.html last;
}
location = /dashboard/channel-effects/index.html {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_formal_native_session;
    error_page 401 = @auth_login;
    alias /var/lib/fs-navigation-formal-static/channel-effects-8e091906c992/index.html;
    disable_symlinks on;
    add_header Cache-Control "no-store" always;
}
location = /dashboard/channel-effects/channel.js {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_formal_native_session;
    error_page 401 = @auth_login;
    alias /var/lib/fs-navigation-formal-static/channel-effects-8e091906c992/channel.js;
    disable_symlinks on;
    add_header Cache-Control "no-store" always;
}
location = /dashboard/channel-effects/channel.css {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__nav_formal_native_session;
    error_page 401 = @auth_login;
    alias /var/lib/fs-navigation-formal-static/channel-effects-8e091906c992/channel.css;
    disable_symlinks on;
    add_header Cache-Control "no-store" always;
}
location = /dashboard/channel-effects/data.json {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    auth_request /__auth_verify;
    auth_request_set $fs_channel_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $fs_channel_user;
    proxy_set_header X-Auth-Role "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:8931/channels;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    add_header Cache-Control "no-store" always;
}
