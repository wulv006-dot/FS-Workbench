# FC27 SBC: verified original request and trusted identity; no shared ACL changes.
location /dashboard/fc27-sbc/ {
    auth_request /__auth_verify;
    auth_request_set $sbc_user $upstream_http_x_auth_user;
    auth_request_set $sbc_role $upstream_http_x_auth_role;
    error_page 401 = @fc27sbc_need_login;
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SBC-User $sbc_user;
    proxy_set_header X-SBC-Role $sbc_role;
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
}
location = /dashboard/fc27-sbc { return 301 /dashboard/fc27-sbc/; }
location @fc27sbc_need_login { return 302 /__auth/access/?next=$request_uri; }
