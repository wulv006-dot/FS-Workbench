# =============================================================================
# 站内项目工作任务台 · nginx location 片段
# 建立：2026-10-01。由 deploy/patch_nginx.py 以标记块方式 include 进 iggm-web.conf。
#
# 依赖（不得新增/修改）：
#   * 统一登录门户 auth_request 子请求 /__auth_verify  -> 127.0.0.1:8895/verify
#   * 登录跳转命名 location @auth_login                 -> 已存在于主配置
#   * 后端 127.0.0.1:8932                               -> mmoexp-taskboard.service
#
# 权限边界：本片段只做 L1（是否登录、是否在 dashboard 组）。
#           L2（应用角色）与 L3（字段级）由后端依据 $auth_user 判定。
#           身份头由本片段用 proxy_set_header 覆盖写入 —— 客户端自带同名头无效。
# =============================================================================

location = /dashboard/tasks {
    return 301 /dashboard/tasks/;
}

# --- 数据接口（放在静态之前：更长前缀优先，保证 /api/ 不会被静态 alias 吞掉） ---
location ^~ /dashboard/tasks/api/ {
    # 只放行任务台真正使用的四个方法，其余一律 405
    if ($request_method !~ "^(GET|HEAD|POST|PATCH|DELETE)$") { return 405; }

    auth_request /__auth_verify;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $registration_taskboard_role $upstream_http_x_auth_role;
    auth_request_set $registration_taskboard_groups $upstream_http_x_auth_groups;
    error_page 401 = @auth_login;

    # 前缀替换：/dashboard/tasks/api/board  ->  /api/board
    proxy_pass http://127.0.0.1:8932/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ★ 身份唯一来源：用已登录用户名覆盖客户端传来的同名字头
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Groups $registration_taskboard_groups;
    proxy_set_header X-Auth-Role $registration_taskboard_role;

    proxy_pass_request_body on;
    proxy_read_timeout 30s;
    client_max_body_size 1m;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires -1;
}

# --- 静态前端 ---
location ^~ /dashboard/tasks/ {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }

    auth_request /__auth_verify;
    error_page 401 = @auth_login;

    alias /var/www/dashboard/tasks/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;

    # 抑制全局 hub 注入，保持本模块脚本集合可控
    sub_filter "</body>" "</body>";

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'" always;
    expires -1;
}
